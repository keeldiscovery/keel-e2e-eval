# The Claude that wakes on a red matrix (keel-cloud e2e-matrix-design.md §6.4; the founder's rule,
# 2026-09-11: "you should be aware of it and should be able to put in a fix").
#
# One door here, the interactive one: the founder writes @claude on any issue or pull request and
# Claude answers there. The automatic door -- the Claude that reads a red matrix -- is the `wake`
# job at the end of matrix.yml, because an issue opened by a workflow's own token never triggers
# another workflow. Same brief for both: matrix/RED.md.
#
# Authentication is the founder's Max subscription (organisation secret KEEL_RUNTIME_CI_CLAUDE,
# the same `claude setup-token` login the cells use). The Claude GitHub app must be installed on
# this repository for the comments and pull requests to be posted as claude[bot].
name: matrix-red

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: read
  id-token: write

concurrency:
  group: matrix-red-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  mention:
    name: "@claude, asked by the founder"
    if: >-
      github.event_name != 'issues'
      && github.event.comment.user.login != 'github-actions[bot]'
      && contains(github.event.comment.body, '@claude')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          claude_code_oauth_token: ${{ secrets.KEEL_RUNTIME_CI_CLAUDE }}
          track_progress: true
          claude_args: "--allowedTools Read,Edit,Write,Glob,Grep,Bash(gh:*),Bash(git:*),Bash(python3:*),Bash(make unit),Bash(ls:*),Bash(cat:*) --max-turns 60"
