# The e2e matrix on the staging twin.
# spec 020-matrix-workflow; keel-cloud `canon/designs/e2e-matrix-design.md` §6 end to end.
#
# THE REFEREE OWNS THE SCHEDULE (invariant M9). This is the one workflow that decides what runs;
# keel-cloud, keel-runtime, keel-web and keel-connect-skill each carry a four-line
# `dispatch-matrix.yml` that only *tells* this one something changed.
#
# IT IS INERT UNTIL THE FOUNDER SWITCHES IT ON. Every job that costs anything is gated on the
# repository variable KEEL_STAGING_ENABLED being exactly `true`. Until the twin exists (design §13
# steps 1-4), a push to master runs one free job on one Linux runner, prints one line saying the
# matrix is off, and stops -- which is what makes merging this file today safe. Set the variable at
# Settings -> Secrets and variables -> Actions -> Variables.
#
# WHAT IT COSTS WHEN IT IS ON (design §10, narrowed by §15 on 2026-09-13). Runner minutes are
# free: this repository is public. The bill is model spend -- about 13 model jobs for a whole
# journey, two for a short one. A qualifying change buys two short Claude cells; the Sunday
# weekly buys eighteen whole journeys (macOS and Windows x Claude, Copilot, Codex x three
# Pythons) plus one short Spec Kit cell. There is NO nightly since 2026-09-13 (the founder: "we
# cannot afford a nightly run"). That is why `[skip e2e]` in a commit message exists in the
# senders, and why the per-change set is two and not eighteen.
#
# WHAT IT NEVER DOES (invariants M2, M3, M8). It never touches production: the AWS role it assumes
# cannot see `keel-prod` or read `/keel/prod/*`, by policy rather than by convention. A green
# matrix deploys nothing. A red matrix rolls nothing back -- the failing build stays up so the
# founder can sign in as that cell's founder in the morning and look at what it did (§7).

name: matrix

on:
  # The cross-repository half (§6.2). Each sender POSTs {repo, sha, why}; the receiver debounces
  # through `concurrency` below, so five merges in ten minutes cost one run.
  repository_dispatch:
    types: [matrix]
  push:
    branches: [master]
  schedule:
    # ONE cron since 2026-09-13 (design §15): the nightly's `0 3 * * *` is suspended, not the
    # set's name -- `inputs[set]=nightly` by hand still resolves, to no cells.
    - cron: "0 4 * * 0"     # Sunday, 04:00 UTC -- the weekly eighteen, whole
  workflow_dispatch:
    inputs:
      set:
        description: "which named set of cells to run"
        type: choice
        options: [per_change, nightly, weekly]
        default: per_change
      cells:
        description: "optional comma-separated cell ids, e.g. ubuntu-24.04-claude-py3.13"
        type: string
        default: ""
      deploy:
        description: "deploy the twin first (false: cells only, against what staging already runs)"
        type: boolean
        default: true

# §6.2's debounce, in the receiver and never in the senders: one run per source repository, the
# older one cancelled. `client_payload.repo` is the sender's name; a push, a schedule or a hand
# dispatch is this repository's own.
concurrency:
  # A hand dispatch or a schedule is its own group: a doc push to this repository (which the
  # skip marker then turns into a no-op) must not cancel a run somebody asked for by hand
  # (2026-09-11: run 34614215951, cancelled by a [skip e2e] push, opened a false "Matrix is red").
  group: matrix-${{ github.event.client_payload.repo || github.repository }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write     # design decision 8: OIDC into AWS, never a stored access key

env:
  # The twin (§3). One name, fixed by a GoDaddy A record; not a variable, because a second staging
  # hostname would be a second design.
  KEEL_REMOTE_WEB_URL: https://eval.keeldiscovery.com
  AWS_REGION: us-east-1

jobs:
  # ------------------------------------------------------------------------------------- select
  #
  # Free, always, on every event -- and the cheapest place in the whole matrix to fail. It reads
  # matrix/cells.toml with the same `python -m matrix` that `make matrix-check` runs on the
  # founder's Mac, so a cells.toml that drifts from design §5.2 is caught here, before a role is
  # assumed, a box is deployed or a model is asked anything.
  select:
    name: select the cells
    runs-on: ubuntu-24.04
    outputs:
      enabled: ${{ steps.gate.outputs.enabled }}
      deploy: ${{ steps.deploy-gate.outputs.deploy }}
      set: ${{ steps.pick.outputs.set }}
      cells: ${{ steps.pick.outputs.cells }}
      count: ${{ steps.pick.outputs.count }}
      repo: ${{ steps.pick.outputs.repo }}
      sha: ${{ steps.pick.outputs.sha }}
      why: ${{ steps.pick.outputs.why }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - id: pick
        name: Which set, and which cells
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          CRON: ${{ github.event.schedule }}
          INPUT_SET: ${{ inputs.set }}
          INPUT_CELLS: ${{ inputs.cells }}
          PAYLOAD_REPO: ${{ github.event.client_payload.repo }}
          PAYLOAD_SHA: ${{ github.event.client_payload.sha }}
          PAYLOAD_WHY: ${{ github.event.client_payload.why }}
        run: |
          set -euo pipefail
          case "$EVENT" in
            schedule)
              # One cron, one set (design §15, 2026-09-13): every schedule is the weekly. A
              # second cron added here without a set of its own would run the weekly twice.
              set_name=weekly
              why="schedule $CRON" ;;
            workflow_dispatch)
              set_name="${INPUT_SET:-per_change}"
              why="workflow_dispatch by ${{ github.actor }}" ;;
            repository_dispatch)
              set_name=per_change
              why="${PAYLOAD_WHY:-a change in ${PAYLOAD_REPO:-a sibling}}" ;;
            *)
              set_name=per_change
              why="push to master" ;;
          esac
          repo="${PAYLOAD_REPO:-${{ github.repository }}}"
          sha="${PAYLOAD_SHA:-${{ github.sha }}}"
          cells=$(python -m matrix --set "$set_name" --cells "${INPUT_CELLS:-}" --json)
          count=$(python -c 'import json,sys; print(len(json.loads(sys.argv[1])))' "$cells")
          {
            echo "set=$set_name"
            echo "cells=$cells"
            echo "count=$count"
            echo "repo=$repo"
            echo "sha=$sha"
            echo "why=$why"
          } >> "$GITHUB_OUTPUT"
          python -m matrix --set "$set_name" --cells "${INPUT_CELLS:-}"

      - id: gate
        name: Is the twin switched on, and did the founder say [skip e2e]?
        shell: bash
        env:
          ENABLED: ${{ vars.KEEL_STAGING_ENABLED }}
          SET: ${{ steps.pick.outputs.set }}
          COUNT: ${{ steps.pick.outputs.count }}
          WHY: ${{ steps.pick.outputs.why }}
          EVENT: ${{ github.event_name }}
          # §6.2's override, and until spec 021 the FOUR SENDERS honoured it and the receiver did
          # not -- so `[skip e2e]` on a merge to keel-cloud was obeyed and the same words on a
          # merge to this repository were not. Read through the environment, never interpolated
          # into the script: a commit message is a stranger's text and `${{ }}` inside `run:` is
          # substituted before bash ever sees it.
          HEAD_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "push" ] && printf '%s' "${HEAD_COMMIT_MESSAGE:-}" | grep -qF '[skip e2e]'; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Matrix skipped: the head commit says \`[skip e2e]\`. $SET would have run $COUNT cell(s) — $WHY. (The founder's own override, §6.2 — a path filter cannot tell a bug fix from a redesign, so the commit message is the human's word.)" >> "$GITHUB_STEP_SUMMARY"
          elif [ "${ENABLED:-}" = "true" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "Matrix **$SET**, $COUNT cell(s) — $WHY." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Matrix skipped: the staging twin is not switched on (repository variable \`KEEL_STAGING_ENABLED\` is not \`true\`). $SET would have run $COUNT cell(s) — $WHY." >> "$GITHUB_STEP_SUMMARY"
          fi

      # Cells only, two ways: a hand dispatch that says `deploy: false` (a rerun against what the
      # twin already runs), or a repository that has no KEEL_SIBLINGS_TOKEN yet -- in which case
      # the deploy cannot check out the private siblings, so it is skipped with a warning rather
      # than failing and taking every cell down with it. The cells then measure whatever staging
      # has, and the summary says so.
      - id: deploy-gate
        name: Deploy the twin first, or cells only?
        shell: bash
        env:
          ENABLED: ${{ steps.gate.outputs.enabled }}
          INPUT_DEPLOY: ${{ inputs.deploy }}
          EVENT: ${{ github.event_name }}
          SIBLINGS: ${{ secrets.KEEL_SIBLINGS_TOKEN || secrets.KEEL_SIBLINGS }}
        run: |
          set -euo pipefail
          if [ "$ENABLED" != "true" ]; then
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          elif [ "$EVENT" = "workflow_dispatch" ] && [ "${INPUT_DEPLOY:-true}" = "false" ]; then
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "Cells only, by request: the twin was not redeployed; the cells ran against what it already runs." >> "$GITHUB_STEP_SUMMARY"
          elif [ -z "${SIBLINGS:-}" ]; then
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "::warning::KEEL_SIBLINGS_TOKEN is not set, so the twin was not redeployed; the cells ran against what it already runs. Set it (a fine-grained token, read-only Contents on keel-cloud and keel-web) and the deploy job runs first."
            echo "Deploy skipped: \`KEEL_SIBLINGS_TOKEN\` is not set. The cells ran against what the twin already runs." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          fi

  # ------------------------------------------------------------------------------ deploy-staging
  #
  # §6.3: the change that fires the matrix must be ON staging before the cells sign in. This job
  # does from a runner what `deploy.sh` does from the founder's Mac -- same script, same eight
  # steps, same image (invariant M1).
  #
  # On `ubuntu-24.04-arm` so the arm64 image builds natively: the twin is a t4g, and QEMU on an x86
  # runner would be minutes of emulation for an identical artifact.
  deploy-staging:
    name: deploy the twin
    needs: select
    if: needs.select.outputs.deploy == 'true'
    runs-on: ubuntu-24.04-arm
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      deployed: ${{ steps.deploy.outputs.deployed }}
      oidc_tag: ${{ steps.oidc.outputs.tag }}
    steps:
      - name: Check out keel-e2e-eval (the referee, and the stub issuer's source)
        uses: actions/checkout@v4
        with:
          path: keel-e2e-eval

      # keel-cloud and keel-web are private, so a checkout of them needs a token this repository
      # holds: KEEL_SIBLINGS_TOKEN (or KEEL_SIBLINGS -- the founder stored it under that name on
      # 2026-09-11, and either spelling is read), a fine-grained PAT with read-only Contents on those two and
      # nothing else. It is NOT the dispatch token (that one lives in the senders) and it is NOT an
      # AWS credential (there is none, anywhere, by decision 8).
      - name: The siblings' token must exist before anything else is attempted
        shell: bash
        env:
          SIBLINGS: ${{ secrets.KEEL_SIBLINGS_TOKEN || secrets.KEEL_SIBLINGS }}
        run: |
          set -euo pipefail
          if [ -z "${SIBLINGS:-}" ]; then
            echo "::error::KEEL_STAGING_ENABLED is true but the secret KEEL_SIBLINGS_TOKEN is not set."
            echo "::error::It is a fine-grained token with read-only Contents on keeldiscovery/keel-cloud and keeldiscovery/keel-web -- the two private repositories this job checks out. Settings -> Secrets and variables -> Actions -> Secrets."
            exit 1
          fi

      # Full history, because the commit this job must build is named by a SHORT sha (the tag
      # deploy.sh speaks), and `actions/checkout`'s own `ref` cannot resolve one.
      - name: Check out keel-cloud
        uses: actions/checkout@v4
        with:
          repository: keeldiscovery/keel-cloud
          token: ${{ secrets.KEEL_SIBLINGS_TOKEN || secrets.KEEL_SIBLINGS }}
          path: keel-cloud
          fetch-depth: 0

      # keel-web is built into the bundle deploy.sh ships, so it is checked out at the same commit
      # the trigger names when keel-web is what changed, and at master otherwise.
      - name: Check out keel-web
        uses: actions/checkout@v4
        with:
          repository: keeldiscovery/keel-web
          ref: ${{ endsWith(needs.select.outputs.repo, 'keel-web') && needs.select.outputs.sha || 'master' }}
          token: ${{ secrets.KEEL_SIBLINGS_TOKEN || secrets.KEEL_SIBLINGS }}
          path: keel-web

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: The tools deploy.sh names (aws, jq, docker, npm, git)
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v jq >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq jq
          fi
          if ! command -v aws >/dev/null 2>&1; then
            curl -sS "https://awscli.amazonaws.com/awscli-exe-linux-aarch64.zip" -o /tmp/awscli.zip
            unzip -q /tmp/awscli.zip -d /tmp
            sudo /tmp/aws/install
          fi
          aws --version && jq --version && docker --version && npm --version

      - name: Assume keel-ci-deploy (OIDC, no stored key — design decision 8)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.KEEL_CI_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # deploy.sh passes `--profile` on EVERY aws call -- it was written for a Mac with named
      # profiles, and botocore drops the environment credential provider the moment a profile is
      # named explicitly. So the session this runner was just handed is written into a `default`
      # profile, which is what `KEEL_PROFILE="${AWS_PROFILE:-keel}"` in common.sh then picks up.
      # Nothing is printed: `aws configure set` reads its values from the environment.
      - name: Put the assumed session where deploy.sh looks for it
        shell: bash
        run: |
          set -euo pipefail
          aws configure set aws_access_key_id "$AWS_ACCESS_KEY_ID"
          aws configure set aws_secret_access_key "$AWS_SECRET_ACCESS_KEY"
          aws configure set aws_session_token "$AWS_SESSION_TOKEN"
          aws configure set region "$AWS_REGION"
          echo "AWS_PROFILE=default" >> "$GITHUB_ENV"
          aws sts get-caller-identity --query Arn --output text

      # WHICH TAG (§6.3's last paragraph). A keel-cloud change deploys the new keel-cloud; a skill,
      # runtime, web or e2e change stays on the tag the twin already runs, read from
      # /keel/staging/deployed-tag, which deploy.sh itself keeps -- so staging is never behind
      # production when the thing under test is the plugin. Either way the tag is a SHORT sha of
      # the commit this job then checks out, which is invariant M1 stated as a command: the image
      # tag names the source the image was built from, on staging and later on production.
      - id: tag
        name: Which keel-cloud tag the twin should be running
        shell: bash
        working-directory: keel-cloud
        env:
          TRIGGER_REPO: ${{ needs.select.outputs.repo }}
          TRIGGER_SHA: ${{ needs.select.outputs.sha }}
        run: |
          set -euo pipefail
          case "$TRIGGER_REPO" in
            *keel-cloud)
              git checkout --quiet "$TRIGGER_SHA"
              echo "keel-cloud changed: the twin moves to $TRIGGER_SHA" ;;
            *)
              deployed=$(aws ssm get-parameter --name /keel/staging/deployed-tag \
                           --query 'Parameter.Value' --output text 2>/dev/null || echo "")
              if [ -z "$deployed" ] || [ "$deployed" = "None" ]; then
                echo "::error::/keel/staging/deployed-tag is empty: the twin has never been deployed."
                echo "::error::Run ./deploy/bin/deploy.sh --target staging <tag> from the Mac once (design §13 step 1), then re-run this."
                exit 1
              fi
              git checkout --quiet "$deployed"
              echo "the change is elsewhere: the twin stays on $deployed" ;;
          esac
          echo "tag=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      # THE STUB ISSUER'S IMAGE (§3, spec 018). Its tag is the sha1 of the two trees it is built
      # from, so it changes exactly when the stub changes and never when a README does -- which is
      # also what makes "or the tag is absent" one question instead of two: a changed stub IS an
      # absent tag. The ECR repository is IMMUTABLE, so an unchanged stub is never re-pushed.
      - id: oidc
        name: Build and push keel-oidc, only when the stub changed
        shell: bash
        working-directory: keel-e2e-eval
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          set -euo pipefail
          tag=$( { git rev-parse HEAD:stack/stub_oidc; git rev-parse HEAD:stack/containers/oidc; } \
                 | sha1sum | cut -c1-12 )
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if aws ecr describe-images --repository-name keel-oidc \
               --image-ids "imageTag=$tag" >/dev/null 2>&1; then
            echo "keel-oidc:$tag is already in ECR — the stub has not changed."
            echo "built=false" >> "$GITHUB_OUTPUT"
          else
            make oidc-image TAG="$tag" PUSH=1 PLATFORM=linux/arm64 \
              DOCKER_HOST=unix:///var/run/docker.sock \
              OIDC_IMAGE_REPO="$REGISTRY/keel-oidc"
            echo "built=true" >> "$GITHUB_OUTPUT"
          fi
          aws ssm put-parameter --name /keel/staging/oidc-image-tag --type String \
            --overwrite --value "$tag" \
            --description "the keel-oidc image the twin runs; written by keel-e2e-eval's matrix"

      # THE DEPLOY ITSELF. deploy.sh builds the jar, the arm64 image and keel-web's dist/, pushes
      # to ECR and rolls the twin over SSM -- no SSH, no open port 22. KEEL_INSTANCE_ID and
      # KEEL_ELASTIC_IP come from repository variables because the CI role carries no
      # `ec2:Describe*` (§4.2's spec 036 amendment: it cannot be scoped to one instance).
      #
      # It is skipped when the twin ALREADY RUNS the tag -- /keel/staging/deployed-tag, which
      # deploy.sh itself writes last -- and that is the "redeploys the tag" case of §6.3 reaching
      # the same end state for nothing.
      #
      # A tag that is in ECR is NOT the same thing as a twin running it. Until 2026-09-12 this step
      # read the ECR check as "the twin is already on it", and the night the founder deployed
      # production first (prod pushes the same image tag, invariant M1) the keel-cloud dispatch for
      # bd0b0a0 found the tag in ECR, said so, and left the twin on 8d0f69a -- six commits behind,
      # with the apex change untested, while every cell reported green. keel-cloud's repository is
      # IMMUTABLE, so this job cannot push the tag again either: it fails loudly, names the two
      # tags, and says which command moves the twin. Red is the right colour for a twin the
      # referee cannot move; green on the wrong build was the fault.
      - id: deploy
        name: deploy.sh --target staging
        shell: bash
        working-directory: keel-cloud
        env:
          KEEL_INSTANCE_ID: ${{ vars.KEEL_INSTANCE_ID }}
          KEEL_ELASTIC_IP: ${{ vars.KEEL_ELASTIC_IP }}
          KEEL_WEB_DIR: ${{ github.workspace }}/keel-web
          TAG: ${{ steps.tag.outputs.tag }}
          OIDC_BUILT: ${{ steps.oidc.outputs.built }}
        run: |
          set -euo pipefail
          if [ -z "${KEEL_INSTANCE_ID:-}" ] || [ -z "${KEEL_ELASTIC_IP:-}" ]; then
            echo "::error::KEEL_INSTANCE_ID and KEEL_ELASTIC_IP must both be set as repository variables (the CI role has no ec2:Describe*)."
            exit 1
          fi
          running=$(aws ssm get-parameter --name /keel/staging/deployed-tag \
                      --query 'Parameter.Value' --output text 2>/dev/null || echo "")
          if [ "$running" = "$TAG" ]; then
            echo "the twin already runs keel-cloud:$TAG (/keel/staging/deployed-tag); not redeploying."
            echo "deployed=skipped" >> "$GITHUB_OUTPUT"
            if [ "$OIDC_BUILT" = "true" ]; then
              echo "::notice::A new keel-oidc image was pushed, and /keel/staging/oidc-image-tag now names it. The twin picks it up on its next deploy; to take it now, run ./deploy/bin/deploy.sh --target staging <a new keel-cloud tag> from the Mac."
            fi
          elif aws ecr describe-images --repository-name keel-cloud \
                 --image-ids "imageTag=$TAG" >/dev/null 2>&1; then
            echo "::error::keel-cloud:$TAG is already in ECR (production took it first) but the twin runs ${running:-nothing}. ECR tags are immutable, so this job cannot push it again; the cells would test the wrong build."
            echo "::error::Move the twin from the Mac: ./deploy/bin/deploy.sh --target staging $TAG -- then re-run this."
            echo "The twin is behind: it runs \`${running:-nothing}\`, keel-cloud asked for \`$TAG\`, and only the Mac can move it (\`./deploy/bin/deploy.sh --target staging $TAG\`)." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          else
            ./deploy/bin/deploy.sh --target staging "$TAG"
            echo "deployed=$TAG" >> "$GITHUB_OUTPUT"
          fi

      # §6.3's gate: THE CELLS START ONLY WHEN BOTH OF THESE ANSWER. `/v2/me` 401 is keel-cloud
      # listening with Flyway migrated and the security chain wired; the discovery document is
      # sign-in itself, because on staging the stub IS the door (§4.1).
      - name: The gate — /v2/me answers 401 and the issuer's discovery answers 200
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            me=$(curl -s -o /dev/null -w '%{http_code}' "$KEEL_REMOTE_WEB_URL/v2/me" || echo 000)
            oidc=$(curl -s -o /dev/null -w '%{http_code}' \
                     "$KEEL_REMOTE_WEB_URL/oidc/.well-known/openid-configuration" || echo 000)
            echo "attempt $attempt: /v2/me $me, /oidc discovery $oidc"
            if [ "$me" = "401" ] && [ "$oidc" = "200" ]; then
              echo "The twin is up: $KEEL_REMOTE_WEB_URL" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 10
          done
          echo "::error::The twin did not answer: /v2/me wanted 401 (got $me), the issuer's discovery wanted 200 (got $oidc). No cell runs."
          exit 1

  # ---------------------------------------------------------------------------------------- cell
  #
  # One job per cell (§5.3). Checkout, this cell's Python, the harness, the host's own CLI from
  # npm, and the journey against the twin. THE PLUGIN COMES FROM THE PUBLIC MARKETPLACE, never from
  # a checkout (decision 5): the scenario does that itself, exactly as a founder would.
  #
  # A cell's Python is the RUNTIME's -- what `python3` resolves to when the host CLI runs the
  # skill's script. The harness itself needs 3.11+ (tomllib, and this repository's own floor), so it
  # gets its own interpreter and the cell's Python is left to be the thing under test.
  cell:
    name: ${{ matrix.cell.id }}
    needs: [select, deploy-staging]
    # A skipped deploy (cells only) still runs the cells; a failed one does not.
    if: >-
      !cancelled()
      && needs.select.outputs.enabled == 'true'
      && needs.deploy-staging.result != 'failure'
      && needs.deploy-staging.result != 'cancelled'
    runs-on: ${{ matrix.cell.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        cell: ${{ fromJSON(needs.select.outputs.cells) }}
    defaults:
      run:
        shell: bash      # Git bash on Windows; nothing below is written twice
    env:
      # spec 017's remote profile: URLs, not processes. `make up` is never run here -- the twin is
      # already up, and a referee that could tear down the thing it is refereeing is a footgun.
      # Python's UTF-8 mode: every default encoding -- file reads and writes, subprocess text,
      # the console -- is UTF-8, on Windows too, where the locale is cp1252 and the harness's own
      # evidence files carry the CLIs' check marks and padlocks (fifth cloud run, 2026-09-11:
      # "'charmap' codec can't encode character '\u2705'" while writing a transcript).
      PYTHONUTF8: "1"
      # The runtime's per-job executor timeout (KEEL_JOB_TIMEOUT_SECONDS, default 300). A Claude
      # assumptions card took 178 s, 256 s and then more than 300 s on the founder's Max token
      # (2026-09-11, run 34600368707: EXECUTOR_TIMEOUT on COMMERCIAL_ASSUMPTIONS), so a cell gives
      # the model seven minutes -- still inside the harness's own 480 s wait for the card, so a
      # job that overruns is read back as a failure rather than as a silence.
      KEEL_JOB_TIMEOUT_SECONDS: "420"
      KEEL_EVAL_PROFILE: remote
      KEEL_REMOTE_GATE_USER: harness
      KEEL_REMOTE_GATE_PASSWORD: ${{ secrets.KEEL_STAGING_HARNESS_PASSWORD }}
      # §4.3: this is the name of the founder the cell registers with the twin's picker, which is
      # what the founder reads in the morning.
      KEEL_REMOTE_CELL: ${{ matrix.cell.id }}
      KEEL_JOURNEY_HOST: ${{ matrix.cell.host }}
      # spec 021: `short` on the four per-change cells -- the host leg and the first model job --
      # and `full` everywhere else. The cell's own field, so the set decides and the job reads.
      KEEL_JOURNEY_LEGS: ${{ matrix.cell.legs }}
      # spec 022: `plugin` (the marketplace) or `speckit` (the extension, added to a project).
      KEEL_JOURNEY_INSTALL: ${{ matrix.cell.install }}
    steps:
      - uses: actions/checkout@v4

      # The referee runs two things itself on the remote profile -- the bundled runtime, for
      # `status` and `disconnect`, and the canary's cap sources -- and both live in the two PUBLIC
      # siblings. They are checked out inside the workspace (actions/checkout cannot go above it)
      # and stack.toml is pointed at them; the two private siblings are not needed here, and the
      # remote profile no longer asks for them (spec 020, first cloud run).
      - name: Check out keel-connect-skill (public)
        uses: actions/checkout@v4
        with:
          repository: keeldiscovery/keel-connect-skill
          path: siblings/keel-connect-skill

      - name: Check out keel-runtime (public)
        uses: actions/checkout@v4
        with:
          repository: keeldiscovery/keel-runtime
          path: siblings/keel-runtime

      # THE GOLDEN CORPUS, and the third sibling a cell needs (spec 021). S-012's founder is a
      # corpus founder now -- the entry's title, market and three statements, and its first
      # person's own story and picks -- and the weekly's corpus cell (S-005/6/7) reads the same directory.
      # keel-cloud is private, so this is the read-only siblings token and nothing but the corpus
      # directory: a sparse checkout of about 60 kB, never the repository.
      #
      # A cell without the token gets a warning here and a NAMED failure in the scenario
      # ("no corpus at ..."), never a quiet fallback to some other founder. A bundle that
      # measured a different person than it says it did is worse than one that measured nobody.
      - id: siblings-token
        name: Is there a token for the private sibling the corpus lives in?
        env:
          SIBLINGS: ${{ secrets.KEEL_SIBLINGS_TOKEN || secrets.KEEL_SIBLINGS }}
        run: |
          set -euo pipefail
          if [ -n "${SIBLINGS:-}" ]; then
            echo "have=true" >> "$GITHUB_OUTPUT"
          else
            echo "have=false" >> "$GITHUB_OUTPUT"
            echo "::warning::KEEL_SIBLINGS_TOKEN is not set, so keel-cloud's golden corpus cannot be checked out. S-012's founder and the corpus scenarios read it, and this cell will fail by name rather than measure a founder nobody wrote down."
          fi

      - name: Check out keel-cloud's golden corpus (private, read-only, that directory only)
        if: steps.siblings-token.outputs.have == 'true'
        uses: actions/checkout@v4
        with:
          repository: keeldiscovery/keel-cloud
          token: ${{ secrets.KEEL_SIBLINGS_TOKEN || secrets.KEEL_SIBLINGS }}
          path: siblings/keel-cloud
          sparse-checkout: canon/designs/measured-beliefs/corpus
          sparse-checkout-cone-mode: false

      - name: Bundle the runtime into the skill, and point stack.toml at the siblings
        run: |
          set -euo pipefail
          src=siblings/keel-runtime; dst=siblings/keel-connect-skill
          rm -rf "$dst/keel_runtime"
          cp -R "$src/keel_runtime" "$dst/keel_runtime"
          find "$dst/keel_runtime" -name '__pycache__' -type d -prune -exec rm -rf {} +
          version=$(awk -F'"' '/^__version__/ {print $2; exit}' "$src/keel_runtime/__init__.py")
          printf '%s+%s\n' "$version" "$(git -C "$src" rev-parse --short HEAD)" > "$dst/RUNTIME_VERSION"
          cat "$dst/RUNTIME_VERSION"
          python - <<'PY'
          import re, pathlib
          p = pathlib.Path("stack.toml"); s = p.read_text()
          s = re.sub(r'^keel_runtime = .*$', 'keel_runtime = "siblings/keel-runtime"', s, flags=re.M)
          s = re.sub(r'^keel_connect_skill = .*$', 'keel_connect_skill = "siblings/keel-connect-skill"', s, flags=re.M)
          s = re.sub(r'^keel_cloud = .*$', 'keel_cloud = "siblings/keel-cloud"', s, flags=re.M)
          p.write_text(s); print(s.split("[ports]")[0])
          PY

      - id: harness-python
        name: The harness's own interpreter (3.12), which is never the cell's axis
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Last wins on PATH: from here, `python3` is the cell's Python, which is what the skill's
      # script and the bundled runtime are run by. That is the axis (§5.1, spec 004's floor).
      - name: The cell's Python (${{ matrix.cell.python }}) — the runtime's
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.cell.python }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install the harness and Playwright's chromium
        env:
          HARNESS_PYTHON: ${{ steps.harness-python.outputs.python-path }}
        run: |
          set -euo pipefail
          "$HARNESS_PYTHON" -m venv .venv
          if [ "$RUNNER_OS" = "Windows" ]; then venv_py=".venv/Scripts/python.exe"; else venv_py=".venv/bin/python"; fi
          echo "VENV_PY=$venv_py" >> "$GITHUB_ENV"
          "$venv_py" -m pip install -q --upgrade pip
          "$venv_py" -m pip install -q -r requirements.txt
          "$venv_py" -m playwright install chromium
          "$venv_py" --version
          python3 --version      # the cell's own, for the record

      # Installed exactly as keel-runtime's acceptance.yml installs them, including the 1.0.83 pin
      # that spec 005's prompt-transport amendment measured.
      # `claude plugin install` clones the plugin repository over SSH (`git@github.com:`), and a
      # runner has no key: "Permission denied (publickey)", first cloud run 2026-09-11. Git's own
      # rewrite sends that clone over HTTPS instead, which a public repository answers to anyone.
      # (Recorded for the product: a founder with no GitHub SSH key would meet the same wall.)
      - name: Clone GitHub over HTTPS, never SSH (a runner has no key)
        run: git config --global url."https://github.com/".insteadOf "git@github.com:"

      - name: Install the Claude Code CLI from npm, version printed
        if: matrix.cell.host == 'claude'
        run: |
          npm install -g @anthropic-ai/claude-code
          claude --version

      - name: Install the Copilot CLI from npm, pinned to 1.0.83, version printed
        if: matrix.cell.host == 'copilot'
        run: |
          npm install -g @github/copilot@1.0.83 || npm install -g @github/copilot@latest
          copilot --version
      # keel-runtime spec 008: the unmeasured host. Unpinned on purpose -- the version the day has
      # is what the release notes will name once the gate is green -- and printed for the record.
      - name: Install the Codex CLI from npm, version printed
        if: matrix.cell.host == 'codex'
        run: |
          npm install -g @openai/codex
          codex --version

      - name: Install Spec Kit's CLI into the harness venv, pinned, and build the extension tree
        if: matrix.cell.install == 'speckit'
        run: |
          set -euo pipefail
          .venv/bin/python -m pip install -q "git+https://github.com/github/spec-kit.git@v1.0.6"
          .venv/bin/specify --version
          make -C siblings/keel-connect-skill dist
          ls siblings/keel-connect-skill/dist/speckit

      - name: Note which run bundles existed before this cell ran
        run: |
          set -euo pipefail
          ls runs > runs-before.txt 2>/dev/null || : > runs-before.txt

      # The journey, and — on the one weekly cell that carries them — the corpus scenarios.
      # `make eval-live` is the founder's own command; Windows runners have no `make`, so the same
      # command's body is spelled out there and nowhere else.
      - name: Run ${{ join(matrix.cell.scenarios, ', ') }}
        env:
          # Claude cells run on the founder's Max subscription: KEEL_RUNTIME_CI_CLAUDE is the
          # organisation secret holding a `claude setup-token` login, handed to the CLI as
          # CLAUDE_CODE_OAUTH_TOKEN (the founder's decision, 2026-09-11). The console key is the
          # fallback and is passed only when the subscription token is absent, so the two never
          # compete for the CLI's attention.
          CLAUDE_CODE_OAUTH_TOKEN: ${{ matrix.cell.host == 'claude' && secrets.KEEL_RUNTIME_CI_CLAUDE || '' }}
          # ...and its twin, because Claude Code strips CLAUDE_CODE_OAUTH_TOKEN by exact name from
          # the shell the runtime is started in (measured 2026-09-11); the runtime hands the twin
          # to its own claude under the real name (keel-runtime executor, _CREDENTIAL_TWINS).
          KEEL_CLAUDE_CODE_OAUTH_TOKEN: ${{ matrix.cell.host == 'claude' && secrets.KEEL_RUNTIME_CI_CLAUDE || '' }}
          ANTHROPIC_API_KEY: ${{ matrix.cell.host == 'claude' && secrets.KEEL_RUNTIME_CI_CLAUDE == '' && secrets.ANTHROPIC_API_KEY || '' }}
          # KEEL_RUNTIME_CI_COPILOT is the organisation secret's name. It is handed to the cell as
          # GH_TOKEN, NOT as COPILOT_GITHUB_TOKEN: measured 2026-09-11 (first cloud run, then two
          # probes on the founder's Mac), the Copilot CLI strips COPILOT_GITHUB_TOKEN from the
          # shells it runs its tools in and leaves GH_TOKEN alone. The runtime is started from
          # inside such a shell (the skill's script), so under the first name it reached the
          # executor with nothing and every job failed EXECUTOR_AUTH_FAILED; under the second, the
          # host, the skill, the runtime and the executor all see the same token (the CLI's own
          # precedence: COPILOT_GITHUB_TOKEN > GH_TOKEN > GITHUB_TOKEN > the stored login).
          GH_TOKEN: ${{ matrix.cell.host == 'copilot' && secrets.KEEL_RUNTIME_CI_COPILOT || '' }}
          # KEEL_RUNTIME_CI_CODEX is an OpenAI API key (the founder's, 2026-09-12; billed per
          # token on the API, not on a ChatGPT plan). It reaches the cell as KEEL_CODEX_API_KEY
          # and nothing else: measured, `codex exec` ignores OPENAI_API_KEY in the environment,
          # so the harness's Codex host signs the cell's own isolated CODEX_HOME in with
          # `codex login --with-api-key` (harness/codex_host.py), and the key is never written
          # anywhere the bundle carries. No model pin: Codex's unmeasured run answers with the
          # account's default and the runtime's startup line says model=default (spec 008).
          KEEL_CODEX_API_KEY: ${{ matrix.cell.host == 'codex' && secrets.KEEL_RUNTIME_CI_CODEX || '' }}
          # C-5's pin, spec 016: gpt-5.6-luna emits the `phase` key CopilotExecutor reads, and the
          # plan's own default (claude-sonnet-5) does not -- runs/DRIFT.md #59. Claude has no
          # counterpart: keel-runtime's Claude executor takes no model, so a Claude cell's runtime
          # model is recorded, not pinned (spec 019).
          KEEL_COPILOT_MODEL: ${{ matrix.cell.host == 'copilot' && 'gpt-5.6-luna' || '' }}
          LIVE_K: ${{ matrix.cell.live_k }}
          EVAL_K: ${{ matrix.cell.eval_k }}
        run: |
          set -euo pipefail
          status=0
          # Windows runners DO carry a `make` (Git for Windows), and the Makefile's venv rule is
          # POSIX (`.venv/bin/python`) -- first cloud run, 2026-09-11 -- so the decision is the
          # OS, never `command -v make`.
          use_make=1; [ "$RUNNER_OS" = "Windows" ] && use_make=0
          if [ -n "$LIVE_K" ]; then
            if [ "$use_make" = 1 ]; then
              make eval-live K="$LIVE_K" HOST="$KEEL_JOURNEY_HOST" PROFILE=remote || status=$?
            else
              "$VENV_PY" -m pytest evals -q -rs -l -m live -k "$LIVE_K" || status=$?
            fi
          fi
          if [ -n "$EVAL_K" ]; then
            if [ "$use_make" = 1 ]; then
              make eval K="$EVAL_K" PROFILE=remote || status=$?
            else
              "$VENV_PY" -m pytest evals -q -rs -l -m "not live" -k "$EVAL_K" || status=$?
            fi
          fi
          exit $status

      # Always: a red cell is exactly the cell whose bundle the founder wants. The bundles are
      # found by diffing `runs/` against the listing taken before the run rather than by globbing
      # it: `runs/` is gitignored (only DRIFT.md is tracked), so a fresh checkout starts empty --
      # but a cell that runs four scenarios writes four bundles, and the row belongs to the ones
      # THIS run wrote.
      - name: Collect this cell's run bundles and its summary row
        if: always()
        env:
          CELL: ${{ matrix.cell.id }}
          SET: ${{ needs.select.outputs.set }}
        run: |
          set -euo pipefail
          # The venv when there is one; the cell's own Python when the install step is what failed.
          "${VENV_PY:-python3}" - <<'PY'
          import json, os, pathlib, shutil

          # UTF-8 everywhere, explicitly: a failed step is named "§1.2 SOLUTION" and a row
          # carries an em dash, and Windows would otherwise read and write these in cp1252 and
          # take the whole bundle down with a UnicodeEncodeError at the last step.

          cell = os.environ["CELL"]
          # Tolerant of a cell that died before it got as far as listing: this step is
          # `if: always()`, and a step that crashes here would take the bundle with it.
          listing = pathlib.Path("runs-before.txt")
          before = set(listing.read_text(encoding="utf-8").split()) if listing.is_file() else set()
          runs = pathlib.Path("runs")
          new = sorted(d for d in runs.iterdir()
                       if d.is_dir() and d.name not in before) if runs.is_dir() else []

          out = pathlib.Path("_cell")
          (out / "runs").mkdir(parents=True, exist_ok=True)
          rows = []
          for bundle in new:
              shutil.copytree(bundle, out / "runs" / bundle.name, dirs_exist_ok=True)
              verdict = bundle / "verdict.json"
              if verdict.is_file():
                  v = json.loads(verdict.read_text(encoding="utf-8"))
                  rows.append({
                      "cell": cell,
                      "scenario": v.get("scenario", bundle.name),
                      "verdict": "PASSED" if v.get("passed") else "FAILED",
                      "score": v.get("score"),
                      "failed_step": v.get("failed_step"),
                      "bundle": bundle.name,
                  })
          if not rows:
              rows.append({"cell": cell, "scenario": "(none)", "verdict": "NO BUNDLE",
                           "score": None, "failed_step": "the run wrote no verdict.json",
                           "bundle": "-"})
          (out / "rows.json").write_text(json.dumps(rows, indent=2), encoding="utf-8")

          header = ("| cell | scenario | verdict | score | failed step |\n"
                    "|---|---|---|---|---|\n")
          body = "".join(
              f"| `{r['cell']}` | {r['scenario']} | **{r['verdict']}** | "
              f"{'—' if r['score'] is None else r['score']} | {r['failed_step'] or '—'} |\n"
              for r in rows)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as handle:
              handle.write(header + body)
          PY

      - name: Upload this cell's run bundles
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runs-${{ matrix.cell.id }}
          path: _cell/runs
          retention-days: 30      # §6.4's own number
          if-no-files-found: warn

      - name: Upload this cell's summary row
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: row-${{ matrix.cell.id }}
          path: _cell/rows.json
          retention-days: 7
          if-no-files-found: warn

  # ------------------------------------------------------------------------------------- summary
  #
  # §6.4's third place a verdict is recorded: ONE TABLE, eighteen rows at most. (The other two are
  # the run bundle above, and the label on the founder the cell signed in as, which the scenario
  # itself patches into the twin's registry -- that is the dropdown the founder opens in the
  # morning, and it is written by `stack/remote.py`, not here.)
  summary:
    name: the table
    needs: [select, deploy-staging, cell]
    if: always() && needs.select.outputs.enabled == 'true'
    runs-on: ubuntu-24.04
    # Scoped to this job alone (spec 021): the whole workflow reads contents and mints an OIDC
    # token, and exactly one job of it may write an issue. A job-level block REPLACES the
    # workflow's, so `contents: read` is restated here -- and `id-token` is not, because nothing
    # in this job goes near AWS.
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/download-artifact@v4
        with:
          pattern: row-*
          path: rows
          merge-multiple: false

      - id: table
        name: One table
        shell: bash
        env:
          SET: ${{ needs.select.outputs.set }}
          WHY: ${{ needs.select.outputs.why }}
          REPO: ${{ needs.select.outputs.repo }}
          SHA: ${{ needs.select.outputs.sha }}
          TAG: ${{ needs.deploy-staging.outputs.tag }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, pathlib

          rows = []
          for path in sorted(pathlib.Path("rows").rglob("rows.json")):
              rows.extend(json.loads(path.read_text(encoding="utf-8")))
          rows.sort(key=lambda r: (r["cell"], r["scenario"]))

          lines = [
              f"## Matrix `{os.environ['SET']}` — {os.environ['WHY']}",
              "",
              f"`{os.environ['REPO']}` at `{os.environ['SHA']}`, against "
              f"https://eval.keeldiscovery.com on keel-cloud `{os.environ['TAG']}`.",
              "",
              "| cell | scenario | verdict | score | failed step |",
              "|---|---|---|---|---|",
          ]
          for r in rows:
              score = "—" if r.get("score") is None else r["score"]
              lines.append(f"| `{r['cell']}` | {r['scenario']} | **{r['verdict']}** | "
                           f"{score} | {r.get('failed_step') or '—'} |")
          if not rows:
              lines.append("| — | — | no rows were uploaded | — | — |")
          lines += ["", "Each cell's bundle is the artifact named `runs-<cell>` (30 days); "
                        "`make report RUN=runs/<id>` rebuilds its report.html from a downloaded one.",
                    "", "A red cell is information, never a trigger: production deploys stay a "
                        "founder's command from the Mac (invariant M8)."]
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as handle:
              handle.write("\n".join(lines) + "\n")

          # The same table, on its own, for the issue below to carry -- and the two numbers its
          # decision turns on, written where a `run:` block can read them without parsing YAML.
          pathlib.Path("table.md").write_text("\n".join(lines[4:]) + "\n", encoding="utf-8")
          red = any((r.get("verdict") or "").upper() != "PASSED" for r in rows)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"red={'true' if red else 'false'}\n")
              handle.write(f"ran_any={'true' if rows else 'false'}\n")
          PY

      # ------------------------------------------------------------------------- and one issue
      #
      # §6.4 records a verdict in three places a founder has to GO AND LOOK AT. A red matrix on a
      # Sunday night is a red matrix nobody sees until Monday, so this is the fourth: ONE issue,
      # titled `Matrix is red`, labelled `matrix`. A second red run comments on it rather than
      # opening a second; the first all-green run says "green again" and closes it.
      #
      # The decision -- which of open / comment / close / nothing, and with what body -- is
      # `python -m matrix.notify`, held by `tests/test_matrix_notify.py`, because four branches
      # and two edge cases inside a `run:` block are four branches nothing can check. What is left
      # here is four `gh issue` calls with no branches of their own.
      #
      # STILL NOT A TRIGGER (invariant M8, decision 12). An issue is information. Nothing here
      # deploys anything, rolls anything back, or touches production.
      - name: Tell the founder when the matrix turns red, and when it is green again
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RED: ${{ steps.table.outputs.red || 'true' }}
          RAN_ANY: ${{ steps.table.outputs.ran_any || 'false' }}
          CELLS_RESULT: ${{ needs.cell.result }}
          SET: ${{ needs.select.outputs.set }}
          WHY: ${{ needs.select.outputs.why }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          # A cell job that failed outright -- crashed before pytest, or timed out -- wrote no
          # row, so the table cannot see it. Either reading of red is red, and a matrix where
          # every cell crashed is the reddest one there is: it ALSO counts as having run, or the
          # "measured nothing, say nothing" rule below would swallow it.
          red="$RED"
          ran_any="$RAN_ANY"
          case "$CELLS_RESULT" in
            failure)   red=true; ran_any=true ;;
            success)   ran_any=true ;;
            # A cancelled run measured nothing: not red, not green, no issue either way (the
            # false alarm of 2026-09-11 was exactly this).
            cancelled) red=false; ran_any=false ;;
          esac
          # Found by TITLE, not by label: `gh issue list --label matrix` fails outright on a
          # repository where nobody has created that label yet, which is every repository until
          # the first red run -- and failing to find the issue must never fail the step.
          number=$(gh issue list --state open --limit 100 \
                     --json number,title \
                     --jq 'map(select(.title == "Matrix is red")) | first | .number // empty' \
                     || true)
          plan=$(python -m matrix.notify --red "$red" --ran-any "$ran_any" \
                   --issue "${number:-}" --table-file table.md --run-url "$RUN_URL" \
                   --set "$SET" --why "$WHY" --body-out issue-body.md)
          action=$(python -c 'import json,sys; print(json.loads(sys.argv[1])["action"])' "$plan")
          why=$(python -c 'import json,sys; print(json.loads(sys.argv[1])["why"])' "$plan")
          echo "$action: $why"
          case "$action" in
            open)    # ...and the label has to exist before an issue may carry it. Idempotent,
                     # and its failure is never this step's failure.
                     gh label create matrix --color d73a4a \
                       --description "the e2e matrix on the staging twin" 2>/dev/null || true
                     gh issue create --title "Matrix is red" --label matrix --body-file issue-body.md ;;
            comment) gh issue comment "$number" --body-file issue-body.md ;;
            close)   gh issue comment "$number" --body-file issue-body.md
                     gh issue close "$number" ;;
            *)       : ;;
          esac
