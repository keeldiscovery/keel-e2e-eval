# Spec 063: the example gallery's map, one [[gallery]] table an entry, in the order the gallery reads before FR-1's
# B2B / B2C alternation. Amendment of record, 2026-10-23 (the founder): the real company name is the example's
# attribution, everywhere -- "it's okay to give the actual company name, in fact reference it, but we should be very
# careful to say that this is a simulated report". So nothing is renamed any more (`replaces = []`), and every entry
# carries what the public files attribute it with. `evals/gallery.py` refuses a slug missing any of it.
#
#   entry              -- the back-test entry id (keel-cloud `canon/designs/measured-beliefs/backtest/<entry>.yaml`)
#   slug               -- the directory under public/sample/ (lowercase letters, digits and hyphens, from the name)
#   name               -- the company's name, as the example is attributed
#   replaces           -- [] since 2026-10-23 (the rename map went)
#   inspired_by        -- {name, batch, ycUrl}: the YC batch as the YC company page names it, and that page (the
#                         `sources` file's YC company page line)
#   public_description -- {text, url, date}: the company's own one-liner, verbatim -- the `one_liner` the YC company
#                         page served -- with the page and the date it was read (2026-10-22, the saved copies the
#                         back-test was written from; spec 063 tasks.md, the amendment's calls)
#   axes               -- optional: any of the seven gallery words written here wins over the one derived from the run.

[[gallery]]
entry = "08-fresco"
slug = "fresco"
name = "Fresco"
replaces = []
inspired_by = { name = "Fresco", batch = "Fall 2024", ycUrl = "https://www.ycombinator.com/companies/fresco" }
public_description = { text = "AI copilot for construction estimators", url = "https://www.ycombinator.com/companies/fresco", date = "2026-10-22" }

