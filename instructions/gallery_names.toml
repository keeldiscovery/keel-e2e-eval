# Spec 063: the example gallery's map, one [[gallery]] table an entry, in the order the gallery reads before FR-1's
# B2B / B2C alternation. Amendment of record, 2026-10-23 (the founder): the real company name is the example's
# attribution, everywhere -- "it's okay to give the actual company name, in fact reference it, but we should be very
# careful to say that this is a simulated report". So nothing is renamed any more (`replaces = []`), and every entry
# carries what the public files attribute it with. `evals/gallery.py` refuses a slug missing any of it.
#
#   entry              -- the back-test entry id (keel-cloud `canon/designs/measured-beliefs/backtest/<entry>.yaml`)
#   slug               -- the directory under public/sample/ (lowercase letters, digits and hyphens, from the name)
#   name               -- the company's name, as the example is attributed
#   replaces           -- [] since 2026-10-23 (the rename map went)
#   inspired_by        -- {name, batch, ycUrl}: the YC batch as the YC company page names it, and that page (the
#                         `sources` file's YC company page line)
#   public_description -- {text, url, date}: the company's own words for the idea the example studies, verbatim, from
#                         the LAUNCH-ERA source (spec 063, amended 1d42c51; gap 11: every example is pinned to the idea
#                         as launched) -- the Launch YC post's title, its URL (the `sources` file's Launch YC line) and
#                         the post's date. The sources files only paraphrase the titles, so the words are from the
#                         post as the saved YC pages of 2026-10-22 carry it (tasks.md, the amendment's calls).
#   status_today       -- optional, the same shape: the company's current YC one-liner, verbatim, its company page and
#                         the date it was read -- written only where it differs from the launch-era words (AirCaps'
#                         is the same, so it has none).
#   cluster            -- {id, label}: the topic cluster of the diversity research (scratchpad
#                         backtest/diversity/clusters_k30.json, K 30, seed 11; the label as its page names cluster `id`).
#                         Palus Finance and AirCaps are placed by the coordinator's call (27, 6), not by the k-means
#                         assignment in that file (21, 13) -- tasks.md, the amendment's calls.
#   keywords           -- optional: 5 to 12 lower-case words or short phrases; when written they replace the ones
#                         `evals/gallery.keywords` derives from the run. Written for all six (2026-10-23): the
#                         derived lists carry verbs and other companies' names (Procore, OneDrive), so these are
#                         picked by hand from the same words -- the problem statement, the actor, the occasion and
#                         the context fields, as the founder entered them -- and no company name.
#   axes               -- optional: any of the seven gallery words written here wins over the one derived from the run.

[[gallery]]
entry = "08-fresco"
slug = "fresco"
name = "Fresco"
replaces = []
inspired_by = { name = "Fresco", batch = "Fall 2024", ycUrl = "https://www.ycombinator.com/companies/fresco" }
cluster = { id = 4, label = "Construction and real estate" }
keywords = ["construction superintendent", "site walks", "daily logs", "photos", "punch lists", "documents", "trailer", "liability", "dispute", "general contractors"]
public_description = { text = "Fresco: The scribe for construction", url = "https://www.ycombinator.com/launches/M73-fresco-the-scribe-for-construction", date = "2024-10-23" }
status_today = { text = "AI copilot for construction estimators", url = "https://www.ycombinator.com/companies/fresco", date = "2026-10-22" }

