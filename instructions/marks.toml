# The three marks a run is judged against (spec 009, contracts/metrics-contract.md).
#
# Override with `make instruction-eval MARKS=<file>`; whatever judged a run is written into its
# verdict.json with the MARKS_VERSION that judged it. Changing a number here, a metric definition,
# or an alignment rule bumps instructions/marks.py's MARKS_VERSION -- the same rule
# evals/policy.py states for POLICY_VERSION, and a separate constant so the two can never be
# confused.

[marks]
anchoring_accuracy = 0.90
golden_belief_recall = 0.80
# MARKS_VERSION 6 (judgement call 22, the founder, 2026-09-12): a rule refusal is the product
# correcting the model -- one extra call, nothing a founder sees -- so the mark is a RATE over the
# answers the aggregate judged, not an absolute zero. The denominator is small (63 assumption
# answers on a full N=3 run), so 0.02 means "at most one correction across the corpus". Shape
# refusals -- an envelope the runtime had to repair -- stay at zero.
rule_refusal_rate = 0.02
shape_refusals = 0
# MARKS_VERSION 4 (judgement calls 15-17), narrowed at 5 (20-21): the BRIEF subject. Every
# paragraph must meet all four of `instructions/brief.py`'s per-case marks -- shape, coverage,
# register, source_material -- so this is 1.00 and not a fraction: a paragraph that invents a
# number has not half-worked. Whether the design's own verdict phrase appears is **observed on
# register.html and not marked** (judgement call 20).
# MARKS_VERSION 7 (judgement call 23, the founder, 2026-09-13): the `shape` fault's length edge
# follows the contract, which moved `whatThisSays` from 1 200 to 2 000 characters (keel-cloud
# `ScreenResponseContracts.WHAT_THIS_SAYS_MAX`, DRIFT #68). The four marks and this number are
# unchanged; a paragraph is judged against the edge production actually enforces.
brief_paragraphs = 1.00
