# The eval's own sheet for the six simulated ideas of corpus revision 9's `chat/*.yaml` (keel-cloud 083).
#
# The corpus says what the founder types and what the chat must end in; it does not say who the people are, where,
# or what the idea is called -- a project would have those from its confirmed context, mechanism and persona. This
# file is that much of a project, and no more: the `context` slots (`ScreenContextBuilder.slots`), the market, the
# statement each vector confirmed, and the idea's own words (`idea_words`: the short name and mechanism terms; no
# Importance item may name them). The window and the currency are the six-scenario file's, never typed here.
# Written by this repository (MARKS_VERSION 17, judgement call 79); it is context for a case, never a golden.
payroll:
  context:
    actor: payroll practitioner
    actor_plural: payroll practitioners at mid-size companies
    job: run each payroll accurately
    circumstance: a payroll run is about to be approved
    segment: payroll teams at mid-size US companies
  market: {country: US, region: null, language: en-US}
  statements:
    PROBLEM: Before a payroll is approved, practitioners check every line by hand against the last one, which takes hours, and some errors still get through.
    SOLUTION: A checker that compares each payroll register with the last and flags the lines that changed unexpectedly, with the reason.
    COMMERCIAL: The payroll lead chooses the tool and finance has to agree; it is bought by the company, not the practitioner.
  idea_words: [payroll error checker, error checker, register checker]
dark-chocolate:
  context:
    actor: chocolate eater
    actor_plural: people who buy dark chocolate bars
    job: find a dark chocolate bar they really like
    circumstance: they pick a bar in a shop or online
    segment: adults in the UK who buy dark chocolate weekly
  market: {country: GB, region: null, language: en-GB}
  statements:
    PROBLEM: People who buy dark chocolate often pay a premium for a bar they like, and a good bar costs more than they would like.
    SOLUTION: A dark chocolate bar of the same quality that costs ten per cent less than the leading brand.
    COMMERCIAL: The buyer is the eater; it is bought in shops and online, one bar at a time.
  idea_words: [cheaper dark chocolate, dark chocolate bar]
superior-chocolate:
  context:
    actor: chocolate eater
    actor_plural: people who buy dark chocolate bars
    job: find a dark chocolate bar they really like
    circumstance: they pick a bar in a shop or online
    segment: adults in the UK who buy dark chocolate weekly
  market: {country: GB, region: null, language: en-GB}
  statements:
    PROBLEM: Finding a dark chocolate bar they really like is hit and miss, because people try several before one is worth buying again.
    SOLUTION: A dark chocolate bar with a noticeably better taste than the leading brand, at a similar price.
    COMMERCIAL: The buyer is the eater; it is bought in shops and online, one bar at a time.
  idea_words: [better tasting chocolate, superior chocolate]
lullaby:
  context:
    actor: parent
    actor_plural: parents of babies under six months
    job: work out what the baby needs and settle the baby
    circumstance: the baby cries in the night
    segment: parents of babies under six months in the UK
  market: {country: GB, region: null, language: en-GB}
  statements:
    PROBLEM: During nighttime crying episodes, caregivers may be uncertain what the baby needs, trying several responses before the baby settles.
    SOLUTION: An app that listens to the cry and suggests what the baby most likely needs, so the first thing a parent tries is the likeliest.
    COMMERCIAL: The parent pays for themselves, on a phone, month by month.
  idea_words: [cry classifier, cry app, lullaby]
writing-checker:
  context:
    actor: office professional
    actor_plural: office professionals who write for colleagues and customers
    job: send writing that is clear and free of mistakes
    circumstance: an important email is about to be sent
    segment: office professionals at small US companies
  market: {country: US, region: null, language: en-US}
  statements:
    PROBLEM: People check important emails for a few minutes before sending, and mistakes still reach the reader.
    SOLUTION: A checker that reads a draft before it is sent and flags mistakes the writer would not see.
    COMMERCIAL: The company chooses and pays for the tool for its staff, per person.
  idea_words: [writing checker, draft checker]
voice-notes:
  context:
    actor: person with close friends
    actor_plural: people with close friends who live apart
    job: stay in touch with close friends
    circumstance: they have not spoken to a close friend for a while
    segment: adults in the UK with close friends who live elsewhere
  market: {country: GB, region: null, language: en-GB}
  statements:
    PROBLEM: Close friends drift apart when life gets busy, because a call or a long message takes more than people have to give.
    SOLUTION: An app for short voice notes between close friends, so staying in touch takes seconds.
    COMMERCIAL: The person pays for themselves, on a phone, if at all.
  idea_words: [voice notes, voice note app]
