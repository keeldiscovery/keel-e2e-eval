# Sibling repo paths + ports + timeouts (data-model.md). Paths are resolved relative to this
# file's own directory, so `make` works the same regardless of the caller's cwd.

[paths]
keel_cloud = "../keel-cloud"
keel_web = "../keel-web"
keel_skill = "../keel-skill"

[ports]
postgres = 55432
cloud = 18080
web = 5173

[timeouts]
cloud_boot = 120
web_boot = 60

# Split-stacks (relay-design.md §12.5): the playground profile's own ports, entirely separate
# from the default (eval) profile above -- `make up PROFILE=playground`. Same sibling paths and
# timeouts; only ports (and, in stack/postgres.py, the Compose project) differ.
[playground.ports]
postgres = 55433
cloud = 18081
web = 5174
