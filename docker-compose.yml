services:
  postgres:
    image: postgres:16
    container_name: keel-eval-postgres
    environment:
      POSTGRES_DB: keel_cloud
      POSTGRES_USER: keel
      POSTGRES_PASSWORD: keel
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keel -d keel_cloud"]
      interval: 2s
      timeout: 3s
      retries: 60
    tmpfs:
      - /var/lib/postgresql/data
