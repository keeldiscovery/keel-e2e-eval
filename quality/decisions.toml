# The founder's decisions on what the quality cycle found -- the record the adviser reads before it writes.
#
# One entry per decision. A weak row in a later cycle whose `row` matches an entry (scope, audience, dimension, screen;
# `*` matches any) and whose `fix` matches (the fix location the cycle names, `*` any) is SNOOZED: listed in the cycle
# record under "Decided before" with the entry's `decision` and `why`, and not sent to the adviser -- until the snooze
# ends. A snooze ends by `until`: "spec-merged" (the named spec is on master, so the next cycle measures the fix and the
# row competes again), "never" (declined for good; the founder reopens it by editing this file), or a cycle id (snoozed
# through that cycle). Spec 087 reads this file; quality/CYCLE.md step 2 says where the snoozed rows show.
#
# decision: taken | declined | held      spec: the spec(s) the taken decision became, by repo and number
# Keys are the founder's own words where he gave them. Dates are the day he decided.

