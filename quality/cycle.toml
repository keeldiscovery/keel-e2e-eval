# The quality cycle's settings (spec 079 FR-8): everything `make quality-walk`, `make quality-advise` and
# `make quality-accept` read, committed, so a session with no memory of any earlier one runs the cycle from
# quality/CYCLE.md and this file alone. A change here is a commit with its why; every cycle record names the values it
# was held to (the bar, the weak rule, the reader, the adviser).
#
# Two of these values have a second home and are HELD EQUAL to it -- the cycle commands refuse, naming both files, when
# they are not: the bar and the weak rule are `quality/rubric.py`'s (BAR_PCT, WEAK_ZERO_ENTRIES, WEAK_MEAN; a change to
# the weak rule is a RUBRIC_VERSION bump, RUBRIC.md's *Versions*), and the reader is `quality/readers.toml`'s.

[cycle]
# The studies a kick-off walks when ENTRIES=default (spec 079 FR-2 / FR-8): the five of the baseline, then every entry
# 08-35 as they pass. PROPOSED by the builder (2026-10-28) -- spec 078 FR-6 leaves the five to the founder; he names
# them by a commit to this line.
entries = ["08-fresco", "10-palus", "13-aircaps", "17-expanse", "21-codyco"]
# One corpus entry is three studies (the founder, 2026-10-28): each walked, scored and tabled on its own.
scopes = ["PROBLEM", "SOLUTION", "COMMERCIAL"]
# Spec 062 / 066: `keel` (Keel's AI, the key in the shell) or `host` (the founder's own Claude Code, no key).
door = "keel"
# Spec 106 FR-2 (the founder, 2026-10-30: "instead of twenty, seven agents answer it"): the people each study sends on
# the person's own link -- the entry's first seven in corpus order of those its scope sends; a B2B money study sends
# its decision-makers whole. `make quality-walk PEOPLE=<n>` overrides it for one walk.
people = 7

[bar]
# The founder's bar (2026-10-28): the overall score_pct over the latest score file of every study.
bar_pct = 90.0

[weak]
# A row is weak on a criterion with a 0 in this many entries, or a mean under `mean_under` (RUBRIC.md).
zero_entries = 2
mean_under = 1.5

[reader]
# Held equal to quality/readers.toml [reader] (the readers' own pin, spec 078 FR-2).
model = "claude-opus-5-5"
effort = "medium"

[adviser]
# Spec 079 FR-4: one bounded call per weak row through the claude CLI, the judge's argv plus these two flags -- no key.
# The prompt is quality/readers/adviser.md. It proposes; it never applies.
model = "claude-opus-5-5"
effort = "medium"
timeout_s = 300
# The current text quoted to the adviser is cut at this many characters (an instruction file is under 15 KB today).
max_quote_chars = 16000

[adviser.sections]
# A weak row whose fix lives in a shared instruction file is quoted the file's named section, by screen kind, when
# one is named here; else the whole file. The headings are the files' own `### ...` lines.
screener = "The condition"
gate = "The gate"

[gallery]
# Spec 106 FR-3 (the founder, 2026-10-30: "we don't have to wait till 90 ... the only time we should not do it is if the
# next rating comes below what we already have"): `make quality-accept` builds the gallery behind the readers' gate
# alone -- a bundle with no score file at the current rubric version, or with a flagged screen, is refused by name --
# and the cycle's score_pct is held to the gallery's own last accepted one (recorded in its provenance), never to the
# bar above. Every study of an entry is exported (FR-1: problem, solution, money); spec 079's refuse_flagged,
# refuse_under_bar and scope_order are retired, and `make quality-*` refuses this file should one come back.

[cadence]
# Spec 079 FR-7: a cycle is DUE after a registry or instruction change merged in keel-cloud, a routing table or model
# change, or this many days since the last record. Nothing here runs anything: the founder kicks off.
days = 7
