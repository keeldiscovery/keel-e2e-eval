# The two readers' model, pinned (spec 078 FR-2; the coordinator's decision 1, 2026-10-28).
#
# The readers run through the `claude` CLI exactly as instructions/judge.py does -- `claude -p --tools ""
# --strict-mcp-config --setting-sources "" --no-session-persistence --max-turns 1 --output-format json` -- with the two
# flags below added. No API key is read, named or passed: `make read-screens` refuses on a missing `claude` binary or a
# failed one-word probe. The environment's effort knobs are stripped as the judge strips them (judge_env), so the effort
# here is the only one that reaches the CLI.
#
# Every score file records this block. A change here is a new reader: its score files carry the model in their name,
# and `make read-table BASELINE=1` compares them against the baseline like any other run (FR-6).
[reader]
model = "claude-opus-5-5"
effort = "medium"
vendor = "anthropic"
door = "claude CLI"
# One screen per call; a call that does not answer in this many seconds is recorded as an error and the screen unread.
timeout_s = 240

# Spec 163 FR-3: THE FILM READER -- one call per entry's film through the **Anthropic API with vision** (the frames and
# the pictures are images; the `claude` CLI door cannot carry them and is refused for this reader by name). The key is
# the shell's KEEL_ANTHROPIC_API_KEY (the walks' door `keel`), read into the request header alone, never logged, echoed
# or written. `make read-films` refuses without it, and refuses any `door` here but "anthropic api". Every film score file
# records this block. The prompt is quality/readers/film-reader.md; the rubric quality/FILM-RUBRIC.md.
[film_reader]
model = "claude-opus-5-5"
effort = "medium"
vendor = "anthropic"
door = "anthropic api"
# One film a call: the persona card, the lines, the setting and the prompts, fourteen frames and seven pictures.
max_tokens = 16000
timeout_s = 600
# The API's list price for the pinned model, per million tokens (input, output, cache read) -- the score file's dollars.
usd_per_mtok_in = 4.0
usd_per_mtok_out = 20.0
usd_per_mtok_cache_read = 0.2
