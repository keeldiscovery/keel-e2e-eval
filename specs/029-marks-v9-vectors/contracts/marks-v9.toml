# call 41, founder decision 35, 2026-10-08: scored on the ACCEPTED answer -- after the runtime's rule refusal and ONE redraw (keel-cloud 058's repair turn, mirrored), what a founder sees -- and so are dimension_coverage and no_leak on both question screens; a second refusal leaves it refused and it scores as faults on the raw answer; v9 amended before any run of record
