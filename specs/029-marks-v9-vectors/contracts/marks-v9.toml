# The marks a run is judged against (spec 009, contracts/metrics-contract.md).
#
# Override with `make instruction-eval MARKS=<file>`; whatever judged a run is written into its
# verdict.json with the MARKS_VERSION that judged it. Changing a number here, a metric definition,
# or an alignment rule bumps instructions/marks.py's MARKS_VERSION -- the same rule
# evals/policy.py states for POLICY_VERSION, and a separate constant so the two can never be
# confused.

# MARKS_VERSION 9 (judgement calls 28-36, 2026-10-06; keel-cloud-docs
# `canon/drafts/vector-redesign-2026-10-06/HANDOFF.md` §2, §5, §6 and `marks-v9.draft.md`; the
# dimension registry `registry-schema.draft.md`). **Written before any prompt or corpus work, and
# never moved to fit a model** (the ceiling is claude-sonnet-5-5 at medium; a mark only a bigger
# model could meet is a wrong mark, and §2 of the .md says of each one why it is not). The rubric
# moved every way it can at once -- the subjects, the metric definitions, the alignment rule, and
# the corpus the rubric reads:
#   - the three `*_ASSUMPTIONS` screens and `QUESTIONS` are gone; `INTERPRET` keeps its constant,
#     narrowed to the gate story (design name "anchor read"; there is no ANCHOR_READ constant). The
#     subjects are `CALIBRATION_QUESTIONS` (x3 vectors), `RESPONDENT_QUESTIONS` (x3 parts),
#     `INTERPRET` (one call a respondent), `COMPARE` (code, no call) and `BRIEF`;
#     `CONTEXT_INTERPRET`, `PROBLEM_INTERPRET` and `SOLUTION_MECHANISM` run, go to the aggregate
#     (their leaks are rule refusals X1 / P1 / M1, counted by `rule_refusal_rate` only), and are
#     rendered on `register.html` unscored (judgement call 10, three subjects wider).
#   - `golden_belief_recall` is **RETIRED** (call 29). The founder's calibration answers are typed
#     picks against a registry -- a dimension key, a normalized code or a number -- and the model
#     writes the question, not the belief. There is nothing to align by structure any more: no
#     type, no measure kind, no band, no option list to overlap, no tie for a judge to break. The
#     golden a calibration question is scored against is the registry slice itself
#     (`dimension_coverage`, `option_validity`), never a hand-written question. `align.py` and
#     its eight `FIELDS` retire with it.
#   - `anchoring_accuracy` keeps its number and loses its denominator: one judgement a respondent
#     (the un-chipped gate story), not one an anchor. A chipped story is set GUESSED by code with
#     no call and is OUTSIDE the denominator (the founder, 2026-10-07; call 33 amended).
#     03-lullaby: 9 judgements at N=1 (12 people, 2 answer No at the gate, 1 chips), not 23
#     person-anchor pairs.
#   - the golden corpus moved to **revision 3** (the .md's §4): `context`, `founder_calibration`,
#     `solution_mechanism`, golden `respondent_questions`, per-respondent `recency`/`story`/`chip`/
#     `anchoring`, picks keyed by dimension, `expected.standings` keyed by dimension with a
#     `Status` word, `expected.vector_verdicts`. `beliefs[]`, `questionnaire.anchors`, per-anchor
#     `text`/`anchoring`, `expected.buckets` and `expected.stages` are gone.
# **Scores before and after this bump are not comparable**, and a v8 bundle **cannot be re-scored**
# to v9: `rescore.py` re-reads the corpus, and the corpus moved (revision 3) -- a v8 bundle holds
# answers to screens v9 does not have, scored against beliefs r3 does not carry. `rescore.py`
# refuses a bundle below 9 by name. That is why a run of record is spent (`WHY=marks:9`,
# `instructions/why.py`), and it is the certificate the Phase 1 D track lands on.

[marks]
# MARKS_VERSION 9 (call 30): every registry dimension has exactly one calibration question (25 a
# project), and every non-left-out dimension the registry asks in V1 has exactly one respondent
# question (23 on 03-lullaby). Absolute, not a fraction: a dimension absent or doubled is a case
# that failed. Code only.
dimension_coverage = 1.00
