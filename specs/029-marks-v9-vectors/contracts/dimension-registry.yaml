# Signed 2026-10-07 by the founder with spec 058 (specs/058-vector-corridor); the YAML of record. keel/dimension-registry.json is derived from it.
# Copied from specs/058-vector-corridor/contracts/dimension-registry.yaml below this header, then edited here (the draft sha no longer
# holds): 2026-10-07, the recall window became a per-project parameter -- {window} / {window_unit} replace the "7 nights" literals in
# every schema field (track D finding, keel-e2e-eval 029); the lullaby blocks keep Lullaby's own words. Edit here, then regenerate.
# 2026-10-08, founder decision 42: the window is COUNT + UNIT ({7, NIGHTS} by default) and {window} renders whole -- "the last 7
# nights", "the last 3 months", "the last shift" for a count of 1 -- so the templates read "in {window}", never "in the last {window}".
# 2026-10-08, the GRAMMAR decision: {circumstance} is a clause without the word "when" ("the baby cries in the night"), so Importance's
# template reads "... come up when {circumstance}" (it read "come with {circumstance}", which wanted a noun phrase).
# Dimension registry v1 — Phase 0.2 of the vector redesign
# Date: 2026-10-06
# Status: DRAFT for the founder's review. Nothing here is built or committed.
# Follows: registry-schema.draft.md (field names and enum values are pinned there; this file fills
#          them and renames nothing). Where a field could not be filled exactly as specified, the field
#          is kept and a `_note` says why.
# Carries forward: dimension-registry.draft.yaml (2026-10-06), upgraded to the schema, with the HANDOFF §3
#          fixes applied: per-option belief phrase, contiguous bins + fixed 7-night window on Prevalence,
#          Retention ≠ Frequency, Ability to pay as a pure ordinal (no mixed option).
# Meanings: one sentence each, in the words of Keel_Evidence_Validation_Framework.pdf §4–§6.
# Worked example: 03-lullaby (GB market, £; parents of babies under six months; woken in the night; they
#          try feeding, changing, rocking; ~20 min to settle; an app listens to the cry and suggests the
#          need; £6 a month; the same person uses, decides and pays).
#
# DECISIONS (closed by the founder 2026-10-07) — numbered as they were tabled; each is marked `_decided: N` where it bites.
#   The questions are kept as filled on 2026-10-06; the OUTCOME line under each is the founder's decision.
#   1. `founder.unsure_allowed: false` on problem.prevalence. It is the gate; a study with no gate has no
#      denominator. Every other dimension offers "I'm not sure" (= LEFT OUT).
#      OUTCOME: confirmed — no "I'm not sure" on Prevalence (reconciliation 11).
#   2. `BAR_SET` is the status word for the one threshold dimension (solution.effectiveness_threshold),
#      per HANDOFF Decision 4. It never reaches HOLDING_UP or NOT_HOLDING_UP; the drift clause says where
#      the bar landed against the founder's number. The founder-facing label proposed: "Bar set".
#      OUTCOME: confirmed — `BAR_SET`, label "Bar set", reachable only by Effectiveness threshold (reconciliation 10).
#   3. `respondent.asked_in_v1: false` on problem.urgency and commercial.retention_potential (parts count
#      8 / 9 / 6 = 23). Their calibration screens are STILL shown to the founder (the registry stays whole);
#      a founder belief there reads NOT_ASKED_YET with the sub-line "not asked in this round".
#      OUTCOME: shown; a belief there reads NOT_ASKED_YET "not asked in this round" (reconciliation 12).
#   4. solution.adoption_friction: respondent control changed from the draft's multi_choice to
#      single_choice so the respondent's answer is on the same effort ladder as the founder's (ordinal
#      compare). The draft's "tick what you'd have had to do" could not be compared to a single belief.
#      OUTCOME: confirmed en bloc (reconciliation 13).
#   5. Interval drift templates use a fourth placeholder `{side}` (smaller / larger / both ways), filled by
#      the engine from Standing.drift, beside the schema's `{founder}`, `{observed}`, `{n}`.
#      OUTCOME: confirmed en bloc (reconciliation 13).
#   6. Above-the-band on a deal-breaker: Prevalence that comes in ABOVE the founder's bin is HOLDING_UP with
#      the drift clause "more than you think" (proportion_from_gate; below the bin is NOT_HOLDING_UP).
#      Frequency and Duration KEEP today's magnitude rule: a number outside the founder's interval in either
#      direction is outside. The Lullaby example carries the Prevalence case (founder "6 to 8 in 10",
#      observed 0.83).
#      OUTCOME: both halves confirmed — the split rule stands (reconciliation 8); the compare parameters are
#      as marks §2.5 tables them, ordinal band = the founder's rung ± 1 (reconciliation 9).
#   7. commercial.ability_to_pay: the smoke test's "only for a one-time purchase" option is dropped as the
#      one mixed option (HANDOFF §3); the scale is four ordered codes. Recurring-vs-one-off lives in Price.
#      OUTCOME: confirmed en bloc (reconciliation 13).
#   8. problem.importance is compared as the share of anchored people who picked the problem's own item in
#      a trade-off list, mapped onto the founder's rank band (ordinal_band); there is no respondent rating.
#      OUTCOME: confirmed en bloc — Importance closed on both sides (reconciliation 13).
#   9. commercial.commitment keeps the draft's founder multi_choice (rungs the founder believes people
#      would take); the engine reads the founder's highest ticked rung as the belief.
#      OUTCOME: confirmed en bloc (reconciliation 13).
#  10. commercial.existing_sacrifice's number is "roughly how much, all together, in the last three months";
#      commercial.wtp_hypothesis's first number is "what the last comparable thing cost". Two money
#      numbers, two different questions, one minute apart.
#      OUTCOME: both money questions KEPT (reconciliation 13).
#  11. Price is in the market's currency (GBP for GB); the Lullaby example is £5–12 a month.
#      OUTCOME: confirmed en bloc (reconciliation 13).
#  12. Three fixed respondent-only codes are never offered to the founder: `own_instinct` on trust_risk,
#      `not_useful` on target_circumstance, `nothing_yet` on commitment. They count as OUTSIDE.
#      OUTCOME: confirmed en bloc (reconciliation 13).
#  Also decided 2026-10-07 and bearing on this file: the gate rule (a gate-No answers nothing more) is
#      confirmed, so the six commercial Lullaby examples' `n=11` is stale and is reworked at n ≤ 10 when
#      corpus r3 is written (reconciliation 14; see the `_note` under each); a chipped story is set GUESSED
#      by code with no model call (reconciliation 5); respondent questions are written at Lock (reconciliation 1).

common:
  left_out:
    ask_respondent: false
    status: LEFT_OUT
    note: "You weren't sure, so this was left out of the study. The brief says it is untested."
  chips:
    default: ["I can't recall", "I'd rather not say"]
    numeric_extra: "That's a rough guess"          # marks the answer GUESSED: shown hollow, never counted
  something_else:
    rule: >-
      Every closed respondent item whose belief is a SET (multi_choice, multi_choice_ordered,
      multi_choice_ladder, branch_pick_number's pick) and every single_choice built from a
      market-specific option set ends with "Something else". Fixed scales (single_choice_5, bands,
      0-to-7, yes/no) do not. "Something else" is an observation placed OUTSIDE, kept verbatim, never
      a row of its own on the answers page (spec 050).
  floor:
    default: 5
    unit: anchored people
    note: "Today's FLOOR = 5; fewer anchored people is Too few to call whatever they say. Never per belief."
  context_placeholders:
    "{actor}": "Context WHO, singular, as the founder wrote it (Lullaby: 'parent')."
    "{actor_plural}": "Context WHO, plural, as the founder wrote it (Lullaby: 'parents of babies under six months')."
    "{job}": "Context WHAT: the outcome the actor is trying to reach, described without the product (Lullaby: 'work out what the baby needs and settle them')."
    "{circumstance}": "Context WHEN: the trigger and situation (Lullaby: 'the baby cries in the night')."
    "{window}": "The project's recall window in words, a count and a unit chosen at the Context step: 'the last 7 nights' (the default; Lullaby), 'the last 5 working days', 'the last 3 months'; a count of 1 reads 'the last cycle' / 'the last shift' / 'the last month'. Filled by code."
    "{window_unit}": "Frequency's unit: the window's unit, plural, out of its count (Lullaby: 'nights out of 7'; 'shifts out of 1'). Filled by code."
    _note: >-
      Filled by code from the Context step, never by a model. Belief sentences are deterministic
      (HANDOFF §5 row 4). Templates below also use {value}, exactly once each.
  drift_placeholders:
    "{founder}": "the founder's belief, as the belief sentence's value"
    "{observed}": "what the anchored people said: the middle answer with unit for intervals, the leading option(s) for choices and sets"
    "{n}": "anchored people counted (the gate for Prevalence)"
    "{side}": "intervals only: 'smaller' | 'larger' | 'both ways', from Standing.drift (decision 5)"
  compare_rules:
    _note: "One line each, agreeing with marks-v9 §2.5 (the one compare table); the deterministic engine (HANDOFF §5 row 11) is specified in Phase 1 A from these."
    proportion_from_gate: "share of gate answers that are Yes, placed against the founder's proportion bin: in the bin or ABOVE it is HOLDING_UP (drift 'more than you think' when above), below it is NOT_HOLDING_UP; no PEOPLE_DISAGREE possible (decision 6)"
    interval_contains_median: "today's magnitude rule: per-person placement inside/below/above the band, outside in either direction is outside; floor, one-in-three split (>= 2/3 inside HOLDING_UP, <= 1/3 NOT_HOLDING_UP, else PEOPLE_DISAGREE), drift from the outside placements"
    ordinal_band: "the founder's rung +/- 1 is the band; a respondent pick in it is inside, else outside; tolerance dimensions (reliability, adoption friction) also count the whole more-forgiving side as inside; then today's split and floor. On problem.importance the share who picked the problem's own item is mapped onto the rank band instead (see its _note): in band HOLDING_UP, else NOT_HOLDING_UP"
    choice_majority: "inside = picked the founder's option; outside = any other; today's split and floor"
    set_overlap: "holds when every founder code is ticked by at least half of anchored people and no unpicked code by more than half; a founder code under a third, or an unpicked code over half, is NOT_HOLDING_UP; between is PEOPLE_DISAGREE"
    ordered_set_overlap: "set_overlap on the codes plus the modal first step must equal the founder's first step"
    threshold_band: "median respondent band placed against the founder's number; status is always BAR_SET; the drift clause carries where the bar landed"
    price_hypothesis: "no comparison; last-purchase prices are shown as context; status NOT_TESTED_BY_DESIGN"
    role_chain_match: "choice_majority on the role-chain code"
    ladder_rung: "inside = ticked the founder's highest rung or a higher one; 'Nothing yet' is outside; today's split and floor"

dimensions:

# ───────────────────────── PROBLEM (9) · Part 1 asks 8 ─────────────────────────

- key: problem.prevalence
  vector: PROBLEM
  order: 1
  name: Prevalence
  meaning: "How much of the target segment experiences the problem within a defined period."
  weight: DEAL_BREAKER
  founder:
    control: single_choice
    guidance: >-
      Out of 10 people in the segment, how many had this at least once in {window}. The window
      is the project's recall window (the gate's window); the bins are contiguous fifths of the segment.
    normalized:
      kind: proportion_bin
      window: "{window}"
      codes: [p_0_20, p_20_40, p_40_60, p_60_80, p_80_100]
    option_rule: >-
      Exactly 5 options, contiguous: fewer than 2 in 10 · 2 to 4 · 4 to 6 · 6 to 8 · 8 to 10. No gaps
      (the smoke test's 5-6 / 7-8 / 9-10 had holes). Each option carries its own belief phrase
      (only a few · a minority · around half · most · nearly all); never the label.
    belief_template: "{value} of these {actor_plural} had this at least once in {window}."
    unsure_allowed: false
    _decided: 1
  respondent:
    asked_in_v1: true
    part: 1
    anchor: that_night
    control: gate_yes_no
    guidance: >-
      This item IS the gate: "In {window}, did [the circumstance] happen to you?" Yes / No.
      Explicit, never inferred from the story. No → graceful exit; the person still counts in the
      denominator. Yes → the story prompt (the anchor test), then the rest of Part 1. Never names the
      idea, the app or the mechanism.
    option_rule: "Yes · No. No distractors, no 'Something else'. Chips: none (a gate must be answered). Code renders the options; the model writes the question only."
    chips: []
  answers:
    shape: choice
    compare_rule: proportion_from_gate
    status_vocabulary: [HOLDING_UP, NOT_HOLDING_UP, TOO_FEW_TO_CALL, NOT_ASKED_YET]
    drift_template: "{side} than you think · you said {founder} · {observed} of {n} said yes"
    floor: 5
    _note: "Floor counts gate answers, not anchored people: the gate is explicit. LEFT_OUT unreachable (decision 1)."
  left_out:
    ask_respondent: false
    status: LEFT_OUT
    note: "Unreachable: 'I'm not sure' is not offered on the gate."
  lullaby:
    founder_question: "Out of 10 parents of babies under six months, how many do you think had a night in the last 7 nights when the baby cried and they had to decide what to try?"
    founder_options:
      - {label: "Fewer than 2 in 10", normalized: p_0_20, belief_phrase: "Only a few"}
      - {label: "2 to 4 in 10", normalized: p_20_40, belief_phrase: "A minority"}
      - {label: "4 to 6 in 10", normalized: p_40_60, belief_phrase: "Around half"}
      - {label: "6 to 8 in 10", normalized: p_60_80, belief_phrase: "Most"}
      - {label: "8 to 10 in 10", normalized: p_80_100, belief_phrase: "Nearly all"}
    founder_answer: "6 to 8 in 10"
    belief_sentence: "Most of these parents of babies under six months had this at least once in the last 7 nights."
    respondent_question: "In the last 7 nights, did your baby wake crying and you had to decide what to try?"
    respondent_options: ["Yes", "No"]
    expected:
      status: HOLDING_UP
      drift: "more than you think · you said Most · 10 of 12 said yes"
      counts: "12 answered the gate · 10 yes, 2 no (Leo: hasn't happened; Hugo: ten days ago) · 0.83, ABOVE the 0.6–0.8 bin: holding up with the drift clause (decision 6, the worked above-the-band case on a deal-breaker)"

# Frequency in the project's recall window (decision 42): {window_unit} is the window's unit out of its count. The respondent's
# control is segmented_0_to_N with N = the count when the count is at most 7 (a count of 1 is none-or-the-one, yes / no in all but
# name); a longer window (30 days, 12 months) is served as number_with_unit in {window_unit}, from 0 to the count. axis_max below is
# the default window's; code reads the project's count. RecallWindow and InterviewComposer state the same rule.
- key: problem.frequency
  vector: PROBLEM
  order: 2
  name: Frequency
  meaning: "How often an affected person experiences the problem."
  weight: DEAL_BREAKER
  founder:
    control: numeric_interval
    guidance: "On how many {window_unit} an affected person faces it: a range on an axis from 0 to the window's length, whole units."
    normalized:
      kind: interval
      unit_options: ["{window_unit}"]
      default_unit: "{window_unit}"
      axis_max: 7
      axis_step: 1
      extend_by: 0
      bins: [0, 1, 2, 3, 4, 5, 6, 7]
    option_rule: "No options: a two-handle range from 0 to the window's length. Belief value = the range with its unit ('4 to 7 {window_unit}')."
    belief_template: "{actor_plural} face this on {value}."
    unsure_allowed: true
  respondent:
    asked_in_v1: true
    part: 1
    anchor: that_night
    control: segmented_0_to_7
    guidance: "Count how many {window_unit} it happened on, not how many times it happened. Never shows the founder's range."
    option_rule: "A segmented control from 0 to the window's count, one tap, when the count is at most 7; a number in {window_unit} for a longer window. No 'Something else'. Code renders the options; the model writes the question only."
    chips: ["I can't recall", "I'd rather not say", "That's a rough guess"]
  answers:
    shape: interval
    compare_rule: interval_contains_median
    status_vocabulary: [HOLDING_UP, NOT_HOLDING_UP, PEOPLE_DISAGREE, TOO_FEW_TO_CALL, NOT_ASKED_YET, LEFT_OUT]
    drift_template: "{side} than you think · you said {founder} · middle answer {observed} · {n} described it"
    floor: 5
  left_out: {ask_respondent: false, status: LEFT_OUT, note: "You weren't sure, so this was left out of the study. The brief says it is untested."}
  lullaby:
    founder_question: "In a typical week, on how many nights out of 7 do you think a parent is woken by a cry and has to work out what the baby needs?"
    founder_numeric: {unit: "nights out of 7", axis: "0–7, whole nights", picked: "4 to 7"}
    founder_answer: "4 to 7 nights out of 7"
    belief_sentence: "Parents of babies under six months face this on 4 to 7 nights out of 7."
    respondent_question: "Thinking about the last 7 nights, on how many did your baby wake crying and you had to decide what to try?"
    respondent_options: ["0", "1", "2", "3", "4", "5", "6", "7"]
    expected:
      status: HOLDING_UP
      drift: null
      counts: "n=8 anchored, 2 guessed (Finn, Jonas) · median 5 nights · 6 inside, 2 below"

- key: problem.severity
  vector: PROBLEM
  order: 3
  name: Severity
  meaning: "How disruptive or difficult an occurrence is when it happens."
  weight: SHAPES
  founder:
    control: single_choice
    guidance: "How disruptive one episode is to the actor, on an anchored five-point scale written as scenarios, not adjectives."
    normalized:
      kind: ordinal
      codes: [barely, a_little, moderately, very, extremely]
    option_rule: "Exactly 5 options mapped in order onto the codes; each a one-line scenario of the aftermath; each with its own belief phrase."
    belief_template: "For {actor_plural}, one episode {value}."
    unsure_allowed: true
  respondent:
    asked_in_v1: true
    part: 1
    anchor: that_night
    control: single_choice_5
    guidance: "About that night only: how much it knocked the rest of the night. Fixed five-point scale with the same anchors as the founder's, in the respondent's register. Never 'usually'."
    option_rule: "Fixed scale, 5 options, same order as the codes. No 'Something else'."
    chips: ["I can't recall", "I'd rather not say"]
  answers:
    shape: choice
    compare_rule: ordinal_band
    status_vocabulary: [HOLDING_UP, NOT_HOLDING_UP, PEOPLE_DISAGREE, TOO_FEW_TO_CALL, NOT_ASKED_YET, LEFT_OUT]
    drift_template: "{side} than you think · you said {founder} · most of the {n} said {observed}"
    floor: 5
    _note: "{side} on an ordinal is 'milder' | 'harsher'."
  left_out: {ask_respondent: false, status: LEFT_OUT, note: "You weren't sure, so this was left out of the study. The brief says it is untested."}
  lullaby:
    founder_question: "When it happens, how disruptive do you think one of these episodes is for the parent?"
    founder_options:
      - {label: "A minor interruption; they are back asleep in no time", normalized: barely, belief_phrase: "barely dents the night"}
      - {label: "Annoying, but the night is mostly intact", normalized: a_little, belief_phrase: "takes a little off the night"}
      - {label: "They are fully awake and the rest of the night is lighter", normalized: moderately, belief_phrase: "leaves the rest of the night broken"}
      - {label: "They lose a large part of the night's sleep", normalized: very, belief_phrase: "costs a large part of the night's sleep"}
      - {label: "They feel overwhelmed and the night is effectively lost", normalized: extremely, belief_phrase: "writes the night off"}
    founder_answer: "They lose a large part of the night's sleep"
    belief_sentence: "For parents of babies under six months, one episode costs a large part of the night's sleep."
    respondent_question: "Think about that night. How much did it knock the rest of your night?"
    respondent_options: ["Barely; I was back asleep in no time", "A little; the night was mostly fine", "A fair bit; I was wide awake for a while", "A lot; I lost a big chunk of sleep", "Completely; the night was written off"]
    expected:
      status: PEOPLE_DISAGREE
      drift: "milder than you think · you said it costs a large part of the night · 3 of the 8 said a little or barely"
      counts: "n=8 anchored · 5 inside the ±1 band (4 a lot, 1 completely) · 3 milder, two rungs down or more (2 a little, 1 barely) · 5/8 is between a third and two thirds"

- key: problem.duration
  vector: PROBLEM
  order: 4
  name: Duration
  meaning: "How long an occurrence or its resolution takes."
  weight: DEAL_BREAKER
  founder:
    control: numeric_interval
    guidance: "From the trigger to resolution, how long a typical episode takes: a range with a unit. Axis 0–60 min by 5, extends by 30; hours allowed."
    normalized:
      kind: interval
      unit_options: [minutes, hours]
      default_unit: minutes
      axis_max: 60
      axis_step: 5
      extend_by: 30
    option_rule: "No options: a two-handle range with a unit picker. Belief value = the range with its unit."
    belief_template: "A typical episode takes {value} from start to finish."
    unsure_allowed: true
  respondent:
    asked_in_v1: true
    part: 1
    anchor: that_night
    control: number_with_unit
    guidance: "That night: how long from the crying starting until the baby settled, as a number with a unit. 'That's a rough guess' marks it GUESSED (shown, not counted). Never shows the founder's range."
    option_rule: "One number + unit (minutes | hours). No bands, no 'Something else'."
    chips: ["I can't recall", "I'd rather not say", "That's a rough guess"]
  answers:
    shape: interval
    compare_rule: interval_contains_median
    status_vocabulary: [HOLDING_UP, NOT_HOLDING_UP, PEOPLE_DISAGREE, TOO_FEW_TO_CALL, NOT_ASKED_YET, LEFT_OUT]
    drift_template: "{side} than you think · you said {founder} · middle answer {observed} · {n} described it"
    floor: 5
  left_out: {ask_respondent: false, status: LEFT_OUT, note: "You weren't sure, so this was left out of the study. The brief says it is untested."}
  lullaby:
    founder_question: "From the moment the baby starts crying, how long do you think it takes a parent to work out what the baby needs and get them settled?"
    founder_numeric: {unit: minutes, axis: "0–60 min by 5, extends by 30", picked: "15 to 25"}
    founder_answer: "15 to 25 minutes"
    belief_sentence: "A typical episode takes 15 to 25 minutes from start to finish."
    respondent_question: "That night, roughly how long was it from the crying starting until the baby settled?"
    respondent_options: ["a number", "minutes | hours"]
    expected:
      status: NOT_HOLDING_UP
      drift: "smaller than you think · you said 15 to 25 minutes · middle answer 11 min · 7 described it"
      counts: "n=7 anchored, 3 guessed · median 11 min · 2 inside, 5 below"

- key: problem.importance
  vector: PROBLEM
  order: 5
  name: Importance
  meaning: "How much the actor cares about improving this problem relative to other competing problems."
  weight: SHAPES
  founder:
    control: rank_pick
    guidance: "Where this ranks among the actor's difficulties in the circumstance: a rank band, not a rating. The model writes 4–6 distractor difficulties for the same circumstance; they are reused on the respondent side."
    normalized:
      kind: rank_band
      codes: [biggest, top_three, middle, minor, negligible]
    option_rule: "Exactly 5 options in rank order mapped onto the codes; each with a belief phrase ('the biggest difficulty', 'one of the top three', ...)."
    belief_template: "Among the difficulties that come up when {circumstance}, this is {value}."
    unsure_allowed: true
    _decided: 8
  respondent:
    asked_in_v1: true
    part: 1
    anchor: that_night
    control: single_choice
    guidance: "A trade-off, not a rating: 'If you could make one part of [the circumstance] easier, which would it be?' Closed pick (no text box). The problem's own item sits among the model's distractors, never first. Elicited in the respondent's own terms; never names the idea."
    option_rule: "5–6 difficulties for the circumstance including the problem's own, order shuffled per project with the problem's item never first, plus 'Something else'."
    chips: ["I can't recall", "I'd rather not say"]
  answers:
    shape: choice
    compare_rule: ordinal_band
    status_vocabulary: [HOLDING_UP, NOT_HOLDING_UP, PEOPLE_DISAGREE, TOO_FEW_TO_CALL, NOT_ASKED_YET, LEFT_OUT]
    drift_template: "{side} than you think · you said {founder} · {observed} of {n} would fix this first"
    floor: 5
    _note: "Share who picked the problem's item is placed on the band: biggest ≥ 1/2 · top_three 1/4–1/2 · middle 1/10–1/4 · minor 1/25–1/10 · negligible below. {side} = 'lower' | 'higher'. PEOPLE_DISAGREE is unreachable on a share; kept for the enum."
  left_out: {ask_respondent: false, status: LEFT_OUT, note: "You weren't sure, so this was left out of the study. The brief says it is untested."}
  lullaby:
    founder_question: "Compared with the other things that make nights hard with a baby under six months, where do you think working out what the cry means ranks for the parent?"
    founder_options:
      - {label: "Their biggest night-time difficulty", normalized: biggest, belief_phrase: "the biggest difficulty"}
      - {label: "One of their top three", normalized: top_three, belief_phrase: "one of the top three"}
      - {label: "Somewhere in the middle", normalized: middle, belief_phrase: "a middling one"}
      - {label: "A minor one compared with the others", normalized: minor, belief_phrase: "a minor one"}
      - {label: "It barely registers against the others", normalized: negligible, belief_phrase: "barely on the list"}
    founder_answer: "One of their top three"
    belief_sentence: "Among the difficulties that come up when the baby cries in the night, this is one of the top three."
    respondent_question: "If you could make one part of nights with your baby easier, which would it be?"
    respondent_options: ["Getting the baby back down after a feed", "Working out what the cry means", "Getting myself back to sleep afterwards", "Sharing the night with my partner more evenly", "The early-morning wake-ups", "Something else"]
    expected:
      status: HOLDING_UP
      drift: null
      counts: "n=8 anchored · 3 picked 'working out what the cry means' (0.38, inside 1/4–1/2)"

- key: problem.consequence
  vector: PROBLEM
  order: 6
  name: Consequence
  meaning: "What downstream effects result from the problem."
  weight: SHAPES
  founder:
    control: multi_choice
