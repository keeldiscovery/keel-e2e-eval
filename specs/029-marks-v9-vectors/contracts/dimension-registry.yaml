- key: commercial.existing_sacrifice
  vector: COMMERCIAL
  order: 1
  name: Existing sacrifice
  meaning: "Resources already given up because of the problem: money, time, effort, inconvenience, risk, or foregone alternatives."
  weight: DEAL_BREAKER
  founder:
    control: multi_choice
    guidance: "What the problem already costs the decision-maker, as a set: money on substitutes, paid help, time, effort, risk. Always include a 'none of these' code."
    normalized:
      kind: set
      codes: model_written
      code_rule: "4–6 slug codes for this market (e.g. apps_subscriptions, gadgets, paid_help, work_sacrifice, medical_visits) plus the fixed code none ('None of these; they cope with what they have'); ordered as presented."
    option_rule: "4–6 options, each one kind of sacrifice, each with a belief phrase; ticked phrases joined with 'and'."
    belief_template: "Because of this, {actor_plural} already give up {value}."
    unsure_allowed: true
    _decided: 10
  respondent:
    asked_in_v1: true
    part: 3
    anchor: last_purchase
    control: branch_pick_number
    guidance: "Think of the last thing you paid for or gave up because of this. Pick what (founder's codes + 'Nothing'), then roughly how much, all together, in the last three months (money, market currency), then 'still using it?' yes/no. Never the founder's set."
    option_rule: "Pick: founder's labels verbatim + 2–3 distractors + 'Nothing' + 'Something else' (both code-appended); number: currency amount; follow-up: Yes / No."
    chips: ["I can't recall", "I'd rather not say", "That's a rough guess"]
    b2b:
      anchor: last_cycle
      guidance: "What the last cycle of this problem actually cost the team: pick the kinds of cost, then roughly how much in money or hours. The decision-maker sees no context card and nothing of what the specialists said."
      option_rule: "Founder's codes + 'Nothing' + 'Something else'; number in currency or hours."
  answers:
    shape: choice
    compare_rule: set_overlap
    status_vocabulary: [HOLDING_UP, NOT_HOLDING_UP, PEOPLE_DISAGREE, TOO_FEW_TO_CALL, NOT_ASKED_YET, LEFT_OUT]
    drift_template: "you said {founder} · the {n} who described it mostly gave up {observed}"
    floor: 5
    _note: "Compared on the pick; the amount is shown as a median beside the row, not compared."
  left_out: {ask_respondent: false, status: LEFT_OUT, note: "You weren't sure, so this was left out of the study. The brief says it is untested."}
  lullaby:
    founder_question: "Which of these have parents of babies under six months already paid for or given up because of the night crying? Pick all that apply."
    founder_options:
      - {label: "Money on baby apps or subscriptions (tracking, white noise)", normalized: apps_subscriptions, belief_phrase: "money on baby apps"}
      - {label: "Money on gadgets (sleep aids, swaddles, monitors)", normalized: gadgets, belief_phrase: "money on gadgets"}
      - {label: "Paid help so they can sleep (night nurse, doula)", normalized: paid_help, belief_phrase: "money on paid help"}
      - {label: "Time off or a worse day at work after a bad night", normalized: work_sacrifice, belief_phrase: "working days"}
      - {label: "Extra visits to a doctor or health visitor about the crying", normalized: medical_visits, belief_phrase: "extra medical visits"}
      - {label: "None of these; they cope with what they have", normalized: none, belief_phrase: "nothing yet"}
    founder_answer: "apps_subscriptions, gadgets"
    belief_sentence: "Because of this, parents of babies under six months already give up money on baby apps and money on gadgets."
    respondent_question: "Think of the last thing you paid for because of the baby's nights. What was it, and roughly how much have you spent on things like it in the last three months?"
    respondent_options: ["A baby app or subscription", "A gadget (sleep aid, swaddle, monitor)", "Paid help", "A book, course or sleep consultant", "A doctor or health-visitor visit", "Nothing", "Something else", "→ £ amount", "→ Still using it? Yes / No"]
    expected:
      status: HOLDING_UP
      drift: null
      counts: "n=11 anchored (Keiko guessed) · gadgets 7, apps 5 · paid help 0 · median £18 over three months"
      _note: "n=11 is stale under the gate rule (a gate-No answers nothing more; at most 10 people, 8 anchored, reach part 3): to be reworked at n ≤ 10 in corpus r3 (decided 2026-10-07, reconciliation 14); no status is expected to change."

- key: commercial.wtp_hypothesis
  vector: COMMERCIAL
  order: 2
  name: Price
  meaning: "A preliminary view of the price/value boundary at which the offer might be chosen; hypothetical WTP is weaker than real purchase behavior."
  weight: SHAPES
  founder:
    control: price_range
    guidance: "A range the founder believes reasonable, with a period; stored and shown as HYPOTHESIS in the market's currency."
    normalized:
      kind: price_range
      currency: market
      unit_options: ["per month", "per year", "one-off"]
      default_unit: "per month"
      axis_max: 30
      axis_step: 1
      extend_by: 20
    option_rule: "No options: a two-handle range with a period picker. Belief value = 'CUR low to high per period'."
    belief_template: "A fair price would feel like {value} (a hypothesis; interviews do not test it)."
    unsure_allowed: true
    _decided: 11
  respondent:
    asked_in_v1: true
    part: 3
    anchor: last_purchase
    control: two_numbers_optional
    guidance: "What the last comparable thing cost (number + period), and optionally a guess at a fair price for something that helps with this, labelled on screen as a guess. Never the founder's range."
    option_rule: "Number 1 required: amount + period; number 2 optional, labelled 'just a guess'. No options."
    chips: ["I can't recall", "I'd rather not say", "That's a rough guess"]
    b2b:
      anchor: last_purchase
      guidance: "What the last comparable tool or service cost the team per year, and optionally a guess at a budget line for this, labelled as a guess."
      option_rule: "Number 1 required: amount per year; number 2 optional, labelled 'just a guess'."
  answers:
    shape: interval
    compare_rule: price_hypothesis
    status_vocabulary: [NOT_TESTED_BY_DESIGN, LEFT_OUT]
    drift_template: "not tested · by design · you said {founder} · the last comparable thing cost a middle {observed} · {n} told us"
    floor: 5
    _note: "No call is ever made; the floor only gates showing the median. Row tagged HYPOTHESIS on the answers page."
  left_out: {ask_respondent: false, status: LEFT_OUT, note: "You weren't sure, so this was left out of the study. The brief says it is untested."}
  lullaby:
    founder_question: "If a parent paid for the app, what range per month do you think they would consider reasonable?"
    founder_numeric: {unit: "£ per month", axis: "0–30 by 1, extends by 20", picked: "5 to 12"}
    founder_answer: "£5 to £12 per month"
    belief_sentence: "A fair price would feel like £5 to £12 per month (a hypothesis; interviews do not test it)."
    respondent_question: "What did that last thing cost? And, only if you want to guess, what would feel fair per month for something that helps at night?"
    respondent_options: ["£ amount · per month | one-off", "£ per month (just a guess, optional)"]
    expected:
      status: NOT_TESTED_BY_DESIGN
      drift: "not tested · by design · you said £5 to £12 per month · the last comparable thing cost a middle £5 per month · 11 told us"
      counts: "n=11 · last purchase median £5 per month (apps) · 6 offered a guess, median £6"
      _note: "n=11 is stale under the gate rule (a gate-No answers nothing more; at most 10 people, 8 anchored, reach part 3): to be reworked at n ≤ 10 in corpus r3 (decided 2026-10-07, reconciliation 14); no status is expected to change."

