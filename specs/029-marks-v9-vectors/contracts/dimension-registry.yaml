- key: solution.compatibility
  vector: SOLUTION
  order: 1
  name: Compatibility
  meaning: "How well the proposed approach fits the actor's existing workflow, values, routines, and context."
  weight: DEAL_BREAKER
  founder:
    control: single_choice
    guidance: "At what point in the real episode the mechanism would be used: ordered positions in the sequence of attempts, ending with 'it would not fit'."
    normalized:
      kind: ordinal
      codes: [before_any_attempt, after_first_attempt_fails, after_several_attempts, only_when_nothing_works, would_not_fit]
    option_rule: "Exactly 5 options in order onto the codes, worded for this mechanism's moment of use; each with a belief phrase."
    belief_template: "It fits into the episode {value}."
    unsure_allowed: true
  respondent:
    asked_in_v1: true
    part: 2
    anchor: the_reveal
    guidance: "Thinking about that night, at what point, if any, could the mechanism's moment of use (from the reveal, e.g. 'hold the phone near the cot for ten seconds') have fitted. Options worded from the respondent's account's shape, never from the founder's pick."
    control: single_choice
    option_rule: "Founder's codes + 'At no point that night' (= would_not_fit) + 'Something else'."
    chips: ["I can't recall", "I'd rather not say"]
  answers:
    shape: choice
    compare_rule: choice_majority
    status_vocabulary: [HOLDING_UP, NOT_HOLDING_UP, PEOPLE_DISAGREE, TOO_FEW_TO_CALL, NOT_ASKED_YET, LEFT_OUT]
    drift_template: "{side} than you think · you said {founder} · most of the {n} said {observed}"
    floor: 5
    _note: "{side} on this order is 'earlier' | 'later'; 'at no point' has no direction and reads plain Not holding up."
  left_out: {ask_respondent: false, status: LEFT_OUT, note: "You weren't sure, so this was left out of the study. The brief says it is untested."}
  lullaby:
    founder_question: "During a night-time crying episode, at what point would a parent most naturally hold the phone near the cot and let it listen?"
    founder_options:
      - {label: "Straight away, before trying anything", normalized: before_any_attempt, belief_phrase: "right at the start, before anything is tried"}
      - {label: "After the first thing they try has not worked", normalized: after_first_attempt_fails, belief_phrase: "once the first attempt has failed"}
      - {label: "After several attempts, when they are out of ideas", normalized: after_several_attempts, belief_phrase: "only after several attempts"}
      - {label: "Only once the baby has been crying for a long time", normalized: only_when_nothing_works, belief_phrase: "only when nothing has worked"}
      - {label: "It would not fit into the episode at all", normalized: would_not_fit, belief_phrase: "nowhere; it would not fit"}
    founder_answer: "Straight away, before trying anything"
    belief_sentence: "It fits into the episode right at the start, before anything is tried."
    respondent_question: "Thinking about that night, at what point, if any, could you have held the phone near the cot for ten seconds?"
    respondent_options: ["Straight away, before I tried anything", "After the first thing I tried didn't work", "After several tries, when I was out of ideas", "Only once the crying had gone on a long time", "At no point that night", "Something else"]
    expected:
      status: NOT_HOLDING_UP
      drift: "later than you think · you said right at the start · most of the 8 said after the first thing didn't work"
      counts: "n=8 anchored · 2 inside, 4 after the first try, 1 after several, 1 at no point"

- key: solution.relative_advantage
  vector: SOLUTION
  order: 2
  name: Relative advantage
  meaning: "The improvement the user expects over the current alternative before the new solution is worth changing behavior for."
  weight: DEAL_BREAKER
  founder:
    control: single_choice
    guidance: "The one thing that must be materially better than the current routine for people to switch."
    normalized:
      kind: categorical
      codes: [fewer_attempts, shorter_time, less_worry, less_help_needed, easier_recovery]
    option_rule: "Exactly 5 options onto the codes, worded for this circumstance; each with a belief phrase naming the improvement as a noun phrase."
    belief_template: "To be worth switching to, it must mainly deliver {value}."
    unsure_allowed: true
  respondent:
    asked_in_v1: true
    part: 2
    anchor: the_reveal
    control: single_choice
    guidance: "If you had had that information that night, what, if anything, would have gone differently: one pick, including 'nothing would have changed'. Never the founder's pick first."
    option_rule: "Founder's codes + 'Nothing would have changed' + 'Something else'."
    chips: ["I can't recall", "I'd rather not say"]
  answers:
    shape: choice
    compare_rule: choice_majority
    status_vocabulary: [HOLDING_UP, NOT_HOLDING_UP, PEOPLE_DISAGREE, TOO_FEW_TO_CALL, NOT_ASKED_YET, LEFT_OUT]
    drift_template: "you said {founder} · most of the {n} said {observed}"
    floor: 5
  left_out: {ask_respondent: false, status: LEFT_OUT, note: "You weren't sure, so this was left out of the study. The brief says it is untested."}
  lullaby:
    founder_question: "Compared with how a parent copes today, what would have to be clearly better for them to prefer a suggestion from the app?"
    founder_options:
      - {label: "Fewer things tried before the baby settles", normalized: fewer_attempts, belief_phrase: "fewer things tried before the baby settles"}
      - {label: "A shorter time until the baby settles", normalized: shorter_time, belief_phrase: "a shorter time to settle"}
      - {label: "Less worry and second-guessing while it is happening", normalized: less_worry, belief_phrase: "less worry in the moment"}
      - {label: "Less need to wake or call on someone else", normalized: less_help_needed, belief_phrase: "less need for a second pair of hands"}
      - {label: "Less strain afterwards, such as getting back to sleep", normalized: easier_recovery, belief_phrase: "an easier recovery afterwards"}
    founder_answer: "Fewer things tried before the baby settles"
    belief_sentence: "To be worth switching to, it must mainly deliver fewer things tried before the baby settles."
    respondent_question: "If you had had a suggestion of what the cry meant that night, what, if anything, would have gone differently?"
    respondent_options: ["I'd have tried fewer things", "The baby would have settled sooner", "I'd have worried less", "I wouldn't have needed to wake anyone", "I'd have got back to sleep more easily", "Nothing would have changed", "Something else"]
    expected:
      status: HOLDING_UP
      drift: null
      counts: "n=8 anchored · 6 inside (fewer things), 1 settled sooner, 1 nothing would have changed"

- key: solution.effectiveness_threshold
  vector: SOLUTION
  order: 3
  name: Effectiveness threshold
  meaning: "The minimum outcome improvement that would make the solution useful."
  weight: DEAL_BREAKER
  founder:
    control: numeric_threshold
    guidance: "The smallest improvement per episode that would matter, as one number with a unit (minutes or percent). This sets a bar; interviews never clear it (HANDOFF Decision 4)."
    normalized:
      kind: threshold
      unit_options: [minutes, percent]
      default_unit: minutes
      axis_max: 30
      axis_step: 5
      extend_by: 15
      bins: ["0-5", "5-10", "10-20", "20+"]
    option_rule: "No options: one handle with a unit picker. Belief value = 'at least N unit'. The bins are the respondent's bands and must be contiguous."
    belief_template: "It is worth using only if it saves at least {value} per episode."
    unsure_allowed: true
    _decided: 2
  respondent:
    asked_in_v1: true
    part: 2
    anchor: the_reveal
    control: single_choice_bands
    guidance: "How much sooner that night would have needed to end for a suggestion to have been worth it: contiguous bands plus 'nothing would have made it worth it'. Never the founder's number."
    option_rule: "Fixed bands from normalized.bins in the founder's unit, plus 'Nothing would have made it worth it'. No 'Something else'. Code renders the options; the model writes the question only."
    chips: ["I can't recall", "I'd rather not say", "That's a rough guess"]
  answers:
    shape: interval
    compare_rule: threshold_band
    status_vocabulary: [BAR_SET, PEOPLE_DISAGREE, TOO_FEW_TO_CALL, NOT_ASKED_YET, LEFT_OUT]
    drift_template: "bar set {side} than yours · you set {founder} · middle answer {observed} · {n} described it"
    floor: 5
    _note: "Never HOLDING_UP, never NOT_HOLDING_UP: the brief says where the bar sits, never that it is met. 'Nothing would make it worth it' counts as the top band. {side} = 'higher' | 'lower' | 'level with' (decision 2)."
  left_out: {ask_respondent: false, status: LEFT_OUT, note: "You weren't sure, so this was left out of the study. The brief says it is untested."}
  lullaby:
    founder_question: "What is the smallest reduction in the time it takes to settle the baby that would make the app worth using for a parent?"
    founder_numeric: {unit: minutes, axis: "0–30 min by 5, extends by 15", picked: "5"}
    founder_answer: "at least 5 minutes"
    belief_sentence: "It is worth using only if it saves at least 5 minutes per episode."
    respondent_question: "For a suggestion like that to have been worth it that night, how much sooner would the baby have needed to settle?"
    respondent_options: ["Under 5 minutes sooner", "5 to 10 minutes sooner", "10 to 20 minutes sooner", "More than 20 minutes sooner", "Nothing would have made it worth it"]
    expected:
      status: BAR_SET
      drift: "bar set higher than yours · you set 5 minutes · middle answer 10 to 20 minutes · 8 described it"
      counts: "n=8 anchored · under 5: 1 · 5–10: 2 · 10–20: 4 · 20+: 1 · bar set at 10 min"

- key: solution.trust_risk
  vector: SOLUTION
  order: 4
  name: Trust / risk
  meaning: "The conditions that make the user willing or unwilling to rely on the solution and the risks that matter."
  weight: SHAPES
  founder:
    control: multi_choice
    guidance: "Which conditions must hold before people act on the mechanism's output: evidence, transparency, stakes, privacy, safety."
    normalized:
      kind: set
      codes: model_written
      code_rule: "4–6 slug codes for this mechanism (e.g. labelled_suggestion, gives_reason, medical_escalation, audio_private, expert_backing, safe_actions_only). The respondent side adds the fixed code own_instinct ('I'd go with my own instinct either way'), never offered to the founder."
    option_rule: "4–6 options, each one condition, each with a belief phrase; ticked phrases joined with 'and'."
    belief_template: "{actor_plural} would act on it only if {value}."
    unsure_allowed: true
    _decided: 12
  respondent:
    asked_in_v1: true
    part: 2
    anchor: the_reveal
    control: multi_choice
    guidance: "What would need to be true before you acted on a suggestion like that, that night: tick all; include 'I'd go with my own instinct either way'."
    option_rule: "Founder's labels verbatim + 2–3 distractors + 'I'd go with my own instinct either way' + 'Something else' (both code-appended)."
    chips: ["I can't recall", "I'd rather not say"]
  answers:
    shape: choice
    compare_rule: set_overlap
    status_vocabulary: [HOLDING_UP, NOT_HOLDING_UP, PEOPLE_DISAGREE, TOO_FEW_TO_CALL, NOT_ASKED_YET, LEFT_OUT]
    drift_template: "you said {founder} · the {n} who described it also need {observed}"
    floor: 5
  left_out: {ask_respondent: false, status: LEFT_OUT, note: "You weren't sure, so this was left out of the study. The brief says it is untested."}
  lullaby:
    founder_question: "Which of these would a parent need to be true before they acted on a suggestion about what the baby may need? Pick all that apply."
    founder_options:
      - {label: "It says plainly that it is a suggestion, not a diagnosis", normalized: labelled_suggestion, belief_phrase: "it is plainly labelled a suggestion"}
      - {label: "It explains why it is suggesting that need", normalized: gives_reason, belief_phrase: "it gives its reason"}
      - {label: "It points to a doctor when the cry could signal something serious", normalized: medical_escalation, belief_phrase: "it knows when to say 'call a doctor'"}
      - {label: "Audio of the baby is not stored or shared", normalized: audio_private, belief_phrase: "the audio stays on the phone"}
      - {label: "A paediatrician or other expert stands behind it", normalized: expert_backing, belief_phrase: "an expert stands behind it"}
      - {label: "It suggests only safe actions, never medicine or anything risky", normalized: safe_actions_only, belief_phrase: "it only ever suggests safe things to try"}
    founder_answer: "labelled_suggestion, safe_actions_only"
    belief_sentence: "Parents of babies under six months would act on it only if it is plainly labelled a suggestion and it only ever suggests safe things to try."
    respondent_question: "What would have needed to be true before you acted on a suggestion like that, that night? Tick all that apply."
    respondent_options: ["It says plainly it is a suggestion, not a diagnosis", "It explains why", "It tells me when to call a doctor", "The recording isn't stored or shared", "A paediatrician stands behind it", "It only suggests safe things to try", "I'd go with my own instinct either way", "Something else"]
    expected:
      status: NOT_HOLDING_UP
      drift: "you said labelled a suggestion and safe actions only · the 8 who described it also need the recording not stored (5 of 8)"
      counts: "n=8 anchored · labelled 6, safe actions 5 · not stored 5 (unpicked, over half) · own instinct 2"

- key: solution.reliability_tolerance
  vector: SOLUTION
  order: 5
  name: Reliability tolerance
  meaning: "How much error, inconsistency, or failure the user can tolerate before value or trust collapses."
  weight: SHAPES
  founder:
    control: single_choice
    guidance: "How often the output could be wrong before people stop using it: ordered failure bands out of ten, never a target accuracy number."
    normalized:
      kind: ordinal
      codes: [never_wrong, one_in_ten, one_in_five, one_in_three, half_the_time]
    option_rule: "Exactly 5 options in order onto the codes (0 · about 1 in 10 · about 2–3 in 10 · about 3–4 in 10 · 5 or more in 10), contiguous; each with a belief phrase."
    belief_template: "They keep using it as long as it is wrong no more than {value}."
    unsure_allowed: true
  respondent:
    asked_in_v1: true
    part: 2
