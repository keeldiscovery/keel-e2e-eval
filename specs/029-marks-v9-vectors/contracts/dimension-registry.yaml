- key: problem.urgency
  vector: PROBLEM
  order: 9
  name: Urgency
  meaning: "How quickly the actor feels compelled to act when the problem occurs."
  weight: SHAPES
  founder:
    control: single_choice
    guidance: "How soon after the trigger the actor feels they must act: contiguous time bins plus 'waits to see'."
    normalized:
      kind: ordinal
      codes: [within_a_minute, within_five_minutes, five_to_ten_minutes, after_ten_minutes, waits_to_see]
    option_rule: "Exactly 5 options in order onto the codes, bins contiguous (under 1 min · 1–5 · 5–10 · over 10 · waits); each with a belief phrase."
    belief_template: "When it starts, {actor_plural} feel they must act {value}."
    unsure_allowed: true
  respondent:
    asked_in_v1: false
    part: null
    anchor: that_night
    control: single_choice
    guidance: "NOT ASKED IN V1. When asked: that night, how long after it started did you do the first thing; same bins. Never names the idea."
    option_rule: "Founder's 5 bins, no distractors, no 'Something else'."
    chips: ["I can't recall", "I'd rather not say"]
    _why: >-
      Decided 2026-10-06 (HANDOFF §2, Part 1 = 8): time-to-action on a recalled night is the weakest
      recall of the set and overlaps Workaround burden's first step; it is pilot evidence (timestamps).
      Kept in the registry so the brief has a row and V2 can switch it on without a schema change.
  answers:
    shape: choice
    compare_rule: ordinal_band
    status_vocabulary: [NOT_ASKED_YET, LEFT_OUT]
    drift_template: "{side} than you think · you said {founder} · most of the {n} acted {observed}"
    floor: 5
    _note: "In V1 a founder belief here reads NOT_ASKED_YET · 'not asked in this round' (decision 3). {side} = 'sooner' | 'later' when switched on."
    _decided: 3
  left_out: {ask_respondent: false, status: LEFT_OUT, note: "You weren't sure, so this was left out of the study. The brief says it is untested."}
  lullaby:
    founder_question: "When the baby cries at night and the cause is not clear, how soon do you think a parent feels they must act?"
    founder_options:
      - {label: "Right away, within the first minute", normalized: within_a_minute, belief_phrase: "within the first minute"}
      - {label: "Within a few minutes", normalized: within_five_minutes, belief_phrase: "within a few minutes"}
      - {label: "After the crying has gone on for 5 to 10 minutes", normalized: five_to_ten_minutes, belief_phrase: "after five to ten minutes of crying"}
      - {label: "Only once it has gone on longer than 10 minutes, or gets louder", normalized: after_ten_minutes, belief_phrase: "only after ten minutes or more"}
      - {label: "They wait to see whether the baby settles alone", normalized: waits_to_see, belief_phrase: "only if the baby does not settle alone"}
    founder_answer: "I'm not sure"
    belief_sentence: "Left out: you weren't sure."
    respondent_question: null
    respondent_options: []
    expected:
      status: LEFT_OUT
      drift: null
      counts: "not asked"

