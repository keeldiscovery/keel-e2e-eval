      codes: [same_person, user_decides_other_pays, joint_decision, someone_else_decides, institution_pays]
    option_rule: "Exactly 5 options onto the codes, worded for this market's roles; each with a belief phrase that names the chain."
    belief_template: "On buying: {value}."
    unsure_allowed: true
  respondent:
    asked_in_v1: true
    part: 3
    anchor: last_purchase
    control: single_choice
    guidance: "Who paid for that last thing, and did anyone else have to agree: one pick on the same chains, plus 'it was free'."
    option_rule: "Founder's 5 codes worded as 'me, no one else needed to agree' etc. + 'It was free' (escape). No 'Something else'."
    chips: ["I can't recall", "I'd rather not say"]
    b2b:
      anchor: last_purchase
      guidance: "For the last comparable purchase: who had to agree before it went through (you alone · you plus your manager · a committee · procurement or finance · someone else entirely)."
      option_rule: "5 options mirroring the codes + 'It was free'."
  answers:
    shape: choice
    compare_rule: role_chain_match
    status_vocabulary: [HOLDING_UP, NOT_HOLDING_UP, PEOPLE_DISAGREE, TOO_FEW_TO_CALL, NOT_ASKED_YET, LEFT_OUT]
    drift_template: "you said {founder} · most of the {n} said {observed}"
    floor: 5
  left_out: {ask_respondent: false, status: LEFT_OUT, note: "You weren't sure, so this was left out of the study. The brief says it is untested."}
  lullaby:
    founder_question: "When a parent decides to try something new for the baby's nights, who actually pays for it?"
    founder_options:
      - {label: "The parent pays for it themselves, with no one else to agree", normalized: same_person, belief_phrase: "the same person uses it, decides and pays"}
      - {label: "The parent decides, but a partner or shared account pays", normalized: user_decides_other_pays, belief_phrase: "the parent decides and someone else in the household pays"}
      - {label: "The parent and their partner decide together", normalized: joint_decision, belief_phrase: "the parent and their partner decide together"}
      - {label: "A relative or friend buys it as a gift", normalized: someone_else_decides, belief_phrase: "someone outside the household buys it"}
      - {label: "An employer, insurer or health plan pays", normalized: institution_pays, belief_phrase: "an institution pays"}
    founder_answer: "The parent pays for it themselves, with no one else to agree"
    belief_sentence: "On buying: the same person uses it, decides and pays."
    respondent_question: "Who paid for that last thing, and did anyone else need to agree?"
    respondent_options: ["Me; no one else needed to agree", "Me, but my partner had to agree", "My partner", "A relative or friend, as a gift", "An employer or health plan", "It was free"]
    expected:
      status: HOLDING_UP
      drift: null
      counts: "n=11 anchored · 8 inside (me) · 2 my partner, 1 a grandparent"
      _note: "n=11 is stale under the gate rule (a gate-No answers nothing more; at most 10 people, 8 anchored, reach part 3): to be reworked at n ≤ 10 in corpus r3 (decided 2026-10-07, reconciliation 14); no status is expected to change."

- key: commercial.purchase_friction
  vector: COMMERCIAL
  order: 5
  name: Purchase friction
  meaning: "The approvals, procurement, account setup, switching, security, spouse/manager agreement, or other steps between interest and purchase."
  weight: SHAPES
  founder:
    control: multi_choice
    guidance: "What could slow or stop the decision-maker between interest and paying: approvals, proof, payment effort, cancellation worry, privacy, forgetting."
    normalized:
      kind: set
      codes: model_written
      code_rule: "4–6 slug codes for this market (e.g. partner_approval, social_proof, payment_effort, cancel_worry, privacy, forgetting); ordered as presented."
    option_rule: "4–6 options, each one blocker, each with a belief phrase; ticked phrases joined with 'and'."
    belief_template: "Between wanting it and paying, {value} could hold them back."
    unsure_allowed: true
  respondent:
    asked_in_v1: true
    part: 3
    anchor: last_purchase
    control: multi_choice
    guidance: "The last time you nearly bought something for this and didn't, what got in the way; or, for that last purchase, what had to happen first. Tick all; include 'Nothing; it never came up'."
    option_rule: "Founder's labels verbatim + 2–3 distractors + 'Nothing; it never came up' + 'Something else' (both code-appended)."
    chips: ["I can't recall", "I'd rather not say"]
    b2b:
      anchor: last_purchase
      guidance: "For the last comparable purchase, what had to happen before it went through: security review, procurement, a pilot, budget sign-off, a champion, a contract. Tick all."
      option_rule: "Founder's codes + 'Nothing; it went straight through' + 'Something else'."
  answers:
    shape: choice
    compare_rule: set_overlap
    status_vocabulary: [HOLDING_UP, NOT_HOLDING_UP, PEOPLE_DISAGREE, TOO_FEW_TO_CALL, NOT_ASKED_YET, LEFT_OUT]
    drift_template: "you said {founder} · the {n} who described it were mostly held back by {observed}"
    floor: 5
  left_out: {ask_respondent: false, status: LEFT_OUT, note: "You weren't sure, so this was left out of the study. The brief says it is untested."}
  lullaby:
    founder_question: "Which of these would most likely slow down or stop a parent between hearing about the app and actually paying for it? Pick all that apply."
    founder_options:
      - {label: "Needing a partner's agreement first", normalized: partner_approval, belief_phrase: "needing a partner's agreement"}
      - {label: "Wanting reviews or a recommendation from other parents or a doctor", normalized: social_proof, belief_phrase: "wanting to see reviews first"}
      - {label: "Entering card details when tired and half awake", normalized: payment_effort, belief_phrase: "the card-details step at night"}
      - {label: "Worry about a subscription that is hard to cancel", normalized: cancel_worry, belief_phrase: "worry about cancelling"}
      - {label: "Concern about privacy of recordings of the baby", normalized: privacy, belief_phrase: "worries about recording the baby"}
      - {label: "Forgetting about it once the night is over", normalized: forgetting, belief_phrase: "forgetting by morning"}
    founder_answer: "partner_approval, privacy"
    belief_sentence: "Between wanting it and paying, needing a partner's agreement and worries about recording the baby could hold them back."
    respondent_question: "The last time you nearly bought something for the baby and didn't, what got in the way? Tick all that apply."
    respondent_options: ["I needed my partner to agree", "I wanted reviews or a recommendation first", "Entering card details when I was exhausted", "Worry it would be hard to cancel", "Privacy of recordings of the baby", "I forgot about it by morning", "Nothing; it never came up", "Something else"]
    expected:
      status: NOT_HOLDING_UP
      drift: "you said a partner's agreement and privacy · the 11 who described it were mostly held back by wanting reviews first (6 of 11)"
      counts: "n=11 anchored · partner 4, privacy 3 · reviews 6 (unpicked, over half) · never came up 2"
      _note: "n=11 is stale under the gate rule (a gate-No answers nothing more; at most 10 people, 8 anchored, reach part 3): to be reworked at n ≤ 10 in corpus r3 (decided 2026-10-07, reconciliation 14); no status is expected to change."

- key: commercial.commitment
  vector: COMMERCIAL
  order: 6
  name: Commitment
  meaning: "The meaningful actions the person is willing to take before purchase, such as time, installation, data access, referral, deposit, or trial participation."
  weight: DEAL_BREAKER
  founder:
    control: multi_choice
    guidance: "Which real next steps people would take now for a trial, from a fixed ladder for the market type; the founder's highest ticked rung is the belief."
    normalized:
      kind: ladder
      codes: model_written
      code_rule: "Exactly the 5 fixed rungs for the project's type, in order. B2C: setup, install, mic, next_episode, contact_me. B2B: call, read_only_trial, it_intro, data, paid_pilot. The model writes the labels for the mechanism; the respondent side adds the fixed code nothing_yet ('Nothing yet'), never offered to the founder."
    option_rule: "Exactly 5 options, one per rung, in rung order; each with a belief phrase naming the action."
    belief_template: "For a trial, right now, they would go as far as {value}."
    unsure_allowed: true
    _decided: 9
  respondent:
    asked_in_v1: true
    part: 3
    anchor: last_purchase
    control: multi_choice_ladder
    guidance: "Tick what you would actually do now, not what you might do: the 5 rungs for the market type plus 'Nothing yet'. Real next steps, offered after the done screen as far as the product can honour them."
    option_rule: "The 5 B2C rungs (setup, install, mic, next_episode, contact_me) + 'Nothing yet'. No 'Something else'."
    chips: ["I'd rather not say"]
    b2b:
      anchor: last_cycle
      guidance: "Tick the real next steps you would take now: the B2B ladder plus 'Nothing yet'."
      option_rule: "The 5 B2B rungs + 'Nothing yet'. No 'Something else'."
      ladder_rungs: [call, read_only_trial, it_intro, data, paid_pilot]
  answers:
    shape: choice
    compare_rule: ladder_rung
    status_vocabulary: [HOLDING_UP, NOT_HOLDING_UP, PEOPLE_DISAGREE, TOO_FEW_TO_CALL, NOT_ASKED_YET, LEFT_OUT]
    drift_template: "fewer would go as far as you think · you said {founder} · {observed} of {n} would"
    floor: 5
  left_out: {ask_respondent: false, status: LEFT_OUT, note: "You weren't sure, so this was left out of the study. The brief says it is untested."}
  lullaby:
    founder_question: "For a trial right now, which of these do you think most parents would actually do? Pick all that apply."
    founder_options:
      - {label: "Set it up on their phone before the next night", normalized: setup, belief_phrase: "setting it up before the next night"}
      - {label: "Install the app", normalized: install, belief_phrase: "installing the app"}
      - {label: "Allow it to use the microphone at night", normalized: mic, belief_phrase: "allowing the microphone"}
      - {label: "Try it at the next night-time wake-up", normalized: next_episode, belief_phrase: "trying it at the next wake-up"}
      - {label: "Have you contact them about the pilot", normalized: contact_me, belief_phrase: "asking to be contacted"}
    founder_answer: "install, mic"
    belief_sentence: "For a trial, right now, they would go as far as allowing the microphone."
    respondent_question: "Which of these would you actually do now? Tick all that apply."
    respondent_options: ["Set it up on my phone before tonight", "Install the app", "Allow it to use the microphone at night", "Try it at the next night-time wake-up", "Have the founder contact me", "Nothing yet"]
    expected:
      status: NOT_HOLDING_UP
      drift: "fewer would go as far as you think · you said allowing the microphone · 4 of 11 would"
      counts: "n=11 · install 6, mic 4, next wake-up 2, contact me 2 · nothing yet 3"
      _note: "n=11 is stale under the gate rule (a gate-No answers nothing more; at most 10 people, 8 anchored, reach part 3): to be reworked at n ≤ 10 in corpus r3 (decided 2026-10-07, reconciliation 14); no status is expected to change."

- key: commercial.retention_potential
  vector: COMMERCIAL
  order: 7
  name: Retention potential
  meaning: "Whether the underlying need recurs often enough for repeated value; actual product retention cannot yet be measured."
  weight: SHAPES
  founder:
    control: single_choice
    guidance: "How often people return to the tools or routines they use for this today (a proxy for recurring need). NOT how often the problem occurs; that is Frequency."
    normalized:
      kind: ordinal
      codes: [daily, several_times_a_week, weekly, a_few_times_a_month, rarely]
    option_rule: "Exactly 5 options in order onto the codes, about returning to current tools or routines; each with a belief phrase."
    belief_template: "They return to what they use for this today {value}."
    unsure_allowed: true
  respondent:
    asked_in_v1: false
    part: null
    anchor: last_purchase
    control: single_choice
    guidance: "NOT ASKED IN V1. When asked: for the last tool or routine you used for this, how often have you gone back to it in the last month; same bands."
    option_rule: "Founder's 5 bands, no distractors, no 'Something else'."
    chips: ["I can't recall", "I'd rather not say"]
    b2b:
      anchor: last_cycle
      guidance: "NOT ASKED IN V1. When asked: how often the team returns to its current tool or workaround for this."
      option_rule: "Founder's 5 bands."
    _why: >-
      Decided 2026-10-06 (HANDOFF §2, Part 3 = 6): the recurrence of the need is already read from
      Frequency on the Problem side, and return-to-current-tools is a weak proxy for retention that the
      pilot measures directly. Kept in the registry so the brief has a row and V2 can switch it on.
  answers:
    shape: choice
    compare_rule: ordinal_band
    status_vocabulary: [NOT_ASKED_YET, LEFT_OUT]
    drift_template: "{side} than you think · you said {founder} · most of the {n} go back {observed}"
    floor: 5
    _note: "In V1 a founder belief here reads NOT_ASKED_YET · 'not asked in this round' (decision 3). {side} = 'less often' | 'more often' when switched on."
    _decided: 3
  left_out: {ask_respondent: false, status: LEFT_OUT, note: "You weren't sure, so this was left out of the study. The brief says it is untested."}
  lullaby:
    founder_question: "How often do you think parents go back to the tools or routines they already use for the baby's nights, such as a tracking or white-noise app?"
    founder_options:
      - {label: "Every night", normalized: daily, belief_phrase: "every night"}
      - {label: "Several nights a week", normalized: several_times_a_week, belief_phrase: "several nights a week"}
      - {label: "About once a week", normalized: weekly, belief_phrase: "about weekly"}
      - {label: "A few times a month", normalized: a_few_times_a_month, belief_phrase: "a few times a month"}
      - {label: "Rarely; they drift away from them", normalized: rarely, belief_phrase: "rarely"}
    founder_answer: "I'm not sure"
    belief_sentence: "Left out: you weren't sure."
    respondent_question: null
    respondent_options: []
    expected:
      status: LEFT_OUT
      drift: null
      counts: "not asked"

# ───────────────────────── CHECKS (the seven invariants of registry-schema.draft.md, as achieved) ─────────────────────────
checks:
  1_keys: {total: 25, per_vector: {PROBLEM: 9, SOLUTION: 9, COMMERCIAL: 7}, order_contiguous: true}
  2_deal_breakers:
    PROBLEM: [problem.prevalence, problem.frequency, problem.duration]
    SOLUTION: [solution.compatibility, solution.relative_advantage, solution.effectiveness_threshold]
    COMMERCIAL: [commercial.existing_sacrifice, commercial.buyer_payer_alignment, commercial.commitment]
    count: 9
  3_asked_in_v1:
    asked_in_v1_true: 23
    asked_in_v1_false: [problem.urgency, commercial.retention_potential]
    parts: {1: 8, 2: 9, 3: 6}
  4_belief_templates: {entries: 25, with_value_exactly_once: 25}
  5_codes:
    closed_controls_with_fixed_codes: 12      # prevalence 5, severity 5, importance 5, current_solution 5, urgency 5, compatibility 5, relative_advantage 5, reliability 5, adoption 5, ability_to_pay 4, buyer_payer 5, retention 5 (commitment's two ladders are fixed per type but carried in code_rule, so it is counted under model_written)
    model_written_sets: 9                     # consequence, workaround, trust_risk, trialability, observability, target_circumstance, existing_sacrifice, purchase_friction, commitment (labels)
    numeric: 4                                # frequency, duration, effectiveness_threshold, wtp_hypothesis
    code_counts_in_4_to_6: true
    numeric_bins_contiguous: true             # frequency 0..7; effectiveness 0-5 / 5-10 / 10-20 / 20+; prevalence fifths
  6_shape_iff_numeric_control:
    interval: [problem.frequency, problem.duration, solution.effectiveness_threshold, commercial.wtp_hypothesis]
    controls: [segmented_0_to_7, number_with_unit, single_choice_bands, two_numbers_optional]
    choice_count: 21
    holds: true
  7_gate: {key: problem.prevalence, control: gate_yes_no, only_gate: true}
  lullaby_statuses:
    HOLDING_UP: 12                            # includes problem.prevalence, holding up from ABOVE the founder's 0.6–0.8 bin (decision 6); counts unchanged by that restoration
    NOT_HOLDING_UP: 6
    PEOPLE_DISAGREE: 3
    BAR_SET: 1
    NOT_TESTED_BY_DESIGN: 1
    LEFT_OUT: 2
    with_drift_clause_while_holding: [problem.prevalence]   # "more than you think"
    vector_verdicts: {PROBLEM: "Not holding up · smaller than you think (Duration)", SOLUTION: "Not holding up · later than you think (Compatibility)", COMMERCIAL: "Not holding up (Commitment)"}
    _note: "The marks-v9 §5 worked excerpt is re-expressed from these lullaby objects (same answers, codes, statuses, counts); the registry owns the example. The six commercial examples' n=11 is to be reworked at n ≤ 10 in corpus r3 (decided 2026-10-07, reconciliation 14)."
