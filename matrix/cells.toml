# The matrix, as data (specs 020-matrix-workflow and 021-short-journey; keel-cloud
# `canon/designs/e2e-matrix-design.md` §5). This file is the ONLY place the cells are written down:
# `.github/workflows/matrix.yml`'s `select` job reads it, `make matrix-check` reads it, and
# `tests/test_matrix_cells.py` holds it to the six coverage rules. A founder who wants a different
# set edits this file and nothing else -- decision 4's "[overrulable]" is one line here, and spec
# 021 is that overrule having been used.
#
# THE PYTHON AXIS HAS THREE VALUES AND THE DESIGN'S §5.1 NAMES TWO. That is reconciled here rather
# than quietly: §5.2 and §10 both count eighteen weekly cells and six nightly ones, and 3 OS x 2
# hosts x 2 Pythons is twelve and four. Eighteen is 3 x 2 x **3**, §10's per-OS split for the weekly
# set is "6 / 6 / 6" (two hosts x three Pythons), and the design's own picker sample in §4.3 reads
# `ubuntu · copilot · py3.12`. So the axis is the floor (3.9, spec 004's promise), the current
# (3.13, what brew/winget hand out) and 3.12 -- what Ubuntu 24.04 ships as its system Python and
# what this harness itself runs on. (Spec 021 has since moved which of the three each set spends:
# see the next paragraph. The axis itself did not move.)
#
# THE SETS ARE SPEC 021's, NOT §5.2's, AND THE FOUNDER CHANGED THEM ON 2026-09-11. Three
# decisions, each one a line below:
#
#   1. A qualifying change buys the SHORT journey on four cells -- the host leg entire (the plugin
#      from the marketplace into a fresh host home, "keel connect", device approval, the runtime on
#      the host's executor) plus the FIRST model job, the PROBLEM frame's confirmation card, and
#      then the way out. That is the part that breaks when an OS, a Python or a host CLI moves.
#      The whole journey is about thirteen premium requests a cell; the short one is two.
#   2. UBUNTU LEAVES per_change AND nightly -- "fewer than 5% of founders" -- and stays in the
#      weekly eighteen, whole. It is not dropped; it is bought once a week rather than once a
#      merge.
#   3. The FLOOR (3.9) moves from per_change to nightly, on Windows, both hosts. spec 004's floor
#      is still a promise and the night is still every night.
#
# `legs` is the new per-cell field. It is optional and defaults to `full`, so a cell written
# before today means what it meant, and the workflow exports it as KEEL_JOURNEY_LEGS.
#
# A cell's Python is the runtime's, not the harness's: it is what `python3` resolves to when the
# host CLI runs the skill's script, which is what the bundled runtime is then executed by (spec 003
# of the skill, and what `make acceptance`'s Debian 11 bed proves locally). The harness itself
# needs 3.11+ (tomllib) and the workflow gives it its own interpreter, so a 3.9 cell is a 3.9
# measurement of the thing under test and never of the referee.

[axes]
# The runner labels, verbatim: a cell's `os` IS its `runs-on`.
os = ["ubuntu-24.04", "macos-latest", "windows-latest"]
host = ["claude", "copilot"]
# A host the matrix buys but does not owe (keel-runtime spec 008, the founder's ask of 2026-09-12:
# "ensure that our application is compatible with Codex"): it runs, and it has not passed
# keel-skill-design §5.5's four-part gate. Allowed in nightly and weekly, never in per_change, and
# not part of the product weekly must cover. Codex's cell bills OpenAI API tokens against
# KEEL_RUNTIME_CI_CODEX, one nightly journey a night. It leaves this list for `host` the day the
# gate is green for it.
host_unmeasured = ["codex"]
# The hosts a merge and the night pay for (the founder, 2026-09-12: "Claude Code is the one we
# want to run daily in the night; Copilot and Codex only once a week"). Copilot stays measured
# and stays in the weekly product; it is simply bought weekly rather than nightly and per merge.
host_everyday = ["claude"]
python = ["3.9", "3.12", "3.13"]

[scenarios]
# What a cell runs when it does not say otherwise: S-012, the founder's journey through the cell's
# host (spec 019). §5.1: "the scenario each cell runs is S-001, the founder's journey, through the
# host ... S-012 becomes the Copilot instance of it".
default = ["s012"]
# Which of them are `-m live` -- a real model, real money, `make eval-live`. Everything else is
# `make eval`, deterministic and free. The workflow splits a cell's list on this, which is how the
# nightly's corpus cell (S-005/6/7, decision 11: "they cost nothing but minutes") rides on a cell
# that is already paid for.
live = ["s004", "s012"]

# ------------------------------------------------------------------------------------- the sets

[sets]

# Every qualifying change (spec 021, FOUR cells): macOS and Windows, each host, the current
# Python, the SHORT journey. These are the two operating systems founders install the plugin on
# and the Python brew and winget hand them; Ubuntu and the floor are bought overnight instead.
#
# Nothing here overrides `scenarios`: the cheap set runs S-012 and only S-012, which is what
# `coverage_problems` holds it to.
per_change = [
    # 2026-09-12: two cells, not four -- Copilot moved to the weekly set with Codex.
    { os = "macos-latest",   host = "claude",  python = "3.13", legs = "short" },
    { os = "windows-latest", host = "claude",  python = "3.13", legs = "short" },
]

# Nightly, 03:00 UTC (spec 021, SIX cells): the four a merge bought short, bought WHOLE -- so a
# break the short journey cannot see is at most a day old -- plus Windows on the 3.9 floor, both
# hosts, which is where spec 004's promise is now kept. Ubuntu is weekly.
#
# The corpus scenarios ride on ONE cell, macOS x Claude (decision 11): S-005/6/7 drive the
# product's own judgement through the real screens against the frozen corpus, they call no model
# at all, and they are the nightly's answer to "did the reading still read right" -- so they cost
# this set nothing but the minutes of a cell that was already running. They need keel-cloud's
# corpus directory, which the cell job checks out beside the two public siblings.
nightly = [
    { os = "macos-latest",   host = "claude",  python = "3.13", scenarios = ["s012", "s005", "s006", "s007", "s013"] },
    # spec 022: the same journey with the skill reaching Claude through the Spec Kit extension --
    # `specify extension add`, the two commands as project skills -- short, once a night.
    { os = "macos-latest",   host = "claude",  python = "3.13", legs = "short", install = "speckit" },
    { os = "windows-latest", host = "claude",  python = "3.13" },
    { os = "windows-latest", host = "claude",  python = "3.9" },
]

# Weekly, Sunday 04:00 UTC (§5.2, eighteen cells): the full product of the three axes, every one
# of them the whole journey. "A weekly confirmation that nothing is hiding in a corner", and the
# one set Ubuntu is in. `tests/test_matrix_cells.py` asserts this set IS the product rather than
# trusting the list below to stay complete.
weekly = [
    { os = "ubuntu-24.04",   host = "claude",  python = "3.9" },
    { os = "ubuntu-24.04",   host = "claude",  python = "3.12" },
    { os = "ubuntu-24.04",   host = "claude",  python = "3.13" },
    { os = "ubuntu-24.04",   host = "copilot", python = "3.9" },
    { os = "ubuntu-24.04",   host = "copilot", python = "3.12" },
    { os = "ubuntu-24.04",   host = "copilot", python = "3.13" },
    { os = "macos-latest",   host = "claude",  python = "3.9" },
    { os = "macos-latest",   host = "claude",  python = "3.12" },
    { os = "macos-latest",   host = "claude",  python = "3.13" },
    { os = "macos-latest",   host = "copilot", python = "3.9" },
    { os = "macos-latest",   host = "copilot", python = "3.12" },
    { os = "macos-latest",   host = "copilot", python = "3.13" },
    { os = "windows-latest", host = "claude",  python = "3.9" },
    { os = "windows-latest", host = "claude",  python = "3.12" },
    { os = "windows-latest", host = "claude",  python = "3.13" },
    { os = "windows-latest", host = "copilot", python = "3.9" },
    { os = "windows-latest", host = "copilot", python = "3.12" },
    { os = "windows-latest", host = "copilot", python = "3.13" },
    # keel-runtime spec 008: the unmeasured host, once a week on each operating system founders
    # install on, whole (the founder, 2026-09-12: "test both", then "Copilot and Codex only once
    # a week"). Decision 10's second part, measured weekly until the gate is green.
    { os = "macos-latest",   host = "codex",   python = "3.13" },
    { os = "windows-latest", host = "codex",   python = "3.13" },
]
