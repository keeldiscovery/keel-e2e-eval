# The matrix, as data (specs 020-matrix-workflow and 021-short-journey; keel-cloud
# `canon/designs/e2e-matrix-design.md` §5). This file is the ONLY place the cells are written down:
# `.github/workflows/matrix.yml`'s `select` job reads it, `make matrix-check` reads it, and
# `tests/test_matrix_cells.py` holds it to the six coverage rules. A founder who wants a different
# set edits this file and nothing else -- decision 4's "[overrulable]" is one line here, and spec
# 021 is that overrule having been used.
#
# THE PYTHON AXIS HAS THREE VALUES AND THE DESIGN'S §5.1 NAMES TWO. That is reconciled here rather
# than quietly: §5.2 and §10 both count eighteen weekly cells and six nightly ones, and 3 OS x 2
# hosts x 2 Pythons is twelve and four. Eighteen is 3 x 2 x **3**, §10's per-OS split for the weekly
# set is "6 / 6 / 6" (two hosts x three Pythons), and the design's own picker sample in §4.3 reads
# `ubuntu · copilot · py3.12`. So the axis is the floor (3.9, spec 004's promise), the current
# (3.13, what brew/winget hand out) and 3.12 -- what Ubuntu 24.04 ships as its system Python and
# what this harness itself runs on. (Spec 021 has since moved which of the three each set spends:
# see the next paragraph. The axis itself did not move.)
#
# THE FOUNDER CHANGED THE SETS AGAIN ON 2026-09-13 (design §15): "we cannot afford to do a
# nightly run; we can only afford a weekly run. Suspend the nightly from today, only the weekly;
# and the weekly I want to test the entire matrix -- Copilot, Codex and Claude -- against Windows
# and Mac. Suspend Ubuntu; this is the only way we can reduce cost." So:
#
#   - `nightly` is EMPTY. Its name stays (a hand `inputs[set]=nightly` selects nothing and says
#     so) and its cron is gone from the workflow. Everything it carried -- the floor, the corpus
#     riders, the Spec Kit cell, "bought short on a merge, bought whole soon after" -- is the
#     weekly's now, once a week rather than once a night.
#   - `weekly` is the product of TWO operating systems x THREE hosts x THREE Pythons, eighteen
#     cells, every one whole. Ubuntu is `os_suspended`: still a name the axis knows (a future
#     cell naming it validates), owed by no set and present in none.
#   - Codex is a measured host (keel-cloud CANON.md waiver W-042-1, 2026-09-13): it left
#     `host_unmeasured` for `host`, so the weekly product owes it on every Python like the others.
#   - `per_change` is untouched: two Claude cells, short, about two model calls each. It is the
#     one remaining every-merge spend; suspending it is emptying that list.
#
# THE SETS BEFORE THAT WERE SPEC 021's, NOT §5.2's, AND THE FOUNDER CHANGED THEM ON 2026-09-11.
# Three decisions, each one a line below, kept here because they still explain per_change:
#
#   1. A qualifying change buys the SHORT journey on four cells -- the host leg entire (the plugin
#      from the marketplace into a fresh host home, "keel connect", device approval, the runtime on
#      the host's executor) plus the FIRST model job, the PROBLEM frame's confirmation card, and
#      then the way out. That is the part that breaks when an OS, a Python or a host CLI moves.
#      The whole journey is about thirteen premium requests a cell; the short one is two.
#   2. UBUNTU LEAVES per_change AND nightly -- "fewer than 5% of founders" -- and stayed in the
#      weekly eighteen, whole, until 2026-09-13 suspended it everywhere.
#   3. The FLOOR (3.9) moves from per_change to nightly, on Windows, both hosts. spec 004's floor
#      is still a promise; since 2026-09-13 the weekly product is where it is kept.
#
# `legs` is the new per-cell field. It is optional and defaults to `full`, so a cell written
# before today means what it meant, and the workflow exports it as KEEL_JOURNEY_LEGS.
#
# A cell's Python is the runtime's, not the harness's: it is what `python3` resolves to when the
# host CLI runs the skill's script, which is what the bundled runtime is then executed by (spec 003
# of the skill, and what `make acceptance`'s Debian 11 bed proves locally). The harness itself
# needs 3.11+ (tomllib) and the workflow gives it its own interpreter, so a 3.9 cell is a 3.9
# measurement of the thing under test and never of the referee.

[axes]
# The runner labels, verbatim: a cell's `os` IS its `runs-on`.
os = ["ubuntu-24.04", "macos-latest", "windows-latest"]
# An operating system the axis still knows but no set owes or names (the founder, 2026-09-13:
# "suspend Ubuntu -- I don't think anyone worth their salt is using Ubuntu as their OS"). The
# product the weekly set must be is the axis minus this list; a cell naming a suspended OS is
# refused in every set. Reinstating it is deleting it from this line.
os_suspended = ["ubuntu-24.04"]
# The measured hosts: each has passed keel-skill-design §5.5's four-part gate (Codex on
# 2026-09-13, keel-cloud CANON.md waiver W-042-1), and the weekly product owes every one of them
# on every Python. Codex's cells bill OpenAI API tokens against KEEL_RUNTIME_CI_CODEX.
host = ["claude", "copilot", "codex"]
# A host the matrix may buy but does not owe (keel-runtime spec 008): runs, gate not yet green.
# Allowed in the weekly set, never in per_change, not part of the product. Empty since Codex
# joined `host`; the mechanism stays for the next host.
host_unmeasured = []
# The hosts a merge pays for (the founder, 2026-09-12: "Claude Code is the one we want to run
# daily; Copilot and Codex only once a week" -- and since 2026-09-13 nothing runs daily at all).
# A measured host not named here is bought weekly, whole, and nowhere else.
host_everyday = ["claude"]
python = ["3.9", "3.12", "3.13"]

[scenarios]
# What a cell runs when it does not say otherwise: S-012, the founder's journey through the cell's
# host (spec 019). §5.1: "the scenario each cell runs is S-001, the founder's journey, through the
# host ... S-012 becomes the Copilot instance of it".
default = ["s012"]
# Which of them are `-m live` -- a real model, real money, `make eval-live`. Everything else is
# `make eval`, deterministic and free. The workflow splits a cell's list on this, which is how the
# weekly's corpus cell (S-005/6/7, decision 11: "they cost nothing but minutes") rides on a cell
# that is already paid for.
live = ["s004", "s012"]

# ------------------------------------------------------------------------------------- the sets

[sets]

# Every qualifying change (spec 021; two cells since 2026-09-12): macOS and Windows, Claude Code,
# the current Python, the SHORT journey. These are the two operating systems founders install
# the plugin on and the Python brew and winget hand them; the floor is bought weekly instead.
# The one remaining every-merge spend (2026-09-13): about two model calls a cell.
#
# Nothing here overrides `scenarios`: the cheap set runs S-012 and only S-012, which is what
# `coverage_problems` holds it to.
per_change = [
    # 2026-09-12: two cells, not four -- Copilot moved to the weekly set with Codex.
    { os = "macos-latest",   host = "claude",  python = "3.13", legs = "short" },
    { os = "windows-latest", host = "claude",  python = "3.13", legs = "short" },
]

# Nightly: SUSPENDED (the founder, 2026-09-13: "we cannot afford to do a nightly run; only the
# weekly"). The set stays named so `inputs[set]=nightly` by hand still resolves -- to nothing,
# and `python -m matrix --set nightly` prints `(0 cells)` -- and its 03:00 cron is gone from
# `.github/workflows/matrix.yml`. What it carried (the two per_change cells whole, the 3.9 floor
# on Windows, the corpus riders on macOS x Claude, the Spec Kit cell) is in `weekly` below.
# Reinstating a night is putting cells back here and the cron back in the workflow -- and
# `coverage_problems` will then ask, again, that what a merge buys short the night buys whole.
nightly = []

# Weekly, Sunday 04:00 UTC (design §15, 2026-09-13; EIGHTEEN cells): the full product of the
# axes minus the suspended OS -- macOS and Windows x Claude Code, Copilot and Codex x the three
# Pythons -- every one of them the whole journey. "Test the entire matrix against Windows and
# Mac." `tests/test_matrix_cells.py` asserts this set IS the product rather than trusting the
# list below to stay complete.
#
# The corpus scenarios ride on ONE cell, macOS x Claude x 3.13 (decision 11): S-005/6/7 and S-013
# drive the product's own judgement through the real screens against the frozen corpus, call no
# model at all, and cost this set nothing but the minutes of a cell already running. They need
# keel-cloud's corpus directory, which the cell job checks out beside the two public siblings.
# The Spec Kit cell (spec 022) rides here too: the same journey with the skill reaching Claude
# through the Spec Kit extension, short, once a week.
weekly = [
    { os = "macos-latest",   host = "claude",  python = "3.9" },
    { os = "macos-latest",   host = "claude",  python = "3.12" },
    { os = "macos-latest",   host = "claude",  python = "3.13", scenarios = ["s012", "s005", "s006", "s007", "s013"] },
    { os = "macos-latest",   host = "claude",  python = "3.13", legs = "short", install = "speckit" },
    { os = "macos-latest",   host = "copilot", python = "3.9" },
    { os = "macos-latest",   host = "copilot", python = "3.12" },
    { os = "macos-latest",   host = "copilot", python = "3.13" },
    { os = "macos-latest",   host = "codex",   python = "3.9" },
    { os = "macos-latest",   host = "codex",   python = "3.12" },
    { os = "macos-latest",   host = "codex",   python = "3.13" },
    { os = "windows-latest", host = "claude",  python = "3.9" },
    { os = "windows-latest", host = "claude",  python = "3.12" },
    { os = "windows-latest", host = "claude",  python = "3.13" },
    { os = "windows-latest", host = "copilot", python = "3.9" },
    { os = "windows-latest", host = "copilot", python = "3.12" },
    { os = "windows-latest", host = "copilot", python = "3.13" },
    { os = "windows-latest", host = "codex",   python = "3.9" },
    { os = "windows-latest", host = "codex",   python = "3.12" },
    { os = "windows-latest", host = "codex",   python = "3.13" },
]
