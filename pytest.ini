[pytest]
markers =
    live: calls a real model and costs money; opt-in through `make eval-live`, never in `make eval`
    bundle(slug): names this scenario's run bundle directory, where the test's own name cannot --
        S-012's is `s012-journey-<host>` and the host comes from `KEEL_JOURNEY_HOST` (spec 019)
    remote: one of the journeys the coordinator runs on the staging twin (`make remote`, spec 130): the remote six
        (S-005, S-006, S-007, S-014, S-015, S-016) and the three sharing journeys (S-018, S-019, S-020)
