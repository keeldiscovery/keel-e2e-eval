[pytest]
markers =
    shaping: Layer 2 of the shaping gauntlet (specs/shaping-eval-design.md) -- a real `claude`
        CLI agent, LLM in the loop, real API spend. Opt-in only: excluded from `pytest evals`'s
        default run (this file's own `addopts`) so `make eval`/`make eval-all` never collect it;
        `make eval-shaping` re-includes it explicitly with `-m shaping`.
# Default addopts deselects the `shaping` marker -- bare `pytest evals`/`pytest evals -q` (what
# `make eval`, `make eval K=<slug>`, and `harness/eval_all.py`'s `make eval-all` all run) never
# runs evals/test_shaping_gauntlet.py. `make eval-shaping`'s own `-m shaping` on the command line
# overrides this (pytest merges addopts + CLI args in order; the last `-m` wins).
addopts = -m "not shaping"
