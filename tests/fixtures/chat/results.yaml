# Hand-written model answers for the chat marks: each `pass` satisfies every clause of the mark it is under, each
# `fail` breaks exactly the one named. Keyed by a short name; `case` says which corpus row they answer.
payroll_current_ok:       # follow-up expected; the model asked once, then completed on the hours
  proposal: {kind: TIME, unit: hours, occasion: payroll run,
             question: "On your last payroll that's been paid and settled, about how long did checking it take?",
             none_label: We don't check it}
  belief_draft: Checking takes a payroll practitioner a number of hours each payroll run.
  kept_verbatim: [they still miss some]
payroll_current_two_kinds:
  proposal: {kind: [TIME, ERRORS], unit: hours, question: "How long did checking take, and what did it miss?"}
  belief_draft: Checking takes hours and misses errors.
  kept_verbatim: []
payroll_current_errors:
  proposal: {kind: ERRORS, question: "What mistake did checking still miss on your last payroll run?"}
  belief_draft: Checking misses errors.
  kept_verbatim: []
payroll_current_money:
  proposal: {kind: MONEY, unit: money, question: "What did checking cost on your last payroll run?"}
  belief_draft: Checking costs money.
  kept_verbatim: []
