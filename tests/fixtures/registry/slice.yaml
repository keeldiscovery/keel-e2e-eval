# A hand-sized registry fixture (spec 040 T002, at keel-cloud 087's export, keel-cloud-docs 7b151f9; registry
# VERSION 4): the 13 keys of the exported dimension-registry.json ({window}/{window_unit}/{cost_period} placeholders
# kept) with every founder.* (saves on the seven lists), respondent.* (one escape, the fixed answers, supports,
# conditional), answers.* (less the drift templates), order, the entry-level b2b_only (Purchase friction) and
# respondent.b2b_link_only (Ability to pay); the lullaby worked objects, the checks block and the common prose dropped.
# No weight anywhere (D3: all thirteen decide). Passes all eight invariants. Not a corpus entry. Spec 086 (keel-cloud
# 152, keel-cloud-docs 21395ab0): the five moved belief templates in 152's words -- Relative advantage's now carries
# {value} once, as invariant 4 reads every template since 152 -- nothing else re-exported.
version: 4
common:
  left_out:
    ask_respondent: false
    status: LEFT_OUT
    note: You weren't sure, so this was left out of the study. The brief says it is untested.
  floor:
    default: 5
    unit: anchored people
    note: Today's FLOOR = 5; fewer anchored people is Too few to call whatever they say. Never per belief.
dimensions:
- key: problem.prevalence
  vector: PROBLEM
  order: 1
  name: Prevalence
  meaning: How much of the target segment experiences the problem within a defined period.
  founder:
    control: single_choice
    guidance: Out of 10 people in the segment, how many had this at least once in {window}. The window is the project's recall
      window (the gate's window); the bins are contiguous fifths of the segment.
    normalized:
      kind: proportion_bin
      window: '{window}'
      codes:
      - p_0_20
      - p_20_40
      - p_40_60
      - p_60_80
      - p_80_100
    option_rule: 'Exactly 5 options, contiguous: fewer than 2 in 10 · 2 to 4 · 4 to 6 · 6 to 8 · 8 to 10. No gaps. Each option
      carries its own belief phrase (only a few · a minority · around half · most · nearly all); never the label.'
    belief_template: '{value} of these {actor_plural} had this at least once in {window}.'
    unsure_allowed: false
  respondent:
    part: 1
    anchor: that_night
    control: gate_yes_no
    guidance: 'This item IS the gate: "In {window}, did [the circumstance] happen to you?" Yes / No. Explicit, never inferred
      from the story. No → graceful exit; the person still counts in the denominator. Yes → the story prompt (the anchor test),
      then the rest of Part 1. Never names the idea, the app or the mechanism.'
    option_rule: Yes · No. Code renders the options; the model writes the event clause only.
    escape: null
  answers:
    shape: choice
    compare_rule: proportion_from_gate
    supporting_side: more
    floor: 5
  left_out:
    ask_respondent: false
    status: LEFT_OUT
    note: 'Unreachable: ''I''m not sure'' is not offered on the gate.'
- key: problem.frequency
  vector: PROBLEM
  order: 2
  name: Frequency
  meaning: How often an affected person experiences the problem.
  founder:
    control: numeric_interval
    guidance: 'On how many {window_unit} an affected person faces it: a range on an axis from 0 to the window''s length, whole
      units.'
    normalized:
      kind: interval
      unit_options:
      - '{window_unit}'
      default_unit: '{window_unit}'
      axis_max: 7
      axis_step: 1
      extend_by: 0
      bins:
      - 0
      - 1
      - 2
      - 3
      - 4
      - 5
      - 6
      - 7
    option_rule: 'No options: a two-handle range from 0 to the window''s length. Belief value = the range with its unit (''4
      to 7 {window_unit}'').'
    belief_template: '{actor_plural} face this on {value}.'
    unsure_allowed: true
  respondent:
    part: 1
    anchor: that_night
    control: segmented_0_to_7
    guidance: Count how many {window_unit} it happened on, not how many times it happened. Never shows the founder's range.
    option_rule: A segmented control from 0 to the window's count when the count is at most 7; a number in {window_unit} for
      a longer window. Code renders the options and the question.
    escape:
      code: cant_recall
      label: I can't recall
      counts: apart
  answers:
    shape: interval
    compare_rule: interval_contains_median
    supporting_side: more
    floor: 5
  left_out:
    ask_respondent: false
    status: LEFT_OUT
    note: You weren't sure, so this was left out of the study. The brief says it is untested.
- key: problem.importance
  vector: PROBLEM
  order: 3
  name: Importance
  meaning: How much the actor cares about improving this problem relative to other competing problems.
  founder:
    control: rival_list
    guidance: 'What else is hard for {actor_plural} when {circumstance}: the founder''s Answer becomes four rival difficulties
      beside the problem''s own (locked, first); the founder edits the rivals. Keel''s bar is fixed: the problem is one of
      their two, out of five.'
    normalized:
      kind: saved_list
    option_rule: The own item and exactly four rivals, each at most 9 words, difficulties of the same circumstance in the
      same register; no number the founder did not write; never a fix or a product.
    belief_template: Of these {list_size}, {value} is one of the two that {actor_plural} would most like made easier when
      {circumstance}.
    unsure_allowed: true
    saves:
      min_items: 5
      max_items: 5
      max_words: 9
      picked: false
      own_first: true
  respondent:
    part: 1
    anchor: that_night
    control: pick_two
    guidance: '''Thinking about that last {occasion}, which two of these would you most like made easier?'' Your difficulty
      and your four, shuffled per study, yours never first. Never names the idea.'
    option_rule: The founder's five (own item + four rivals), own never first; pick exactly two. Escape 'None of these' counts
      against.
    escape:
      code: none_of_these
      label: None of these
      counts: against
  answers:
    shape: choice
    compare_rule: share_in_picks
    floor: 5
  left_out:
    ask_respondent: false
    status: LEFT_OUT
    note: You weren't sure, so this was left out of the study. The brief says it is untested.
- key: problem.current_solution_satisfaction
  vector: PROBLEM
  order: 4
  name: Current solution
  meaning: How adequately the actor's current method or alternative solves the job.
  founder:
    control: scale_lines
    guidance: 'How they deal with it today: the founder''s Answer becomes a second-person phrase for today''s way and five
      outcomes from works well to fails, the line after 2; the founder rewords them, order and line fixed.'
    normalized:
      kind: saved_list
    option_rule: A second-person phrase ('your way of checking for errors') and exactly five outcomes, best to worst, each
      at most 9 words, parallel in form.
    belief_template: For most {actor_plural}, {value} still falls short.
    unsure_allowed: true
    saves:
      min_items: 5
      max_items: 5
      max_words: 9
      picked: false
      phrase: true
  respondent:
    part: 1
    anchor: that_night
    control: single_choice_5
    guidance: '''Think of the last {occasion}. How well did'' today''s way, in your words, ''work?'' Your five outcomes, in
      order. Never names the idea.'
    option_rule: The founder's five outcomes, in order. Escape 'Someone else does the checking', apart.
    escape:
      code: someone_else_checks
      label: Someone else does the checking
      counts: apart
  answers:
    shape: choice
    compare_rule: below_line
    floor: 5
  left_out:
    ask_respondent: false
    status: LEFT_OUT
    note: You weren't sure, so this was left out of the study. The brief says it is untested.
- key: solution.compatibility
  vector: SOLUTION
  order: 1
  name: Compatibility
  meaning: How well the proposed approach fits the actor's existing workflow, values, routines, and context.
  founder:
    control: item_list
    guidance: 'How it fits the way they work today: the founder''s Answer becomes 2 to 4 conditions it must meet, each with
      the stranger''s question clause; the founder edits them and picks the one to test.'
    normalized:
      kind: saved_list
    option_rule: 2 to 4 conditions, each at most 9 words (third person) with its `asked` clause (second person, at most 20
      words, no question mark); no number the founder did not write.
    belief_template: For most, {value}.
    unsure_allowed: true
    saves:
      min_items: 2
      max_items: 4
      max_words: 9
      picked: true
      asked: true
  respondent:
    part: 2
    anchor: the_reveal
    control: fixed_four
    guidance: '''On your last {occasion},'' the condition you picked, asked as a question: would you have been able to? Yes,
      easily · Yes, with some steps · Only with help or approval · No.'
    option_rule: The registry's fixed four, in order. Escape 'I can't tell', apart.
    escape:
      code: cant_tell
      label: I can't tell
      counts: apart
    fixed_answers:
    - code: yes_easily
      label: Yes, easily
    - code: yes_with_steps
      label: Yes, with some steps
    - code: only_with_help
      label: Only with help or approval
    - code: 'no'
      label: 'No'
    supports:
    - yes_easily
    - yes_with_steps
  answers:
    shape: choice
    compare_rule: fixed_last_two_against
    floor: 5
  left_out:
    ask_respondent: false
    status: LEFT_OUT
    note: You weren't sure, so this was left out of the study. The brief says it is untested.
- key: solution.relative_advantage
  vector: SOLUTION
  order: 2
  name: Relative advantage
  meaning: The improvement the user expects over the current alternative before the new solution is worth changing behavior
    for.
  founder:
    control: benefit_list
    guidance: 'What it does better than the way they do it today: the founder''s Answer becomes one to four benefits, all
      equal.'
    normalized:
      kind: saved_list
    option_rule: 1 to 4 benefits, each at most 9 words, a noun phrase naming the improvement; no number the founder did not
      write.
    belief_template: For most, it would have {value} on their last {occasion}.
    unsure_allowed: true
    saves:
      min_items: 1
      max_items: 4
      max_words: 9
      picked: false
  respondent:
    part: 2
    anchor: the_reveal
    control: benefit_with_advantages
    guidance: '''Thinking of your last {occasion}, would'' your idea, by its short name, ''have made things better for you,
      or not?'' Those who say better tick which of your benefits would have been better.'
    option_rule: '''It would have made things better'' · ''No difference'' · ''It would have made things worse''; under the
      first, your benefits in your words. Escape ''I can''t tell'', apart.'
    escape:
      code: cant_tell
      label: I can't tell
      counts: apart
  answers:
    shape: choice
    compare_rule: benefit_first
    floor: 5
  left_out:
    ask_respondent: false
    status: LEFT_OUT
    note: You weren't sure, so this was left out of the study. The brief says it is untested.
- key: solution.adoption_friction
  vector: SOLUTION
  order: 3
  name: Adoption friction
  meaning: The additional effort, behavior change, setup, learning, or interruption required to use the solution.
  founder:
    control: item_list
    guidance: 'What they will have to do to start using it: the founder''s Answer becomes 1 to 4 efforts, each with the stranger''s
      clause; Keel keeps the founder''s numbers and adds none; the founder picks the one to test.'
    normalized:
      kind: saved_list
    option_rule: 1 to 4 efforts, each at most 9 words, a base-form verb phrase, with its `asked` clause (second person, at
      most 20 words, no question mark); only the founder's numbers.
    belief_template: Most would {value}.
    unsure_allowed: true
    saves:
      min_items: 1
      max_items: 4
      max_words: 9
      picked: true
      asked: true
  respondent:
    part: 2
    anchor: the_reveal
    control: fixed_four
    guidance: The effort you picked, said to them, then 'Would you do that, or not?' Yes · Yes, if it was clearly worth it
      · Probably not · No.
    option_rule: The registry's fixed four, in order; 'Yes, if it was clearly worth it' supports and is shown apart. Escape
      'I can't tell', apart.
    escape:
      code: cant_tell
      label: I can't tell
      counts: apart
    fixed_answers:
    - code: 'yes'
      label: 'Yes'
    - code: yes_if_worth_it
      label: Yes, if it was clearly worth it
    - code: probably_not
      label: Probably not
    - code: 'no'
      label: 'No'
    supports:
    - 'yes'
    - yes_if_worth_it
    conditional: yes_if_worth_it
  answers:
    shape: choice
    compare_rule: fixed_last_two_against
    floor: 5
  left_out:
    ask_respondent: false
    status: LEFT_OUT
    note: You weren't sure, so this was left out of the study. The brief says it is untested.
- key: commercial.existing_sacrifice
  vector: COMMERCIAL
  order: 1
  name: Existing sacrifice
  meaning: 'Resources already given up because of the problem: money, time, effort, inconvenience, risk, or foregone alternatives.'
  founder:
    control: cost_estimate
    guidance: 'What the founder believes the problem costs the payer today, entered on the commercial step and rendered by
      code: on a B2B study a fixed amount or hours at the project''s one hourly rate, on B2C an amount only (a person''s own
      time is never priced), over a period the founder picks (a day, a week, a month, a quarter, a year). Code writes the
      question and the belief sentence. The model writes no question text, no options and no money here.'
    normalized:
      kind: cost
      modes:
      - AMOUNT
      - HOURS
      periods:
      - day
      - week
      - month
      - quarter
      - year
    option_rule: 'No options: a range in the market''s currency (low above 0), or on a B2B study a range of hours and the
      hourly rate, and a period. ''I''m not sure'' leaves it out.'
    belief_template: The problem already costs the payer {value}.
    unsure_allowed: true
  respondent:
    part: 3
    anchor: last_purchase
    control: cost_total
    guidance: 'One total, all code''s: what it cost them over {cost_period} when {circumstance} -- an amount in the market
      currency or a number of hours (AMOUNT | HOURS), one number; ''nothing'' is 0 (D8). The respondent never sees or enters
      a rate. The model writes nothing for this item: its key alone.'
    option_rule: No options. Escape 'I can't recall', apart; 'nothing' is the number 0.
    escape:
      code: cant_recall
      label: I can't recall
      counts: apart
    b2b:
      anchor: last_cycle
      guidance: 'One total, all code''s: what it cost the team over {cost_period} when {circumstance} -- an amount or a number
        of the team''s hours (priced at the project''s rate by code, never shown). The decision-maker sees no context card
        and nothing of what the specialists said.'
      option_rule: No options; the same escape.
  answers:
    shape: interval
    compare_rule: interval_contains_median
    supporting_side: costs_more
    floor: 5
  left_out:
    ask_respondent: false
    status: LEFT_OUT
    note: You weren't sure, so this was left out of the study. The brief says it is untested.
- key: commercial.price
  vector: COMMERCIAL
  order: 2
  name: Price
  meaning: What the payer would give for the offer, read against what the problem already costs them.
  founder:
    control: price_range
    guidance: 'The price the founder has in mind, as a range in the market''s currency over the cost estimate''s own period
      (fixed; a one-off is priced against a year), entered on the commercial step and rendered by code beside the founder''s
      cost estimate. The model writes no question text and no money for this entry: code asks ''What price do you have in
      mind for {offer_name}?''.'
    normalized:
      kind: price_range
      periods:
      - day
      - week
      - month
      - quarter
      - year
    option_rule: 'No options: two numbers in the market''s currency (low at least 1, under 10,000) over the cost estimate''s
      period. ''No price yet'' is the not-sure chip: Price is left out.'
    belief_template: The payer would think it worth {value}.
    unsure_allowed: true
  respondent:
    part: 3
    anchor: last_purchase
    control: price_ladder
    guidance: 'Asked of whoever pays. Code writes the question -- ''What would {offer_name} be worth to you {period}?'', the
      founder''s period -- the anchor line from the respondent''s own Existing sacrifice total, and the options: five consecutive
      bands of the currency''s fixed 1-2-5 ladder that put the founder''s band in the middle three, plus ''I wouldn''t pay
      for this''. The model writes nothing for this item and never shows the founder''s range.'
    option_rule: Five bands of the ladder 1 · 2 · 5 · 10 · 20 · 50 · 100 · 250 · 500 · 1,000 · 2,500 · 5,000 · 10,000 in the
      market's currency, the founder's band in the middle three, + 'I wouldn't pay for this' (six, the one ladder read in
      two steps when spoken). Escape 'I can't say', apart.
    escape:
      code: cant_say
      label: I can't say
      counts: apart
    b2b:
      anchor: last_purchase
      guidance: 'The same item on the decision-maker''s link: the anchor line names money and hours (hours are the team''s
        time); the question and the bands are code''s.'
      option_rule: The five bands + 'I wouldn't pay for this'.
  answers:
    shape: choice
    compare_rule: ordinal_band
    supporting_side: higher
    floor: 5
  left_out:
    ask_respondent: false
    status: LEFT_OUT
    note: You weren't sure, so this was left out of the study. The brief says it is untested.
- key: commercial.ability_to_pay
  vector: COMMERCIAL
  order: 3
  name: Ability to pay
  meaning: Whether the buyer has accessible personal or organizational budget at the relevant price level.
  founder:
    control: derived
    guidance: 'Never asked of the founder: derived by code from the founder''s cost estimate and price, over the same period
      -- the price as a share of the cost (price low / cost high to price high / cost low, whole percent) and one sentence
      by band. No question from code or model.'
    normalized:
      kind: price_cost_ratio
      from:
      - commercial.existing_sacrifice
      - commercial.price
      bands:
      - 50
      - 100
    option_rule: 'No options and no answer: written by code whenever the cost estimate and the price are both stated; left
      out when either is.'
    belief_template: Your price is {value}.
    unsure_allowed: true
  respondent:
    part: 3
    anchor: last_purchase
    control: single_choice
    b2b_link_only: true
    guidance: 'Asked on the decision-maker''s link only, as supporting context: ''Think of the last tool your team paid for.
      Where did the money come from?'' Four budget sources, easiest to hardest; its first sentence is the part''s one anchor.'
    option_rule: The registry's four budget sources, in order. Escape 'I can't recall one', apart (it covers 'it was free').
    escape:
      code: cant_recall_one
      label: I can't recall one
      counts: apart
    fixed_answers:
    - code: existing_line
      label: A budget line we already had
    - code: new_line_signed_off
      label: A new budget line someone signed off
    - code: taken_from_other_spend
      label: Taken from other spending
    - code: no_budget
      label: There was no budget for it
    b2b:
      anchor: last_purchase
      guidance: '''Think of the last tool your team paid for. Where did the money come from?'' Four budget sources, easiest
        to hardest; its first sentence is the part''s one anchor.'
      option_rule: The registry's four budget sources, in order.
  answers:
    shape: choice
    compare_rule: cost_covers_price
    supporting_side: more_covering
    floor: 5
  left_out:
    ask_respondent: false
    status: LEFT_OUT
    note: You weren't sure, so this was left out of the study. The brief says it is untested.
- key: commercial.buyer_payer_alignment
  vector: COMMERCIAL
  order: 4
  name: Buyer and payer
  meaning: Whether the user, beneficiary, decision maker, approver, and payer are the same person or a workable chain.
  founder:
    control: role_list
    guidance: 'Besides the decider, who has to agree before they can buy: ''Nobody'' is an answer. The roles are only those
      the founder named (Keel adds none), each at most 4 words; the founder picks the one to test, or Nobody else.'
    normalized:
      kind: saved_list
    option_rule: '''Nobody else'' first (fixed), then at most two roles the founder named, each at most 4 words.'
    belief_template: '{decider} decides, and {value} has to agree.'
    unsure_allowed: true
    saves:
      min_items: 1
      max_items: 3
      max_words: 4
      picked: true
      fixed_first:
        code: nobody_else
        label: Nobody else
  respondent:
    part: 3
    anchor: last_purchase
    control: fixed_four
    guidance: '''For that tool, did'' the role you picked ''have to agree before it went through?'' (''did anyone else have
      to agree'' when you picked Nobody else; on a study where the user pays, ''Did ... have to agree before you paid for
      it?''). The fixed four.'
    option_rule: The registry's fixed four, in order. Escape 'I can't recall one', apart.
    escape:
      code: cant_recall_one
      label: I can't recall one
      counts: apart
    fixed_answers:
    - code: had_to_agree
      label: Yes, they had to agree
    - code: decided_alone
      label: No, I decided on my own
    - code: someone_else_agreed
      label: No, someone else had to agree
    - code: someone_else_decided
      label: Someone else decided, not me
    supports:
    - had_to_agree
    b2b:
      anchor: last_purchase
      guidance: 'For the last tool the team paid for: did the tested role have to agree before it went through; the fixed
        four.'
      option_rule: The registry's fixed four.
  answers:
    shape: choice
    compare_rule: first_supports
    floor: 5
  left_out:
    ask_respondent: false
    status: LEFT_OUT
    note: You weren't sure, so this was left out of the study. The brief says it is untested.
- key: commercial.purchase_friction
  vector: COMMERCIAL
  order: 5
  name: Purchase friction
  meaning: The approvals, procurement, account setup, switching, security, spouse/manager agreement, or other steps between
    interest and purchase.
  b2b_only: true
  founder:
    control: item_list
    guidance: 'What could slow down or stop a purchase: the founder''s Answer becomes 1 to 4 steps; Keel may add one, tagged
      suggested until Save; the founder picks the one to test.'
    normalized:
      kind: saved_list
    option_rule: 1 to 4 steps, each at most 9 words, a noun phrase (a security review, the finance director's sign-off); at
      most one suggested by Keel.
    belief_template: '{value} slows the purchase most.'
    unsure_allowed: true
    saves:
      min_items: 1
      max_items: 4
      max_words: 9
      picked: true
  respondent:
    part: 3
    anchor: last_purchase
    control: fixed_three
    guidance: '''For that tool, did it need'' the step you picked ''before it went through?'' The fixed three.'
    option_rule: The registry's fixed three, in order. Escape 'I can't recall', apart.
    escape:
      code: cant_recall
      label: I can't recall
      counts: apart
    fixed_answers:
    - code: yes_long
      label: Yes, and it took a long time
    - code: yes_quick
      label: Yes, but it was quick
    - code: not_needed
      label: No, it wasn't needed
    supports:
    - yes_quick
    - not_needed
    b2b:
      anchor: last_purchase
      guidance: 'For the last tool the team paid for: did it need the tested step before it went through; the fixed three.'
      option_rule: The registry's fixed three.
  answers:
    shape: choice
    compare_rule: caution_turned
    floor: 5
  left_out:
    ask_respondent: false
    status: LEFT_OUT
    note: You weren't sure, so this was left out of the study. The brief says it is untested.
- key: commercial.commitment
  vector: COMMERCIAL
  order: 6
  name: Commitment
  meaning: The meaningful actions the person is willing to take before purchase, such as time, installation, data access,
    referral, deposit, or trial participation.
  founder:
    control: one_step
    guidance: 'The first real step the founder wants them to take: the founder''s Answer becomes the step as strangers hear
      it, in base form, at most 9 words; a note when it is only a conversation.'
    normalized:
      kind: saved_list
    option_rule: Exactly one step, base form, at most 9 words; no number the founder did not write.
    belief_template: Most {actor_plural} would {value} now.
    unsure_allowed: true
    saves:
      min_items: 1
      max_items: 2  # keel-cloud 118 FR-1: the step and its smaller step (corpus revision 14)
      max_words: 9
      picked: false
  respondent:
    part: 3
    anchor: last_purchase
    control: fixed_four
    guidance: '''If it were ready today, would you'' take your first step, ''or not?'' The fixed four. No escape: ''No'' is
      the floor.'
    option_rule: The registry's fixed four, in order; 'Yes, after trying it first' supports and is shown apart.
    escape: null
    fixed_answers:
    - code: yes_start
      label: Yes, I'd start one
    - code: yes_after_trying
      label: Yes, after trying it first
    - code: probably_not
      label: Probably not
    - code: 'no'
      label: 'No'
    supports:
    - yes_start
    - yes_after_trying
    conditional: yes_after_trying
    b2b:
      anchor: last_cycle
      guidance: 'The same item on the decision-maker''s link: if it were ready today, would you take the founder''s step;
        the fixed four.'
      option_rule: The registry's fixed four.
  answers:
    shape: choice
    compare_rule: fixed_last_two_against
    floor: 5
  left_out:
    ask_respondent: false
    status: LEFT_OUT
    note: You weren't sure, so this was left out of the study. The brief says it is untested.
