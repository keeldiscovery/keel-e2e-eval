# A hand-sized registry fixture (spec 032 T003; thirteen by spec 031, cut at twelve by spec 030, first cut spec 029 T004): the 13 keys
# of keel-cloud 074's exported dimension-registry.json (5311217; {window}/{window_unit}/{cost_period} placeholders kept) with the
# Lullaby founder questions the register shows (Price, Existing sacrifice and Ability to pay have none: their questions are
# code's or absent), every founder.normalized, respondent.*, answers.* (less the drift templates), weight, order, the
# entry-level b2b_only (Purchase friction) and respondent.b2b_link_only (Ability to pay); prose notes, decisions and the worked
# lullaby objects dropped. Passes all eight invariants. Not a corpus entry.
version: 1
common:
  left_out:
    ask_respondent: false
    status: LEFT_OUT
    note: You weren't sure, so this was left out of the study. The brief says it is untested.
  chips:
    default:
    - I can't recall
    - I'd rather not say
    numeric_extra: That's a rough guess
  something_else:
    rule: Every closed respondent item whose belief is a SET (multi_choice, multi_choice_ladder, branch_pick_amounts' pick) and every single_choice built from a market-specific
      option set ends with "Something else". Fixed scales (single_choice_5, bands, 0-to-7, yes/no) do not. "Something else" is an observation placed OUTSIDE, kept
      verbatim, never a row of its own on the answers page (spec 050).
  floor:
    default: 5
    unit: anchored people
    note: Today's FLOOR = 5; fewer anchored people is Too few to call whatever they say. Never per belief.
dimensions:
- key: problem.prevalence
  vector: PROBLEM
  order: 1
  name: Prevalence
  meaning: How much of the target segment experiences the problem within a defined period.
  weight: DEAL_BREAKER
  founder:
    control: single_choice
    guidance: Out of 10 people in the segment, how many had this at least once in {window}. The window is the project's recall window (the gate's window); the bins
      are contiguous fifths of the segment.
    normalized:
      kind: proportion_bin
      window: '{window}'
      codes:
      - p_0_20
      - p_20_40
      - p_40_60
      - p_60_80
      - p_80_100
    option_rule: 'Exactly 5 options, contiguous: fewer than 2 in 10 · 2 to 4 · 4 to 6 · 6 to 8 · 8 to 10. No gaps (the smoke test''s 5-6 / 7-8 / 9-10 had holes).
      Each option carries its own belief phrase (only a few · a minority · around half · most · nearly all); never the label.'
    belief_template: '{value} of these {actor_plural} had this at least once in {window}.'
    unsure_allowed: false
  respondent:
    part: 1
    anchor: that_night
    control: gate_yes_no
    guidance: 'This item IS the gate: "In {window}, did [the circumstance] happen to you?" Yes / No. Explicit, never inferred from the story. No → graceful exit;
      the person still counts in the denominator. Yes → the story prompt (the anchor test), then the rest of Part 1. Never names the idea, the app or the mechanism.'
    option_rule: 'Yes · No. No distractors, no ''Something else''. Chips: none (a gate must be answered). Code renders the options; the model writes the question
      only.'
    chips: []
  answers:
    shape: choice
    compare_rule: proportion_from_gate
    status_vocabulary:
    - HOLDING_UP
    - NOT_HOLDING_UP
    - TOO_FEW_TO_CALL
    - NOT_ASKED_YET
    floor: 5
  lullaby:
    founder_question: Out of 10 parents of babies under six months, how many do you think had a night in the last 7 nights when the baby cried and they had to decide
      what to try?
- key: problem.frequency
  vector: PROBLEM
  order: 2
  name: Frequency
  meaning: How often an affected person experiences the problem.
  weight: SHAPES
  founder:
    control: numeric_interval
    guidance: 'On how many {window_unit} an affected person faces it: a range on an axis from 0 to the window''s length, whole units.'
    normalized:
      kind: interval
      unit_options:
      - '{window_unit}'
      default_unit: '{window_unit}'
      axis_max: 7
      axis_step: 1
      extend_by: 0
      bins:
      - 0
      - 1
      - 2
      - 3
      - 4
      - 5
      - 6
      - 7
    option_rule: 'No options: a two-handle range from 0 to the window''s length. Belief value = the range with its unit (''4 to 7 {window_unit}'').'
    belief_template: '{actor_plural} face this on {value}.'
    unsure_allowed: true
  respondent:
    part: 1
    anchor: that_night
    control: segmented_0_to_7
    guidance: Count how many {window_unit} it happened on, not how many times it happened. Never shows the founder's range.
    option_rule: A segmented control from 0 to the window's count, one tap, when the count is at most 7; a number in {window_unit} for a longer window. No 'Something
      else'. Code renders the options; the model writes the question only.
    chips:
    - I can't recall
    - I'd rather not say
    - That's a rough guess
  answers:
    shape: interval
    compare_rule: interval_contains_median
    status_vocabulary:
    - HOLDING_UP
    - NOT_HOLDING_UP
    - PEOPLE_DISAGREE
    - TOO_FEW_TO_CALL
    - NOT_ASKED_YET
    - LEFT_OUT
    floor: 5
  lullaby:
    founder_question: In a typical week, on how many nights out of 7 do you think a parent is woken by a cry and has to work out what the baby needs?
- key: problem.importance
  vector: PROBLEM
  order: 3
  name: Importance
  meaning: How much the actor cares about improving this problem relative to other competing problems.
  weight: DEAL_BREAKER
  founder:
    control: rank_pick
    guidance: 'Where this ranks among the actor''s difficulties in the circumstance: a rank band, not a rating. The model writes 4–6 distractor difficulties for the
      same circumstance; they are reused on the respondent side.'
    normalized:
      kind: rank_band
      codes:
      - biggest
      - top_three
      - middle
      - minor
      - negligible
    option_rule: Exactly 5 options in rank order mapped onto the codes; each with a belief phrase ('the biggest difficulty', 'one of the top three', ...).
    belief_template: Among the difficulties that come up when {circumstance}, this is {value}.
    unsure_allowed: true
  respondent:
    part: 1
    anchor: that_night
    control: single_choice
    guidance: 'A trade-off, not a rating: ''If you could make one part of [the circumstance] easier, which would it be?'' Closed pick (no text box). The problem''s
      own item sits among the model''s distractors, never first. Elicited in the respondent''s own terms; never names the idea.'
    option_rule: 5–6 difficulties for the circumstance including the problem's own, order shuffled per project with the problem's item never first, plus 'Something
      else'.
    chips:
    - I can't recall
    - I'd rather not say
  answers:
    shape: choice
    compare_rule: ordinal_band
    status_vocabulary:
    - HOLDING_UP
    - NOT_HOLDING_UP
    - PEOPLE_DISAGREE
    - TOO_FEW_TO_CALL
    - NOT_ASKED_YET
    - LEFT_OUT
    floor: 5
  lullaby:
    founder_question: Compared with the other things that make nights hard with a baby under six months, where do you think working out what the cry means ranks for
      the parent?
- key: problem.current_solution_satisfaction
  vector: PROBLEM
  order: 4
  name: Current solution
  meaning: How adequately the actor's current method or alternative solves the job.
  weight: DEAL_BREAKER
  founder:
    control: single_choice
    guidance: 'How well today''s way of handling it serves them: an ordered five-point scale written as outcomes, from works reliably to no reliable way.'
    normalized:
      kind: ordinal
      codes:
      - works_well
      - mostly_works
      - hit_and_miss
      - works_poorly
      - no_reliable_way
    option_rule: Exactly 5 options in order onto the codes; each a one-line outcome; each with a belief phrase.
    belief_template: The way {actor_plural} handle it today {value}.
    unsure_allowed: true
  respondent:
    part: 1
    anchor: that_night
    control: single_choice_5
    guidance: 'How well their own approach worked that night, not in general: five ordered outcomes from ''worked straight away'' to ''didn''t work at all''. Never
      names the idea.'
    option_rule: Fixed scale, 5 options, same order as the codes. No 'Something else'.
    chips:
    - I can't recall
    - I'd rather not say
  answers:
    shape: choice
    compare_rule: ordinal_band
    status_vocabulary:
    - HOLDING_UP
    - NOT_HOLDING_UP
    - PEOPLE_DISAGREE
    - TOO_FEW_TO_CALL
    - NOT_ASKED_YET
    - LEFT_OUT
    floor: 5
  lullaby:
    founder_question: Thinking about how parents work out what the baby needs today, how well do you think that way of doing it serves them?
- key: solution.compatibility
  vector: SOLUTION
  order: 1
  name: Compatibility
  meaning: How well the proposed approach fits the actor's existing workflow, values, routines, and context.
  weight: DEAL_BREAKER
  founder:
    control: single_choice
    guidance: 'At what point in the real episode the mechanism would be used: ordered positions in the sequence of attempts, ending with ''it would not fit''.'
    normalized:
      kind: ordinal
      codes:
      - before_any_attempt
      - after_first_attempt_fails
      - after_several_attempts
      - only_when_nothing_works
      - would_not_fit
    option_rule: Exactly 5 options in order onto the codes, worded for this mechanism's moment of use; each with a belief phrase.
    belief_template: It fits into the episode {value}.
    unsure_allowed: true
  respondent:
    part: 2
    anchor: the_reveal
    guidance: Thinking about that night, at what point, if any, could the mechanism's moment of use (from the reveal, e.g. 'hold the phone near the cot for ten seconds')
      have fitted. Options worded from the respondent's account's shape, never from the founder's pick.
    control: single_choice
    option_rule: Founder's codes + 'At no point that night' (= would_not_fit) + 'Something else'.
    chips:
    - I can't recall
    - I'd rather not say
  answers:
    shape: choice
    compare_rule: choice_majority
    status_vocabulary:
    - HOLDING_UP
    - NOT_HOLDING_UP
    - PEOPLE_DISAGREE
    - TOO_FEW_TO_CALL
    - NOT_ASKED_YET
    - LEFT_OUT
    floor: 5
  lullaby:
    founder_question: During a night-time crying episode, at what point would a parent most naturally hold the phone near the cot and let it listen?
- key: solution.relative_advantage
  vector: SOLUTION
  order: 2
  name: Relative advantage
  meaning: The improvement the user expects over the current alternative before the new solution is worth changing behavior for.
  weight: DEAL_BREAKER
  founder:
    control: single_choice
    guidance: The one thing that must be materially better than the current routine for people to switch.
    normalized:
      kind: categorical
      codes:
      - fewer_attempts
      - shorter_time
      - less_worry
      - less_help_needed
      - easier_recovery
    option_rule: Exactly 5 options onto the codes, worded for this circumstance; each with a belief phrase naming the improvement as a noun phrase.
    belief_template: To be worth switching to, it must mainly deliver {value}.
    unsure_allowed: true
  respondent:
    part: 2
    anchor: the_reveal
    control: single_choice
    guidance: 'If you had had that information that night, what, if anything, would have gone differently: one pick, including ''nothing would have changed''. Never
      the founder''s pick first.'
    option_rule: Founder's codes + 'Nothing would have changed' + 'Something else'.
    chips:
    - I can't recall
    - I'd rather not say
  answers:
    shape: choice
    compare_rule: choice_majority
    status_vocabulary:
    - HOLDING_UP
    - NOT_HOLDING_UP
    - PEOPLE_DISAGREE
    - TOO_FEW_TO_CALL
    - NOT_ASKED_YET
    - LEFT_OUT
    floor: 5
  lullaby:
    founder_question: Compared with how a parent copes today, what would have to be clearly better for them to prefer a suggestion from the app?
- key: solution.adoption_friction
  vector: SOLUTION
  order: 3
  name: Adoption friction
  meaning: The additional effort, behavior change, setup, learning, or interruption required to use the solution.
  weight: DEAL_BREAKER
  founder:
    control: single_choice
    guidance: 'The most extra effort a user would accept at the moment of use: an ordered effort ladder from nothing extra to a daytime setup.'
    normalized:
      kind: ordinal
      codes:
      - nothing_extra
      - one_tap
      - a_few_taps
      - setup_once
      - daytime_setup
    option_rule: Exactly 5 options in order onto the codes, worded for this mechanism's moment of use; each with a belief phrase.
    belief_template: The most extra effort they would accept at the moment of use is {value}.
    unsure_allowed: true
  respondent:
    part: 2
    anchor: the_reveal
    control: single_choice
    guidance: 'That night, with the phone where it was and your hands as they were, how much could you have managed before giving up on it: the same effort ladder,
      plus ''I wouldn''t have reached for the phone at all''.'
    option_rule: Founder's 5 rungs in order + 'I wouldn't have reached for the phone at all' (outside, no direction). No 'Something else'.
    chips:
    - I can't recall
    - I'd rather not say
  answers:
    shape: choice
    compare_rule: ordinal_band
    status_vocabulary:
    - HOLDING_UP
    - NOT_HOLDING_UP
    - PEOPLE_DISAGREE
    - TOO_FEW_TO_CALL
    - NOT_ASKED_YET
    - LEFT_OUT
    floor: 5
  lullaby:
    founder_question: At 3 a.m., how much extra effort would a parent put into getting the app listening before giving up on it?
- key: commercial.existing_sacrifice
  vector: COMMERCIAL
  order: 1
  name: Existing sacrifice
  meaning: 'Resources already given up because of the problem: money, time, effort, inconvenience, risk, or foregone alternatives.'
  weight: DEAL_BREAKER
  founder:
    control: cost_estimate
    guidance: 'What the founder believes the problem costs the payer today, entered on the commercial step and rendered by code: on a B2B study a fixed amount or
      hours at the project''s one hourly rate, on B2C an amount only (a person''s own time is never priced), over a period the founder picks (a day, a week, a month,
      a quarter, a year). Code writes the question and the belief sentence. The model writes no question text and no money here: only the kinds of cost the respondent
      will tick, each with its unit, and the respondent note.'
    normalized:
      kind: cost
      modes:
      - AMOUNT
      - HOURS
      periods:
      - day
      - week
      - month
      - quarter
      - year
      code_rule: 4–6 slug codes for the kinds of cost a respondent will tick in this market (e.g. apps_subscriptions, gadgets, paid_help, staff_hours, medical_visits),
        each option with a unit -- money (paid in the market's currency), hours (time spent) or count (incidents, times it happened) -- plus the fixed code none ('None
        of these; they cope with what they have'), which has no unit; ordered as presented. The kinds are the respondent's, never a founder belief.
    option_rule: 'No founder options: a range in the market''s currency (low above 0), or on a B2B study a range of hours and the hourly rate, and a period. The kinds
      of cost the model writes (4–6, each with its unit, no amount and no currency in any label) are what the respondent ticks; the founder does not tick them. ''I''m
      not sure'' leaves it out.'
    belief_template: The problem already costs the payer {value}.
    unsure_allowed: true
  respondent:
    part: 3
    anchor: last_purchase
    control: branch_pick_amounts
    guidance: 'Step 1: in {cost_period}, what did this cost you -- tick every kind (the calibration''s kinds + 2–3 distractors, each with its unit; ''Nothing'' and
      ''Something else'' code-appended). Step 2: one field per kind ticked, in that kind''s unit -- money in the market currency, hours, or a count -- rendered by
      code. The question names {cost_period} word for word; the model writes no amount.'
    option_rule: 'Pick: the calibration''s kinds verbatim + 2–3 distractors, each distractor with its unit (money | hours | count) + ''Nothing'' + ''Something else''
      (both code-appended); amounts: one per ticked kind, in its unit, code-rendered.'
    chips:
    - I can't recall
    - I'd rather not say
    - That's a rough guess
    b2b:
      anchor: last_cycle
      guidance: 'What {cost_period} of this problem actually cost the team: tick the kinds of cost, then one amount per kind in its unit (money, hours or a count).
        The question names {cost_period} word for word. The decision-maker sees no context card and nothing of what the specialists said.'
      option_rule: The calibration's kinds + 2–3 distractors (each with its unit) + 'Nothing' + 'Something else'; one amount per ticked kind, in its unit.
  answers:
    shape: interval
    compare_rule: interval_contains_median
    status_vocabulary:
    - HOLDING_UP
    - NOT_HOLDING_UP
    - PEOPLE_DISAGREE
    - TOO_FEW_TO_CALL
    - NOT_ASKED_YET
    - LEFT_OUT
    floor: 5
  lullaby:
    founder_question: What does it cost parents of babies under six months today when the baby cries in the night?
- key: commercial.price
  vector: COMMERCIAL
  order: 2
  name: Price
  meaning: What the payer would give for the offer, read against what the problem already costs them.
  weight: SHAPES
  founder:
    control: price_range
    guidance: 'The price the founder has in mind, as a range in the market''s currency over the cost estimate''s own period (fixed; a one-off is priced against a
      year), entered on the commercial step and rendered by code beside the founder''s cost estimate. The model writes no question text and no money for this entry:
      code asks ''What price do you have in mind for {offer_name}?''.'
    normalized:
      kind: price_range
      periods:
      - day
      - week
      - month
      - quarter
      - year
    option_rule: 'No options: two numbers in the market''s currency (low at least 1, under 10,000) over the cost estimate''s period. ''No price yet'' is the not-sure
      chip: Price is left out.'
    belief_template: The payer would think it worth {value}.
    unsure_allowed: true
  respondent:
    part: 3
    anchor: last_purchase
    control: price_ladder
    guidance: 'Asked of whoever pays. Code writes the question -- ''What would {offer_name} be worth to you {period}?'', the founder''s period -- the anchor line
      from the respondent''s own Existing sacrifice amounts (money, plus hours on a B2B study; never counts; left out when there is none), and the options: five consecutive
      bands of the currency''s fixed 1-2-5 ladder that put the founder''s band in the middle three, plus ''I wouldn''t pay for this''. The model writes nothing for
      this item and never shows the founder''s range.'
    option_rule: 'Code''s: five bands of the ladder 1 · 2 · 5 · 10 · 20 · 50 · 100 · 250 · 500 · 1,000 · 2,500 · 5,000 · 10,000 in the market''s currency, the founder''s
      band in the middle three, + ''I wouldn''t pay for this'' (outside, lower). No ''Something else''.'
    chips:
    - I can't say
    - I'd rather not say
    b2b:
      anchor: last_purchase
      guidance: 'The same item on the decision-maker''s link: the anchor line names money and hours (hours are the team''s time); the question and the bands are code''s.'
      option_rule: 'Code''s: the five bands + ''I wouldn''t pay for this''.'
  answers:
    shape: choice
    compare_rule: ordinal_band
    status_vocabulary:
    - HOLDING_UP
    - NOT_HOLDING_UP
    - PEOPLE_DISAGREE
    - TOO_FEW_TO_CALL
    - NOT_ASKED_YET
    - LEFT_OUT
    floor: 5
  lullaby:
    founder_question: What price do you have in mind for something that helps at night?
- key: commercial.ability_to_pay
  vector: COMMERCIAL
  order: 3
  name: Ability to pay
  meaning: Whether the buyer has accessible personal or organizational budget at the relevant price level.
  weight: SHAPES
  founder:
    control: derived
    guidance: 'Never asked of the founder: derived by code from the founder''s cost estimate and price, over the same period -- the price as a share of the cost (price
      low / cost high to price high / cost low, whole percent) and one sentence by band. No question from code or model.'
    normalized:
      kind: price_cost_ratio
      from:
      - commercial.existing_sacrifice
      - commercial.price
      bands:
      - 50
      - 100
    option_rule: 'No options and no answer: written by code whenever the cost estimate and the price are both stated; left out when either is.'
    belief_template: Your price is {value}.
    unsure_allowed: true
  respondent:
    part: 3
    anchor: last_purchase
    control: single_choice
    b2b_link_only: true
    codes:
    - existing_line
    - new_line_signed_off
    - taken_from_other_spend
    - no_budget
    guidance: 'Asked on the decision-maker''s link only, as supporting context: when you last paid for something for this problem, where did the money come from --
      four steps, easiest to hardest, plus ''it was free or a gift''.'
    option_rule: The 4 codes in order + 'It was free or a gift' (escape, counts nothing). No 'Something else'.
    chips:
    - I can't recall
    - I'd rather not say
    b2b:
      anchor: last_purchase
      guidance: 'Where the budget for the last comparable purchase came from: an existing line, a new line that needed sign-off, taken from other spend, or there
        was none.'
      option_rule: 4 ordered options mirroring the codes (existing line · new line signed off · taken from other spend · no budget) + 'It was free'.
  answers:
    shape: choice
    compare_rule: cost_covers_price
    status_vocabulary:
    - HOLDING_UP
    - NOT_HOLDING_UP
    - PEOPLE_DISAGREE
    - TOO_FEW_TO_CALL
    - NOT_ASKED_YET
    - LEFT_OUT
    floor: 5
- key: commercial.buyer_payer_alignment
  vector: COMMERCIAL
  order: 4
  name: Buyer / payer alignment
  meaning: Whether the user, beneficiary, decision maker, approver, and payer are the same person or a workable chain.
  weight: DEAL_BREAKER
  founder:
    control: single_choice
    guidance: Set by the who-decides step (D1); the calibration confirms the chain from user to payer as one of five role chains.
    normalized:
      kind: role_chain
      codes:
      - same_person
      - user_decides_other_pays
      - joint_decision
      - someone_else_decides
      - institution_pays
    option_rule: Exactly 5 options onto the codes, worded for this market's roles; each with a belief phrase that names the chain.
    belief_template: 'On buying: {value}.'
    unsure_allowed: true
  respondent:
    part: 3
    anchor: last_purchase
    control: single_choice
    guidance: 'Who paid for that last thing, and did anyone else have to agree: one pick on the same chains, plus ''it was free''.'
    option_rule: Founder's 5 codes worded as 'me, no one else needed to agree' etc. + 'It was free' (escape). No 'Something else'.
    chips:
    - I can't recall
    - I'd rather not say
    b2b:
      anchor: last_purchase
      guidance: 'For the last comparable purchase: who had to agree before it went through (you alone · you plus your manager · a committee · procurement or finance
        · someone else entirely).'
      option_rule: 5 options mirroring the codes + 'It was free'.
  answers:
    shape: choice
    compare_rule: role_chain_match
    status_vocabulary:
    - HOLDING_UP
    - NOT_HOLDING_UP
    - PEOPLE_DISAGREE
    - TOO_FEW_TO_CALL
    - NOT_ASKED_YET
    - LEFT_OUT
    floor: 5
  lullaby:
    founder_question: When a parent decides to try something new for the baby's nights, who actually pays for it?
- key: commercial.purchase_friction
  vector: COMMERCIAL
  order: 5
  name: Purchase friction
  meaning: The approvals, procurement, account setup, switching, security, spouse/manager agreement, or other steps between interest and purchase.
  weight: SHAPES
  b2b_only: true
  founder:
    control: multi_choice
    guidance: 'What could slow or stop the decision-maker between interest and paying: approvals, proof, payment effort, cancellation worry, privacy, forgetting.'
    normalized:
      kind: set
      codes: model_written
      code_rule: 4–6 slug codes for this market (e.g. partner_approval, social_proof, payment_effort, cancel_worry, privacy, forgetting); ordered as presented.
    option_rule: 4–6 options, each one blocker, each with a belief phrase; ticked phrases joined with 'and'.
    belief_template: Between wanting it and paying, {value} could hold them back.
    unsure_allowed: true
  respondent:
    part: 3
    anchor: last_purchase
    control: multi_choice
    guidance: The last time you nearly bought something for this and didn't, what got in the way; or, for that last purchase, what had to happen first. Tick all;
      include 'Nothing; it never came up'.
    option_rule: Founder's labels verbatim + 2–3 distractors + 'Nothing; it never came up' + 'Something else' (both code-appended).
    chips:
    - I can't recall
    - I'd rather not say
    b2b:
      anchor: last_purchase
      guidance: 'For the last comparable purchase, what had to happen before it went through: security review, procurement, a pilot, budget sign-off, a champion,
        a contract. Tick all.'
      option_rule: Founder's codes + 'Nothing; it went straight through' + 'Something else'.
  answers:
    shape: choice
    compare_rule: set_overlap
    status_vocabulary:
    - HOLDING_UP
    - NOT_HOLDING_UP
    - PEOPLE_DISAGREE
    - TOO_FEW_TO_CALL
    - NOT_ASKED_YET
    - LEFT_OUT
    floor: 5
  lullaby:
    founder_question: Which of these would most likely slow down or stop a parent between hearing about the app and actually paying for it? Pick all that apply.
- key: commercial.commitment
  vector: COMMERCIAL
  order: 6
  name: Commitment
  meaning: The meaningful actions the person is willing to take before purchase, such as time, installation, data access, referral, deposit, or trial participation.
  weight: DEAL_BREAKER
  founder:
    control: multi_choice
    guidance: Which real next steps people would take now for a trial, from a fixed ladder for the market type; the founder's highest ticked rung is the belief.
    normalized:
      kind: ladder
      codes: model_written
      code_rule: 'Exactly the 5 fixed rungs for the project''s type, in order. B2C: setup, install, mic, next_episode, contact_me. B2B: call, read_only_trial, it_intro,
