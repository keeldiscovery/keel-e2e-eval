# A hand-sized registry fixture (spec 029 T004, regenerated at T002): the 25 keys of keel-cloud 058's
# exported dimension-registry.json (14a1430; {window}/{window_unit} placeholders kept) with the Lullaby values,
# every founder.normalized, respondent.*, answers.* (less the drift templates), weight and
# order; prose notes, decisions and the worked lullaby objects dropped except the founder
# question the register shows (claim words reworded, C6). Passes all seven invariants. Not a corpus entry.
version: 1
common:
  left_out: {ask_respondent: false, status: LEFT_OUT, note: 'You weren''t sure, so this was left out of the study. The brief says it is untested.'}
  chips:
    default: [I can't recall, I'd rather not say]
    numeric_extra: That's a rough guess
  something_else: {rule: 'Every closed respondent item whose belief is a SET (multi_choice, multi_choice_ordered, multi_choice_ladder, branch_pick_number''s pick)
      and every single_choice built from a market-specific option set ends with "Something else". Fixed scales (single_choice_5, bands, 0-to-7, yes/no) do not. "Something
      else" is an observation placed OUTSIDE, kept verbatim, never a row of its own on the answers page (spec 050).'}
  floor: {default: 5, unit: anchored people, note: Today's FLOOR = 5; fewer anchored people is Too few to call whatever they say. Never per belief.}
dimensions:
- key: problem.prevalence
  vector: PROBLEM
  order: 1
  name: Prevalence
  meaning: How much of the target segment experiences the problem within a defined period.
  weight: DEAL_BREAKER
  founder:
    control: single_choice
    guidance: Out of 10 people in the segment, how many had this at least once in the last {window}. The window is the project's recall window (the gate's window);
      the bins are contiguous fifths of the segment.
    normalized:
      kind: proportion_bin
      window: '{window}'
      codes: [p_0_20, p_20_40, p_40_60, p_60_80, p_80_100]
    option_rule: 'Exactly 5 options, contiguous: fewer than 2 in 10 · 2 to 4 · 4 to 6 · 6 to 8 · 8 to 10. No gaps (the smoke test''s 5-6 / 7-8 / 9-10 had holes).
      Each option carries its own belief phrase (only a few · a minority · around half · most · nearly all); never the label.'
    belief_template: '{value} of these {actor_plural} had this at least once in the last {window}.'
    unsure_allowed: false
  respondent:
    asked_in_v1: true
    part: 1
    anchor: that_night
    control: gate_yes_no
    guidance: 'This item IS the gate: "In the last {window}, did [the circumstance] happen to you?" Yes / No. Explicit, never inferred from the story. No → graceful
      exit; the person still counts in the denominator. Yes → the story prompt (the anchor test), then the rest of Part 1. Never names the idea, the app or the mechanism.'
    option_rule: 'Yes · No. No distractors, no ''Something else''. Chips: none (a gate must be answered).'
    chips: []
  answers:
    shape: choice
    compare_rule: proportion_from_gate
    status_vocabulary: [HOLDING_UP, NOT_HOLDING_UP, TOO_FEW_TO_CALL, NOT_ASKED_YET]
    floor: 5
  lullaby: {founder_question: 'Out of 10 parents of babies under six months, how many do you think had a night in the last 7 nights when the baby cried and they had
      to decide what to try?'}
- key: problem.frequency
  vector: PROBLEM
  order: 2
  name: Frequency
  meaning: How often an affected person experiences the problem.
  weight: DEAL_BREAKER
  founder:
    control: numeric_interval
    guidance: 'On how many {window_unit} an affected person faces it: a range on an axis from 0 to the window''s length, whole units.'
    normalized:
      kind: interval
      unit_options: ['{window_unit}']
      default_unit: '{window_unit}'
      axis_max: 7
      axis_step: 1
      extend_by: 0
      bins: [0, 1, 2, 3, 4, 5, 6, 7]
    option_rule: 'No options: a two-handle range from 0 to the window''s length. Belief value = the range with its unit (''4 to 7 {window_unit}'').'
    belief_template: '{actor_plural} face this on {value}.'
    unsure_allowed: true
  respondent:
    asked_in_v1: true
    part: 1
    anchor: that_night
    control: segmented_0_to_7
    guidance: Count how many of the last {window} it happened on, not how many times it happened. Never shows the founder's range.
    option_rule: Fixed segmented control 0–7, one tap. No 'Something else'.
    chips: [I can't recall, I'd rather not say, That's a rough guess]
  answers:
    shape: interval
    compare_rule: interval_contains_median
    status_vocabulary: [HOLDING_UP, NOT_HOLDING_UP, PEOPLE_DISAGREE, TOO_FEW_TO_CALL, NOT_ASKED_YET, LEFT_OUT]
    floor: 5
  lullaby: {founder_question: 'In a typical week, on how many nights out of 7 do you think a parent is woken by a cry and has to work out what the baby needs?'}
- key: problem.severity
  vector: PROBLEM
  order: 3
  name: Severity
  meaning: How disruptive or difficult an occurrence is when it happens.
  weight: SHAPES
  founder:
    control: single_choice
    guidance: How disruptive one episode is to the actor, on an anchored five-point scale written as scenarios, not adjectives.
    normalized:
      kind: ordinal
      codes: [barely, a_little, moderately, very, extremely]
    option_rule: Exactly 5 options mapped in order onto the codes; each a one-line scenario of the aftermath; each with its own belief phrase.
    belief_template: For {actor_plural}, one episode {value}.
    unsure_allowed: true
  respondent:
    asked_in_v1: true
    part: 1
    anchor: that_night
    control: single_choice_5
    guidance: 'About that night only: how much it knocked the rest of the night. Fixed five-point scale with the same anchors as the founder''s, in the respondent''s
      register. Never ''usually''.'
    option_rule: Fixed scale, 5 options, same order as the codes. No 'Something else'.
    chips: [I can't recall, I'd rather not say]
  answers:
    shape: choice
    compare_rule: ordinal_band
    status_vocabulary: [HOLDING_UP, NOT_HOLDING_UP, PEOPLE_DISAGREE, TOO_FEW_TO_CALL, NOT_ASKED_YET, LEFT_OUT]
    floor: 5
  lullaby: {founder_question: 'When it happens, how disruptive do you think one of these episodes is for the parent?'}
- key: problem.duration
  vector: PROBLEM
  order: 4
  name: Duration
  meaning: How long an occurrence or its resolution takes.
  weight: DEAL_BREAKER
  founder:
    control: numeric_interval
    guidance: 'From the trigger to resolution, how long a typical episode takes: a range with a unit. Axis 0–60 min by 5, extends by 30; hours allowed.'
    normalized:
      kind: interval
      unit_options: [minutes, hours]
      default_unit: minutes
      axis_max: 60
      axis_step: 5
      extend_by: 30
    option_rule: 'No options: a two-handle range with a unit picker. Belief value = the range with its unit.'
    belief_template: A typical episode takes {value} from start to finish.
    unsure_allowed: true
  respondent:
    asked_in_v1: true
    part: 1
    anchor: that_night
    control: number_with_unit
    guidance: 'That night: how long from the crying starting until the baby settled, as a number with a unit. ''That''s a rough guess'' marks it GUESSED (shown, not
      counted). Never shows the founder''s range.'
    option_rule: One number + unit (minutes | hours). No bands, no 'Something else'.
    chips: [I can't recall, I'd rather not say, That's a rough guess]
  answers:
    shape: interval
    compare_rule: interval_contains_median
    status_vocabulary: [HOLDING_UP, NOT_HOLDING_UP, PEOPLE_DISAGREE, TOO_FEW_TO_CALL, NOT_ASKED_YET, LEFT_OUT]
    floor: 5
  lullaby: {founder_question: 'From the moment the baby starts crying, how long do you think it takes a parent to work out what the baby needs and get them settled?'}
- key: problem.importance
  vector: PROBLEM
  order: 5
  name: Importance
  meaning: How much the actor cares about improving this problem relative to other competing problems.
  weight: SHAPES
  founder:
    control: rank_pick
    guidance: 'Where this ranks among the actor''s difficulties in the circumstance: a rank band, not a rating. The model writes 4–6 distractor difficulties for the
      same circumstance; they are reused on the respondent side.'
    normalized:
      kind: rank_band
      codes: [biggest, top_three, middle, minor, negligible]
    option_rule: Exactly 5 options in rank order mapped onto the codes; each with a belief phrase ('the biggest difficulty', 'one of the top three', ...).
    belief_template: Among the difficulties that come with {circumstance}, this is {value}.
    unsure_allowed: true
  respondent:
    asked_in_v1: true
    part: 1
    anchor: that_night
    control: single_choice
    guidance: 'A trade-off, not a rating: ''If you could make one part of [the circumstance] easier, which would it be?'' Closed pick (no text box). The problem''s
      own item sits among the model''s distractors, never first. Elicited in the respondent''s own terms; never names the idea.'
    option_rule: 5–6 difficulties for the circumstance including the problem's own, order shuffled per project with the problem's item never first, plus 'Something
      else'.
    chips: [I can't recall, I'd rather not say]
  answers:
    shape: choice
    compare_rule: ordinal_band
    status_vocabulary: [HOLDING_UP, NOT_HOLDING_UP, PEOPLE_DISAGREE, TOO_FEW_TO_CALL, NOT_ASKED_YET, LEFT_OUT]
    floor: 5
  lullaby: {founder_question: 'Compared with the other things that make nights hard with a baby under six months, where do you think working out what the cry means
      ranks for the parent?'}
- key: problem.consequence
  vector: PROBLEM
  order: 6
  name: Consequence
  meaning: What downstream effects result from the problem.
  weight: SHAPES
  founder:
    control: multi_choice
    guidance: 'Which effects follow an episode: lost time, sleep, errors, stress, cost, risk, impact on others. The model writes the options for this circumstance.'
    normalized: {kind: set, codes: model_written, code_rule: '4–6 slug codes written by the model for the circumstance (e.g. lost_sleep, partner_woken, stress, next_day_fatigue,
        sought_help, looked_it_up); ordered as presented.'}
    option_rule: 4–6 options, each one effect, each with a belief phrase; the belief sentence joins the ticked phrases with 'and'.
    belief_template: After an episode, {actor_plural} are left with {value}.
    unsure_allowed: true
  respondent:
    asked_in_v1: true
    part: 1
    anchor: that_night
    control: multi_choice
    guidance: What actually happened after that night, tick all that apply; include effects the founder did not name so the respondent is not led; include 'Nothing
      much'.
    option_rule: Founder's codes + 1–2 distractors + 'Nothing much' + 'Something else'. Order shuffled, founder's codes not grouped.
    chips: [I can't recall, I'd rather not say]
  answers:
    shape: choice
    compare_rule: set_overlap
    status_vocabulary: [HOLDING_UP, NOT_HOLDING_UP, PEOPLE_DISAGREE, TOO_FEW_TO_CALL, NOT_ASKED_YET, LEFT_OUT]
    floor: 5
  lullaby: {founder_question: 'Which of these do you think usually follow from a night with one of these episodes? Pick all that apply.'}
- key: problem.workaround_burden
  vector: PROBLEM
  order: 7
  name: Workaround burden
  meaning: The time, effort, steps, money, or inconvenience currently spent coping with the problem.
  weight: SHAPES
  founder:
    control: multi_choice
    guidance: Which actions people take in the moment, as a set; the founder's tick order is the believed sequence.
    normalized: {kind: ordered_set, codes: model_written, code_rule: '4–6 slug codes for the actions in this circumstance (e.g. feed, change, rock_hold, soothe_aids,
        check_comfort, look_up_or_ask); the founder''s tick order is stored.'}
    option_rule: 4–6 options, each one action, each with a belief phrase; the belief sentence lists the ticked phrases in tick order.
    belief_template: In the moment, {actor_plural} try {value}, in that order.
    unsure_allowed: true
  respondent:
    asked_in_v1: true
    part: 1
    anchor: that_night
    control: multi_choice_ordered
    guidance: 'That night: tick what you tried, in the order you tried it. Reconstructs the actual sequence of attempts; never names the idea.'
    option_rule: Founder's codes + 1–2 distractors + 'Something else'; ticks are numbered in tap order.
    chips: [I can't recall, I'd rather not say]
  answers:
    shape: choice
    compare_rule: ordered_set_overlap
    status_vocabulary: [HOLDING_UP, NOT_HOLDING_UP, PEOPLE_DISAGREE, TOO_FEW_TO_CALL, NOT_ASKED_YET, LEFT_OUT]
    floor: 5
  lullaby: {founder_question: 'What do you think parents actually do, in the moment, to work out what the baby needs? Pick all that apply, in the order they try them.'}
- key: problem.current_solution_satisfaction
  vector: PROBLEM
  order: 8
  name: Current solution
  meaning: How adequately the actor's current method or alternative solves the job.
  weight: SHAPES
  founder:
    control: single_choice
    guidance: 'How well today''s way of handling it serves them: an ordered five-point scale written as outcomes, from works reliably to no reliable way.'
    normalized:
      kind: ordinal
      codes: [works_well, mostly_works, hit_and_miss, works_poorly, no_reliable_way]
    option_rule: Exactly 5 options in order onto the codes; each a one-line outcome; each with a belief phrase.
    belief_template: The way {actor_plural} handle it today {value}.
    unsure_allowed: true
  respondent:
    asked_in_v1: true
    part: 1
    anchor: that_night
    control: single_choice_5
    guidance: 'How well their own approach worked that night, not in general: five ordered outcomes from ''worked straight away'' to ''didn''t work at all''. Never
      names the idea.'
    option_rule: Fixed scale, 5 options, same order as the codes. No 'Something else'.
    chips: [I can't recall, I'd rather not say]
  answers:
    shape: choice
    compare_rule: ordinal_band
    status_vocabulary: [HOLDING_UP, NOT_HOLDING_UP, PEOPLE_DISAGREE, TOO_FEW_TO_CALL, NOT_ASKED_YET, LEFT_OUT]
    floor: 5
  lullaby: {founder_question: 'Thinking about how parents work out what the baby needs today, how well do you think that way of doing it serves them?'}
- key: problem.urgency
  vector: PROBLEM
  order: 9
  name: Urgency
  meaning: How quickly the actor feels compelled to act when the problem occurs.
  weight: SHAPES
  founder:
    control: single_choice
    guidance: 'How soon after the trigger the actor feels they must act: contiguous time bins plus ''waits to see''.'
    normalized:
      kind: ordinal
      codes: [within_a_minute, within_five_minutes, five_to_ten_minutes, after_ten_minutes, waits_to_see]
    option_rule: Exactly 5 options in order onto the codes, bins contiguous (under 1 min · 1–5 · 5–10 · over 10 · waits); each with a belief phrase.
    belief_template: When it starts, {actor_plural} feel they must act {value}.
    unsure_allowed: true
  respondent:
    asked_in_v1: false
    part: null
    anchor: that_night
    control: single_choice
    guidance: 'NOT ASKED IN V1. When asked: that night, how long after it started did you do the first thing; same bins. Never names the idea.'
    option_rule: Founder's 5 bins, no distractors, no 'Something else'.
    chips: [I can't recall, I'd rather not say]
  answers:
    shape: choice
    compare_rule: ordinal_band
    status_vocabulary: [NOT_ASKED_YET, LEFT_OUT]
    floor: 5
  lullaby: {founder_question: 'When the baby cries at night and the cause is not clear, how soon do you think a parent feels they must act?'}
- key: solution.compatibility
  vector: SOLUTION
  order: 1
  name: Compatibility
  meaning: How well the proposed approach fits the actor's existing workflow, values, routines, and context.
  weight: DEAL_BREAKER
  founder:
    control: single_choice
    guidance: 'At what point in the real episode the mechanism would be used: ordered positions in the sequence of attempts, ending with ''it would not fit''.'
    normalized:
      kind: ordinal
      codes: [before_any_attempt, after_first_attempt_fails, after_several_attempts, only_when_nothing_works, would_not_fit]
    option_rule: Exactly 5 options in order onto the codes, worded for this mechanism's moment of use; each with a belief phrase.
    belief_template: It fits into the episode {value}.
    unsure_allowed: true
  respondent:
    asked_in_v1: true
    part: 2
    anchor: the_reveal
    guidance: Thinking about that night, at what point, if any, could the mechanism's moment of use (from the reveal, e.g. 'hold the phone near the cot for ten seconds')
      have fitted. Options worded from the respondent's account's shape, never from the founder's pick.
    control: single_choice
    option_rule: Founder's codes + 'At no point that night' (= would_not_fit) + 'Something else'.
    chips: [I can't recall, I'd rather not say]
  answers:
    shape: choice
    compare_rule: choice_majority
    status_vocabulary: [HOLDING_UP, NOT_HOLDING_UP, PEOPLE_DISAGREE, TOO_FEW_TO_CALL, NOT_ASKED_YET, LEFT_OUT]
    floor: 5
  lullaby: {founder_question: 'During a night-time crying episode, at what point would a parent most naturally hold the phone near the cot and let it listen?'}
- key: solution.relative_advantage
  vector: SOLUTION
  order: 2
  name: Relative advantage
  meaning: The improvement the user expects over the current alternative before the new solution is worth changing behavior for.
  weight: DEAL_BREAKER
  founder:
    control: single_choice
    guidance: The one thing that must be materially better than the current routine for people to switch.
    normalized:
      kind: categorical
      codes: [fewer_attempts, shorter_time, less_worry, less_help_needed, easier_recovery]
    option_rule: Exactly 5 options onto the codes, worded for this circumstance; each with a belief phrase naming the improvement as a noun phrase.
    belief_template: To be worth switching to, it must mainly deliver {value}.
    unsure_allowed: true
  respondent:
    asked_in_v1: true
    part: 2
    anchor: the_reveal
    control: single_choice
    guidance: 'If you had had that information that night, what, if anything, would have gone differently: one pick, including ''nothing would have changed''. Never
      the founder''s pick first.'
    option_rule: Founder's codes + 'Nothing would have changed' + 'Something else'.
    chips: [I can't recall, I'd rather not say]
  answers:
    shape: choice
    compare_rule: choice_majority
    status_vocabulary: [HOLDING_UP, NOT_HOLDING_UP, PEOPLE_DISAGREE, TOO_FEW_TO_CALL, NOT_ASKED_YET, LEFT_OUT]
    floor: 5
  lullaby: {founder_question: 'Compared with how a parent copes today, what would have to be clearly more useful for them to prefer a suggestion from the app?'}
- key: solution.effectiveness_threshold
  vector: SOLUTION
  order: 3
  name: Effectiveness threshold
  meaning: The minimum outcome improvement that would make the solution useful.
  weight: DEAL_BREAKER
  founder:
    control: numeric_threshold
    guidance: The smallest improvement per episode that would matter, as one number with a unit (minutes or percent). This sets a bar; interviews never clear it (HANDOFF
      Decision 4).
    normalized:
      kind: threshold
      unit_options: [minutes, percent]
      default_unit: minutes
      axis_max: 30
      axis_step: 5
      extend_by: 15
      bins: [0-5, 5-10, 10-20, 20+]
    option_rule: 'No options: one handle with a unit picker. Belief value = ''at least N unit''. The bins are the respondent''s bands and must be contiguous.'
    belief_template: It is worth using only if it saves at least {value} per episode.
    unsure_allowed: true
  respondent:
    asked_in_v1: true
    part: 2
    anchor: the_reveal
    control: single_choice_bands
    guidance: 'How much sooner that night would have needed to end for a suggestion to have been worth it: contiguous bands plus ''nothing would have made it worth
      it''. Never the founder''s number.'
    option_rule: Fixed bands from normalized.bins in the founder's unit, plus 'Nothing would have made it worth it'. No 'Something else'.
    chips: [I can't recall, I'd rather not say, That's a rough guess]
  answers:
    shape: interval
    compare_rule: threshold_band
    status_vocabulary: [BAR_SET, PEOPLE_DISAGREE, TOO_FEW_TO_CALL, NOT_ASKED_YET, LEFT_OUT]
    floor: 5
  lullaby: {founder_question: 'What is the smallest reduction in the time it takes to settle the baby that would make the app worth using for a parent?'}
- key: solution.trust_risk
  vector: SOLUTION
  order: 4
  name: Trust / risk
  meaning: The conditions that make the user willing or unwilling to rely on the solution and the risks that matter.
  weight: SHAPES
  founder:
    control: multi_choice
    guidance: 'Which conditions must hold before people act on the mechanism''s output: evidence, transparency, stakes, privacy, safety.'
    normalized: {kind: set, codes: model_written, code_rule: '4–6 slug codes for this mechanism (e.g. labelled_suggestion, gives_reason, medical_escalation, audio_private,
        expert_backing, safe_actions_only). The respondent side adds the fixed code own_instinct (''I''d go with my own instinct either way''), never offered to the
        founder.'}
    option_rule: 4–6 options, each one condition, each with a belief phrase; ticked phrases joined with 'and'.
    belief_template: '{actor_plural} would act on it only if {value}.'
    unsure_allowed: true
  respondent:
    asked_in_v1: true
    part: 2
    anchor: the_reveal
    control: multi_choice
    guidance: 'What would need to be true before you acted on a suggestion like that, that night: tick all; include ''I''d go with my own instinct either way''.'
    option_rule: Founder's codes + 1–2 distractors + 'I'd go with my own instinct either way' + 'Something else'.
    chips: [I can't recall, I'd rather not say]
  answers:
    shape: choice
    compare_rule: set_overlap
    status_vocabulary: [HOLDING_UP, NOT_HOLDING_UP, PEOPLE_DISAGREE, TOO_FEW_TO_CALL, NOT_ASKED_YET, LEFT_OUT]
    floor: 5
  lullaby: {founder_question: 'Which of these would a parent need to be true before they acted on a suggestion about what the baby may need? Pick all that apply.'}
- key: solution.reliability_tolerance
  vector: SOLUTION
  order: 5
  name: Reliability tolerance
  meaning: How much error, inconsistency, or failure the user can tolerate before value or trust collapses.
  weight: SHAPES
  founder:
    control: single_choice
    guidance: 'How often the output could be wrong before people stop using it: ordered failure bands out of ten, never a target accuracy number.'
    normalized:
      kind: ordinal
      codes: [never_wrong, one_in_ten, one_in_five, one_in_three, half_the_time]
    option_rule: Exactly 5 options in order onto the codes (0 · about 1 in 10 · about 2–3 in 10 · about 3–4 in 10 · 5 or more in 10), contiguous; each with a belief
      phrase.
    belief_template: They keep using it as long as it is wrong no more than {value}.
    unsure_allowed: true
  respondent:
    asked_in_v1: true
    part: 2
    anchor: the_reveal
    control: single_choice
    guidance: 'If a suggestion had turned out wrong, at what point would you stop relying on it: the same bands, anchored to that night''s kind of episode. Never
      the founder''s band.'
    option_rule: Founder's 5 bands in order, no distractors, no 'Something else'.
    chips: [I can't recall, I'd rather not say]
  answers:
    shape: choice
    compare_rule: ordinal_band
    status_vocabulary: [HOLDING_UP, NOT_HOLDING_UP, PEOPLE_DISAGREE, TOO_FEW_TO_CALL, NOT_ASKED_YET, LEFT_OUT]
    floor: 5
  lullaby: {founder_question: 'Out of 10 night-time episodes, how many times could the app''s suggestion be wrong before a parent stops using it?'}
- key: solution.adoption_friction
  vector: SOLUTION
  order: 6
  name: Adoption friction
  meaning: The additional effort, behavior change, setup, learning, or interruption required to use the solution.
  weight: SHAPES
  founder:
    control: single_choice
    guidance: 'The most extra effort a user would accept at the moment of use: an ordered effort ladder from nothing extra to a daytime setup.'
    normalized:
      kind: ordinal
      codes: [nothing_extra, one_tap, a_few_taps, setup_once, daytime_setup]
    option_rule: Exactly 5 options in order onto the codes, worded for this mechanism's moment of use; each with a belief phrase.
    belief_template: The most extra effort they would accept at the moment of use is {value}.
    unsure_allowed: true
  respondent:
    asked_in_v1: true
    part: 2
    anchor: the_reveal
    control: single_choice
    guidance: 'That night, with the phone where it was and your hands as they were, how much could you have managed before giving up on it: the same effort ladder,
      plus ''I wouldn''t have reached for the phone at all''.'
    option_rule: Founder's 5 rungs in order + 'I wouldn't have reached for the phone at all' (outside, no direction). No 'Something else'.
    chips: [I can't recall, I'd rather not say]
  answers:
    shape: choice
    compare_rule: ordinal_band
    status_vocabulary: [HOLDING_UP, NOT_HOLDING_UP, PEOPLE_DISAGREE, TOO_FEW_TO_CALL, NOT_ASKED_YET, LEFT_OUT]
    floor: 5
  lullaby: {founder_question: 'At 3 a.m., how much extra effort would a parent put into getting the app listening before giving up on it?'}
- key: solution.trialability
  vector: SOLUTION
  order: 7
  name: Trialability
  meaning: What must be true for the user to try the solution with acceptable risk and commitment.
  weight: SHAPES
  founder:
    control: multi_choice
    guidance: 'Which conditions make a first try acceptable: trial length, setup, reversibility, privacy, cost.'
    normalized: {kind: set, codes: model_written, code_rule: '4–6 slug codes for this mechanism (e.g. free_no_card, recommendation, daytime_practice, data_promise,
        easy_exit); ordered as presented.'}
    option_rule: 4–6 options, each one condition, each with a belief phrase; ticked phrases joined with 'and'.
    belief_template: They would try it for the first time if {value}.
    unsure_allowed: true
  respondent:
    asked_in_v1: true
    part: 2
    anchor: the_reveal
    control: multi_choice
