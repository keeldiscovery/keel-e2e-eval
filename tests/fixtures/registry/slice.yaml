- key: commercial.existing_sacrifice
  vector: COMMERCIAL
  order: 1
  name: Existing sacrifice
  meaning: 'Resources already given up because of the problem: money, time, effort, inconvenience, risk, or foregone alternatives.'
  weight: DEAL_BREAKER
  founder:
    control: multi_choice
    guidance: 'What the problem already costs the decision-maker, as a set: money on substitutes, paid help, time, effort, risk. Always include a ''none of these''
      code.'
    normalized: {kind: set, codes: model_written, code_rule: '4–6 slug codes for this market (e.g. apps_subscriptions, gadgets, paid_help, work_sacrifice, medical_visits)
        plus the fixed code none (''None of these; they cope with what they have''); ordered as presented.'}
    option_rule: 4–6 options, each one kind of sacrifice, each with a belief phrase; ticked phrases joined with 'and'.
    belief_template: Because of this, {actor_plural} already give up {value}.
    unsure_allowed: true
  respondent:
    asked_in_v1: true
    part: 3
    anchor: last_purchase
    control: branch_pick_number
    guidance: Think of the last thing you paid for or gave up because of this. Pick what (founder's codes + 'Nothing'), then roughly how much, all together, in the
      last three months (money, market currency), then 'still using it?' yes/no. Never the founder's set.
    option_rule: 'Pick: founder''s codes + 1 distractor + ''Nothing'' + ''Something else''; number: currency amount; follow-up: Yes / No.'
    chips: [I can't recall, I'd rather not say, That's a rough guess]
    b2b: {anchor: last_cycle, guidance: 'What the last cycle of this problem actually cost the team: pick the kinds of cost, then roughly how much in money or hours.
        The decision-maker sees no context card and nothing of what the specialists said.', option_rule: Founder's codes + 'Nothing' + 'Something else'; number in
        currency or hours.}
  answers:
    shape: choice
    compare_rule: set_overlap
    status_vocabulary: [HOLDING_UP, NOT_HOLDING_UP, PEOPLE_DISAGREE, TOO_FEW_TO_CALL, NOT_ASKED_YET, LEFT_OUT]
    floor: 5
  lullaby: {founder_question: 'Which of these have parents of babies under six months already paid for or given up because of the night crying? Pick all that apply.'}
- key: commercial.wtp_hypothesis
  vector: COMMERCIAL
  order: 2
  name: Price
  meaning: A preliminary view of the price/value boundary at which the offer might be chosen; hypothetical WTP is weaker than real purchase behavior.
  weight: SHAPES
  founder:
    control: price_range
    guidance: A range the founder believes reasonable, with a period; stored and shown as HYPOTHESIS in the market's currency.
    normalized:
      kind: price_range
      currency: market
      unit_options: [per month, per year, one-off]
      default_unit: per month
      axis_max: 30
      axis_step: 1
      extend_by: 20
    option_rule: 'No options: a two-handle range with a period picker. Belief value = ''CUR low to high per period''.'
    belief_template: A fair price would feel like {value} (a hypothesis; interviews do not test it).
    unsure_allowed: true
  respondent:
    asked_in_v1: true
    part: 3
    anchor: last_purchase
    control: two_numbers_optional
    guidance: What the last comparable thing cost (number + period), and optionally a guess at a fair price for something that helps with this, labelled on screen
      as a guess. Never the founder's range.
    option_rule: 'Number 1 required: amount + period; number 2 optional, labelled ''just a guess''. No options.'
    chips: [I can't recall, I'd rather not say, That's a rough guess]
    b2b: {anchor: last_purchase, guidance: 'What the last comparable tool or service cost the team per year, and optionally a guess at a budget line for this, labelled
        as a guess.', option_rule: 'Number 1 required: amount per year; number 2 optional, labelled ''just a guess''.'}
  answers:
    shape: interval
    compare_rule: price_hypothesis
    status_vocabulary: [NOT_TESTED_BY_DESIGN, LEFT_OUT]
    floor: 5
  lullaby: {founder_question: 'If a parent paid for the app, what range per month do you think they would consider reasonable?'}
- key: commercial.ability_to_pay
  vector: COMMERCIAL
  order: 3
  name: Ability to pay
  meaning: Whether the buyer has accessible personal or organizational budget at the relevant price level.
  weight: SHAPES
  founder:
    control: single_choice
    guidance: 'Whether the decision-maker could find the money: an ordered four-point scale on budget fit, independent of desire. No mixed options (recurring vs one-off
      belongs to Price).'
    normalized:
      kind: ordinal
      codes: [easily, without_cutting_back, with_a_trade_off, barely]
    option_rule: Exactly 4 options in order onto the codes; each a one-line budget scenario; each with a belief phrase.
    belief_template: They could find the money for it {value}.
    unsure_allowed: true
  respondent:
    asked_in_v1: true
    part: 3
    anchor: last_purchase
    control: single_choice
    guidance: 'When you last paid for something because of this, where did the money come from and did it mean skipping something else: the same four steps plus ''it
      was free or a gift''.'
    option_rule: Founder's 4 codes in order + 'It was free or a gift' (escape, counts nothing). No 'Something else'.
    chips: [I can't recall, I'd rather not say]
    b2b: {anchor: last_purchase, guidance: 'Where the budget for the last comparable purchase came from: existing line, a new line that needed sign-off, squeezed
        from elsewhere, or there was none.', option_rule: 4 ordered options mirroring the codes (existing line · new line approved · squeezed from elsewhere · no
        budget found) + 'It was free'.}
  answers:
    shape: choice
    compare_rule: ordinal_band
    status_vocabulary: [HOLDING_UP, NOT_HOLDING_UP, PEOPLE_DISAGREE, TOO_FEW_TO_CALL, NOT_ASKED_YET, LEFT_OUT]
    floor: 5
  lullaby: {founder_question: 'For a baby-related purchase that is useful with nights, how easily could most parents find room in their budget?'}
- key: commercial.buyer_payer_alignment
  vector: COMMERCIAL
  order: 4
  name: Buyer / payer alignment
  meaning: Whether the user, beneficiary, decision maker, approver, and payer are the same person or a workable chain.
  weight: DEAL_BREAKER
  founder:
    control: single_choice
    guidance: Set by the who-decides step (D1); the calibration confirms the chain from user to payer as one of five role chains.
    normalized:
      kind: role_chain
      codes: [same_person, user_decides_other_pays, joint_decision, someone_else_decides, institution_pays]
    option_rule: Exactly 5 options onto the codes, worded for this market's roles; each with a belief phrase that names the chain.
    belief_template: 'On buying: {value}.'
    unsure_allowed: true
  respondent:
    asked_in_v1: true
    part: 3
    anchor: last_purchase
    control: single_choice
    guidance: 'Who paid for that last thing, and did anyone else have to agree: one pick on the same chains, plus ''it was free''.'
    option_rule: Founder's 5 codes worded as 'me, no one else needed to agree' etc. + 'It was free' (escape). No 'Something else'.
    chips: [I can't recall, I'd rather not say]
    b2b: {anchor: last_purchase, guidance: 'For the last comparable purchase: who had to agree before it went through (you alone · you plus your manager · a committee
        · procurement or finance · someone else entirely).', option_rule: 5 options mirroring the codes + 'It was free'.}
  answers:
    shape: choice
    compare_rule: role_chain_match
    status_vocabulary: [HOLDING_UP, NOT_HOLDING_UP, PEOPLE_DISAGREE, TOO_FEW_TO_CALL, NOT_ASKED_YET, LEFT_OUT]
    floor: 5
  lullaby: {founder_question: 'When a parent decides to try something new for the baby''s nights, who actually pays for it?'}
- key: commercial.purchase_friction
  vector: COMMERCIAL
  order: 5
  name: Purchase friction
  meaning: The approvals, procurement, account setup, switching, security, spouse/manager agreement, or other steps between interest and purchase.
  weight: SHAPES
  founder:
    control: multi_choice
    guidance: 'What could slow or stop the decision-maker between interest and paying: approvals, proof, payment effort, cancellation worry, privacy, forgetting.'
    normalized: {kind: set, codes: model_written, code_rule: '4–6 slug codes for this market (e.g. partner_approval, social_proof, payment_effort, cancel_worry, privacy,
        forgetting); ordered as presented.'}
    option_rule: 4–6 options, each one blocker, each with a belief phrase; ticked phrases joined with 'and'.
    belief_template: Between wanting it and paying, {value} could hold them back.
    unsure_allowed: true
  respondent:
    asked_in_v1: true
    part: 3
    anchor: last_purchase
    control: multi_choice
    guidance: The last time you nearly bought something for this and didn't, what got in the way; or, for that last purchase, what had to happen first. Tick all;
      include 'Nothing; it never came up'.
    option_rule: Founder's codes + 1–2 distractors + 'Nothing; it never came up' + 'Something else'.
    chips: [I can't recall, I'd rather not say]
    b2b: {anchor: last_purchase, guidance: 'For the last comparable purchase, what had to happen before it went through: security review, procurement, a pilot, budget
        sign-off, a champion, a contract. Tick all.', option_rule: Founder's codes + 'Nothing; it went straight through' + 'Something else'.}
  answers:
    shape: choice
    compare_rule: set_overlap
