  occasion: morning
  segment: commuters in Leeds who cycle to work
  understood: 'Keel understands: commuters who cycle, on the morning they cannot find their keys, trying to get out of the
    door on time.'
  recall_window:
    count: 7
    unit: NIGHTS
interpretations:
  problem: Commuters who cycle lose time on the mornings they cannot find their keys, and are late because of it.
  offer_name: a fix for lost keys
solution_mechanism:
  actor: the commuter
  trigger: when the keys are not where they were left
  mechanism: whistles once and the tag on the ring listens for it
  output: a beep from the tag, loud enough to follow
  not_assumed:
  - the keys are always found
  mechanism_terms:
  - tag
  - whistle
  - beep
  - key ring
  short_name: a tag that beeps back
persona:
  decision_maker:
    role: buyer
hourly_rate:
  value: 20
  currency: GBP
