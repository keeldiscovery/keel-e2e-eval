    escape: cant_recall
  commercial.price:
    part: 3
    control: price_ladder
    codes:
    - under_1
    - band_1_2
    - band_2_5
    - band_5_10
    - over_10
    - would_not_pay
    escape: cant_say
  commercial.ability_to_pay:
    part: 3
    control: single_choice
    codes:
    - existing_line
    - new_line_signed_off
    - taken_from_other_spend
    - no_budget
    escape: cant_recall_one
  commercial.purchase_friction:
    part: 3
    control: fixed_three
    codes:
    - yes_long
    - yes_quick
    - not_needed
    escape: cant_recall
  commercial.commitment:
    part: 3
    control: fixed_four
    codes:
    - yes_start
    - yes_after_trying
    - probably_not
    - 'no'
