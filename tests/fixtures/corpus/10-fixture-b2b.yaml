      low: 1
      high: 3
      rate: 20
      period: month
      currency: GBP
    belief_phrase: 1 to 3 hours a month, about £20 to £60
    belief_sentence: The problem already costs the payer 1 to 3 hours a month, about £20 to £60.
  commercial.price:
    answer:
      low: 3
      high: 5
      period: month
      currency: GBP
    belief_phrase: £3 to £5 a month
    belief_sentence: The payer would think it worth £3 to £5 a month.
  commercial.ability_to_pay:
