    belief_sentence: For most, on their last morning, they had a phone to hand.
  solution.relative_advantage:
    answer:
      items:
      - code: shorter_time
        label: A shorter search
    belief_phrase: a shorter search
    belief_sentence: For most, it would have made their last morning better.
  solution.adoption_friction:
