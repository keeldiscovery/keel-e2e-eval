# The B2B twin of 09-fixture.yaml (spec 040 T004): persona.decision_maker is the `buyer` role, so the entry calibrates
# all thirteen keys -- Purchase friction's two steps, the first picked -- and part 3 is the COMMERCIAL_B2B link's (five
# asked: the commercial six less the unsure Buyer and payer), answered by five decision-makers (Pip escapes Existing
# sacrifice and Ability to pay). The cost is HOURS (1 to 3 at the entry's `hourly_rate` of £20, about £20 to £60 a
# month); Ability to pay is derived. Not a corpus entry; values invented. `expected` is the engine's own output, and
# `check_corpus_r10.py` prints OK for it.
id: 10-fixture-b2b
title: Fixture — the keys you cannot find, bought by the office
revision: 10
market:
  country: GB
  region: null
  language: en-GB
statements:
  problem: Commuters who cycle lose ten minutes most mornings looking for their keys.
  solution: A tag on the key ring that listens for a whistle and beeps back, so the owner can follow the sound.
  commercial: £3 a month, paid by the commuter.
roles:
- id: commuter
  label: Commuters who cycle
  roleType: CONSUMER
  about: someone who cycles to work
- id: buyer
  label: Office managers
  roleType: BUYER
  about: the office manager who buys for the team
context:
  actor: commuter
  actor_plural: commuters who cycle
  job: get out of the door on time
