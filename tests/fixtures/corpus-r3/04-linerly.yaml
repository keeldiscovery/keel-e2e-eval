market: {country: GB, region: London, language: en-GB}
statements: {problem: London commuter cyclists riding fifty kilometres a week or more get a puncture about twice a year —
    usually glass or flint through the tread on a wet road — and lose thirty to sixty minutes each time fixing it at the roadside
    or walking the bike to a shop; based on the founder's own eight years of commuting across the city., solution: A tyre
    liner fitted between tube and tyre on standard 700c wheels that stops glass and flint reaching the tube., commercial: 'The
    rider pays £40 a pair, roughly what they already spend on tubes and tyres in a year, and buys it themselves.'}
