# Golden corpus entry 06 -- Repeatline, repeat prescriptions without the queue.
#
# REVISION 3, 2026-10-07 -- keel-e2e-eval spec 029 (marks v9, the vector redesign). Re-expressed in
# marks-v9 §4's schema from the revision-2 file of the same name: the market, the statements, the roles
# and the people are kept; each person's first occasion becomes their gate story, and their picks are
# re-chosen by hand against the registry's dimensions. Standings tallied from the picks under the
# compare rules the founder signed on 2026-10-07 (marks-v9 §2.5, spec 029 FR-018).
# B2B: the decision-maker is the `manager` role. The seven practice managers answer Part 3 on their own
# link (`link: COMMERCIAL_B2B`), and the commercial vector is counted over them (six anchored, the floor
# met); the receptionists answer Parts 1 and 2. The commitment ladder is the B2B one.
# The gate reads this entry's own window -- the last shift on the phones. Lou Pereira (wrote nothing)
# answers No. Jo Harding chips (cant_recall); Fay Morrison's and Theo Nakamura's stories are vague.
#
# RECORDED UNDER keel-e2e-eval tests/fixtures/corpus-r3/ AND TO BE MOVED VERBATIM into keel-cloud
# canon/designs/measured-beliefs/corpus/ at integration; `check_corpus.py` and `GoldenCorpusTest`
# confirm the counts there.

id: 06-repeatline
title: Repeatline — repeat prescriptions without the queue
revision: 3
market: {country: GB, region: null, language: en-GB}
statements: {problem: 'GP receptionists take forty repeat-prescription calls a day, two to four minutes each, about half of
    all the calls they answer, typing each request into the clinical system by hand, and a request goes missing or gets delayed
    often enough that patients ring back; based on the founder''s three years as a practice manager.', solution: 'A self-service
    phone line, added to the practice''s existing phone menu, that takes the repeat request and files it into the clinical
    system, so the receptionist handles only the exceptions.', commercial: 'The practice manager pays £150 a month, as the
    practice already pays for its phone and online tools, and signs it off without going to the partners.'}
roles:
- {id: receptionist, label: GP receptionists, roleType: PRACTITIONER, about: a receptionist who answers the practice's phones}
- {id: manager, label: Practice managers, roleType: BUYER, about: the practice manager who buys the practice's phone and online
    tools}
context: {actor: GP receptionist, actor_plural: GP receptionists, job: get every repeat-prescription request to the right
    clinician without losing one, circumstance: a patient rings for a repeat prescription, segment: receptionists at GP practices
    in England, understood: 'GP receptionists, when a patient rings for a repeat prescription, trying to get every request
    to the right clinician without losing one.'}
interpretations: {problem: 'GP receptionists spend about half their phone time on repeat-prescription calls, typing each request
    into the clinical system by hand, and a request that goes missing brings the patient ringing back.'}
