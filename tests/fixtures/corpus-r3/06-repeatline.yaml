  actor: the patient
  trigger: when they ring for a repeat
  mechanism: chooses the self-service option in the phone menu and gives the request to it
  output: the request filed into the clinical system, with only the exceptions passed to a receptionist
  not_assumed: [every patient will use the option, no request ever goes astray]
  mechanism_terms: [self-service, menu option, exceptions]
persona:
  decision_maker: {role: manager}
