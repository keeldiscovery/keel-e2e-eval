# Golden corpus entry 05 -- Paidly, paid in seven days.
#
# REVISION 3, 2026-10-07 -- keel-e2e-eval spec 029 (marks v9, the vector redesign). Re-expressed in
# marks-v9 §4's schema from the revision-2 file of the same name: the market, the statements, the roles
# and the people are kept; each person's first occasion becomes their gate story, and their picks are
# re-chosen by hand against the registry's dimensions. Standings tallied from the picks under the
# compare rules the founder signed on 2026-10-07 (marks-v9 §2.5, spec 029 FR-018).
# THE B2B ENTRY (spec 029 FR-010, A-5): the decision-maker is the `agency` role. The eight agency project
# managers answer Part 3 on their own link (`link: COMMERCIAL_B2B`: no gate, no context card, no reveal),
# and the commercial vector is counted over them; the translators answer Parts 1 and 2. The commitment
# ladder is the B2B one (call, read_only_trial, it_intro, data, paid_pilot).
# The gate reads this entry's own window -- an agency invoice paid in the last three months. Yara Haddad
# (wrote nothing) answers No. Xavier Dubois chips (rather_not_say); Sven Larsen's story is vague; Yusuf
# Hazel's last purchase is vague: GUESSED, counted nowhere. Duration is counted in days.
#
# RECORDED UNDER keel-e2e-eval tests/fixtures/corpus-r3/ AND TO BE MOVED VERBATIM into keel-cloud
# canon/designs/measured-beliefs/corpus/ at integration; `check_corpus.py` and `GoldenCorpusTest`
# confirm the counts there.

id: 05-paidly
title: Paidly — paid in seven days
revision: 3
market: {country: GB, region: null, language: en-GB}
statements: {problem: 'Freelance translators wait about forty-five days to be paid by agencies — most of their last few invoices
    went past the agreed terms, they chase by email, and they cover the gap from savings or an overdraft; based on the founder''s
    own five years translating for agencies.', solution: 'A platform that pays the translator within seven days of the agency
    approving the invoice, for a fee the agency pays, in place of the PDF invoice sent by email today.', commercial: 'The
    agency''s project manager signs up and pays a fee of about £80 a month, as they already pay platform and payment fees,
    without needing the owner''s approval.'}
roles:
- {id: translator, label: Freelance translators, roleType: PRACTITIONER, about: a freelance translator who invoices agencies}
- {id: agency, label: Agency project managers, roleType: BUYER, about: the project manager at a translation agency who chooses
    and pays for its tools}
context: {actor: freelance translator, actor_plural: freelance translators working for agencies, job: get paid for finished
    work in time to cover the month, circumstance: an agency has approved the invoice and the money has not arrived, segment: freelance
    translators in the UK who work mostly for agencies, understood: 'Freelance translators working for agencies, when an agency
    has approved the invoice and the money has not arrived, trying to get paid in time to cover the month.'}
interpretations: {problem: 'Freelance translators wait weeks past the agreed terms after an agency approves an invoice until
    it pays, chasing by email and covering the gap from savings or an overdraft.'}
solution_mechanism:
  actor: the agency
  trigger: when it approves a translator's invoice
  mechanism: approves it on the platform, which pays the translator for a fee
  output: the money paid to the translator within seven days
  not_assumed: [the agency accepts the fee]
  mechanism_terms: [platform, fee]
