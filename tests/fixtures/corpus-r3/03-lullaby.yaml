# Golden corpus entry 03 -- Lullaby, a cry-classifying app for new parents.
#
# REVISION 3, 2026-10-07 -- keel-e2e-eval spec 029 (marks v9, the vector redesign). The second recorded
# revision since the freeze (README's rule: "a change before then is a recorded corpus revision, not a quiet
# edit"). Re-expressed in marks-v9 §4's schema from the registry's `lullaby` objects
# (keel-cloud-docs canon/drafts/vector-redesign-2026-10-06/dimension-registry.v1.draft.yaml), which own the
# worked example; where marks-v9 §5's excerpt and the registry disagree, the registry wins (spec 029 A-6).
#
# Hand-worked, by person, under the compare rules the founder signed on 2026-10-07 (marks-v9 §2.5; spec 029
# FR-018). Hugo Laurent ("about ten days ago") and Leo Martins (sleeps through) answer No at the 7-night gate
# and answer nothing more (decisions 3, 14). Jonas Weber chips (cant_recall): GUESSED by code, never read
# (decision 5). Finn Murphy's story is vague: GUESSED, no chip. Grace Okonkwo's forty minutes is a rough
# guess: shown, not counted (Duration n = 7). The six commercial examples are re-worked at n <= 10 -- eight
# anchored people reach part 3 (decision 14); no status changed. `founder_calibration[*].belief_sentence` and
# `interpretations.problem` are recorded here as spec 029's plan O-2 / O-3 ask; `respondent_questions`
# carries the gate itself and `problem.importance.own_item` (spec 029 tasks.md D3).
#
# RECORDED UNDER keel-e2e-eval tests/fixtures/corpus-r3/ AND TO BE MOVED VERBATIM into keel-cloud
# canon/designs/measured-beliefs/corpus/ at integration (the orchestrator's cross-track arrangement of
# 2026-10-07); `check_corpus.py` and `GoldenCorpusTest` confirm the counts there.

id: 03-lullaby
title: Lullaby — what the cry means
revision: 3
market: {country: GB, region: null, language: en-GB}
statements: {problem: 'Parents of babies under six months are woken three or more times a night and can''t tell what the cry
    means — they try feeding, changing and rocking in turn, taking about twenty minutes to settle the baby each time, because
    nothing tells them which need it is; based on the founder''s own first year with twins.', solution: 'A phone app that
    listens to the cry and says which need it most likely is — hunger, a nappy, wind, temperature — so the parent reaches
    for the right thing first.', commercial: 'The parent pays £6 a month, as they already pay for baby-tracking and white-noise
    apps, with nobody else to approve it.'}
roles:
- {id: parent, label: New parents, roleType: CONSUMER, about: the parent of a baby under six months who gets up in the night}
context: {actor: parent, actor_plural: parents of babies under six months, job: work out what the baby needs and settle them,
  circumstance: the baby cries in the night, segment: 'first-time parents in the UK, baby under six months', understood: 'Parents
    of babies under six months, when the baby cries in the night and they must work out what it needs and settle them.'}
interpretations: {problem: 'Parents of babies under six months, woken by crying in the night, cannot tell the reason for the
    cry, so they end up guessing: the parent feeds, changes, rocks and holds the baby in turn until it settles.'}
solution_mechanism:
  actor: the parent
  trigger: when the baby is crying at night and the reason is unclear
  mechanism: holds the phone near the cot for about ten seconds while it listens
  output: a short card naming what the baby most likely needs, and the next most likely
  not_assumed: [stops the guessing, settles the baby faster]
  mechanism_terms: [listen, phone, cot, card, most likely, suggestion]
persona: {decision_maker: same_person}
founder_calibration:
  problem.prevalence: {answer: p_60_80, belief_phrase: Most, belief_sentence: Most of these parents of babies under six months
      had this at least once in the last 7 nights.}
  problem.frequency:
    answer: {lower: 4, upper: 7, unit: nights out of 7}
    belief_phrase: 4 to 7 nights out of 7
    belief_sentence: Parents of babies under six months face this on 4 to 7 nights out of 7.
