  problem.consequence:
    answer: [lost_sleep, stress, next_day_fatigue]
    belief_phrase: lost sleep and stress and a worse next day
    belief_sentence: After an episode, parents of babies under six months are left with lost sleep and stress and a worse
      next day.
  problem.workaround_burden:
    answer: [feed, change, rock_hold]
    belief_phrase: feeding, a nappy change, rocking
    belief_sentence: In the moment, parents of babies under six months try feeding, a nappy change, rocking, in that order.
  problem.current_solution_satisfaction: {answer: works_poorly, belief_phrase: 'works poorly: they end up guessing', belief_sentence: 'The
      way parents of babies under six months handle it today works poorly: they end up guessing.'}
  problem.urgency: {unsure: true, belief_sentence: 'Left out: you weren''t sure.'}
  solution.compatibility: {answer: before_any_attempt, belief_phrase: 'right at the start, before anything is tried', belief_sentence: 'It
      fits into the episode right at the start, before anything is tried.'}
  solution.relative_advantage: {answer: fewer_attempts, belief_phrase: fewer things tried before the baby settles, belief_sentence: 'To
      be worth switching to, it must mainly deliver fewer things tried before the baby settles.'}
  solution.effectiveness_threshold:
    answer: {value: 5, unit: minutes}
    belief_phrase: at least 5 minutes
    belief_sentence: It is worth using only if it saves at least 5 minutes per episode.
  solution.trust_risk:
    answer: [labelled_suggestion, safe_actions_only]
    belief_phrase: it is plainly labelled a suggestion and it only ever suggests safe things to try
    belief_sentence: Parents of babies under six months would act on it only if it is plainly labelled a suggestion and it
      only ever suggests safe things to try.
  solution.reliability_tolerance: {answer: one_in_five, belief_phrase: about one time in five, belief_sentence: They keep
      using it as long as it is wrong no more than about one time in five.}
  solution.adoption_friction: {answer: a_few_taps, belief_phrase: a few taps, belief_sentence: The most extra effort they
      would accept at the moment of use is a few taps.}
  solution.trialability:
    answer: [free_no_card, easy_exit]
    belief_phrase: it is free with no card details and they can delete everything at any time
    belief_sentence: They would try it for the first time if it is free with no card details and they can delete everything
