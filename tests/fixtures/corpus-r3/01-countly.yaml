# Golden corpus entry 01 -- Countly, restaurant inventory mismatches.
#
# REVISION 3, 2026-10-07 -- keel-e2e-eval spec 029 (marks v9, the vector redesign). Re-expressed in
# marks-v9 §4's schema from the revision-2 file of the same name: the market, the statements, the roles
# and the people are kept; each person's first occasion becomes their gate story, and their picks are
# re-chosen by hand against the registry's dimensions. Standings tallied from the picks under the
# compare rules the founder signed on 2026-10-07 (marks-v9 §2.5, spec 029 FR-018).
# The gate reads this entry's own window -- a mismatched delivery in the last month (README: the registry's
# fixed `7 nights` is Lullaby's). Oliver Grant (wrote nothing) and Sam Whitfield (six weeks ago) answer No.
# Marcus Lindqvist and Tom Okafor tell no particular delivery: GUESSED, read and counted nowhere.
# LEAVES OUT AN ASKED DIMENSION (spec 029 FR-009, decision 16): problem.severity is unsure, so the plan's
# Part 1 is 7 and dimension_coverage's `unsure` subtraction is exercised. problem.urgency carries a belief
# and reads NOT_ASKED_YET (registry decision 3).
#
# RECORDED UNDER keel-e2e-eval tests/fixtures/corpus-r3/ AND TO BE MOVED VERBATIM into keel-cloud
# canon/designs/measured-beliefs/corpus/ at integration; `check_corpus.py` and `GoldenCorpusTest`
# confirm the counts there.

id: 01-countly
title: Countly — restaurant inventory mismatches
revision: 3
market: {country: GB, region: null, language: en-GB}
statements: {problem: 'Independent restaurant managers lose one to two hours most weeks reconciling physical against recorded
    inventory whenever a shipment doesn''t match the invoice — right now they recount by hand and adjust the spreadsheet manually,
    though it''s not yet clear how much of that time is pure friction versus unavoidable — based on the founder''s own five
    years running a restaurant kitchen.', solution: A phone app. A member of staff scans each delivery on arrival; the app
    compares what arrived to the invoice and flags a mismatch the same day; the manager confirms it on the phone instead of
    recounting the walk-in., commercial: 'The owner-manager pays £40 a month per site, as they already pay for their POS and
    rota tools, with nobody else to approve it.'}
roles:
- {id: manager, label: Restaurant managers, roleType: PRACTITIONER, about: the manager of an independent restaurant who takes
    deliveries and keeps the stock records}
context: {actor: restaurant manager, actor_plural: independent restaurant managers, job: keep the stock records matching what
    is on the shelves, circumstance: a delivery does not match its invoice, segment: 'independent restaurant managers in the
    UK, one or two sites', understood: 'Independent restaurant managers, when a delivery does not match its invoice, trying
    to keep the stock records matching what is on the shelves.'}
interpretations: {problem: 'Independent restaurant managers lose time whenever a delivery does not match its invoice: a member
    of staff takes it in, the mismatch surfaces later, and the manager recounts the stock by hand and fixes the spreadsheet.'}
solution_mechanism:
  actor: a member of staff
  trigger: when a delivery arrives
  mechanism: scans each delivery on arrival and the app compares it with the invoice
  output: a flag on the manager's phone the same day naming what is short or over
  not_assumed: [stops every mismatch, saves the manager two hours]
  mechanism_terms: [scan, app, flag]
persona: {decision_maker: same_person}
founder_calibration:
  problem.prevalence: {answer: p_80_100, belief_phrase: Nearly all, belief_sentence: Nearly all of these independent restaurant
      managers had this at least once in the last 7 nights.}
  problem.frequency:
    answer: {lower: 1, upper: 3, unit: days out of 7}
    belief_phrase: 1 to 3 days out of 7
    belief_sentence: Independent restaurant managers face this on 1 to 3 days out of 7.
  problem.severity: {unsure: true, belief_sentence: 'Left out: you weren''t sure.'}
  problem.duration:
    answer: {lower: 60, upper: 120, unit: minutes}
    belief_phrase: 60 to 120 minutes
    belief_sentence: A typical episode takes 60 to 120 minutes from start to finish.
  problem.importance: {answer: top_three, belief_phrase: one of the top three, belief_sentence: 'Among the difficulties that
      come with a delivery does not match its invoice, this is one of the top three.'}
  problem.consequence:
    labels: ["Hours lost reconciling the counts", "Stock figures that are wrong", "Food thrown away", "Service starting late"]
    answer: [lost_time, stock_errors, waste]
    belief_phrase: lost time and stock errors and waste
    belief_sentence: After an episode, independent restaurant managers are left with lost time and stock errors and waste.
  problem.workaround_burden:
    labels: ["Recount the stock by hand", "Correct the stock sheet", "Call the supplier", "Leave it and move on"]
    answer: [recount, fix_sheet, call_supplier]
    belief_phrase: a recount, fixing the spreadsheet, a call to the supplier
    belief_sentence: In the moment, independent restaurant managers try a recount, fixing the spreadsheet, a call to the supplier,
      in that order.
  problem.current_solution_satisfaction: {answer: hit_and_miss, belief_phrase: is hit and miss, belief_sentence: The way independent
      restaurant managers handle it today is hit and miss.}
  problem.urgency: {answer: within_five_minutes, belief_phrase: within a few minutes, belief_sentence: 'When it starts, independent
      restaurant managers feel they must act within a few minutes.'}
  solution.compatibility: {answer: before_any_attempt, belief_phrase: 'as the delivery comes in, before anything is checked',
    belief_sentence: 'It fits into the episode as the delivery comes in, before anything is checked.'}
  solution.relative_advantage: {answer: shorter_time, belief_phrase: a shorter reconciliation, belief_sentence: 'To be worth
      switching to, it must mainly deliver a shorter reconciliation.'}
  solution.effectiveness_threshold:
    answer: {value: 30, unit: minutes}
    belief_phrase: at least 30 minutes
    belief_sentence: It is worth using only if it saves at least at least 30 minutes per episode.
  solution.trust_risk:
    labels: ["It shows exactly which line is wrong", "A manager confirms before anything changes", "The supplier sees the same record", "A photo backs up each delivery"]
    answer: [shows_the_line, manager_confirms]
    belief_phrase: it shows the line that differs and the manager confirms it
    belief_sentence: Independent restaurant managers would act on it only if it shows the line that differs and the manager
      confirms it.
  solution.reliability_tolerance: {answer: one_in_ten, belief_phrase: about one time in ten, belief_sentence: They keep using
      it as long as it is wrong no more than about one time in ten.}
  solution.adoption_friction: {answer: one_tap, belief_phrase: a single scan, belief_sentence: The most extra effort they
      would accept at the moment of use is a single scan.}
  solution.trialability:
    labels: ["A free first month", "Nothing to pay to install", "The supplier helps get it set up"]
    answer: [free_month, no_install_cost]
    belief_phrase: it is free for a month and costs nothing to install
    belief_sentence: They would try it for the first time if it is free for a month and costs nothing to install.
  solution.observability:
    labels: ["Fewer recounts", "The stock sheet matches the shelves", "Credits back from the supplier"]
    answer: [fewer_recounts, sheet_matches]
    belief_phrase: they recount less and the sheet matches the shelves
    belief_sentence: They would know it helped when they recount less and the sheet matches the shelves.
  solution.target_circumstance: {labels: ["A busy delivery morning", "A new supplier", "Stocktake week"], answer: busy_morning, belief_phrase: on a busy delivery morning, belief_sentence: It matters
      most on a busy delivery morning.}
  commercial.existing_sacrifice:
    labels: ["Staff hours spent counting", "Stock written off", "Software for stock or invoices", "None of these"]
    answer: [staff_hours, write_offs]
    belief_phrase: staff hours and written-off stock
    belief_sentence: Because of this, independent restaurant managers already give up staff hours and written-off stock.
  commercial.wtp_hypothesis:
    answer: {lower: 30, upper: 50, currency: GBP, per: month}
    belief_phrase: £30 to £50 per month
    belief_sentence: A fair price would feel like £30 to £50 per month (a hypothesis; interviews do not test it).
  commercial.ability_to_pay: {answer: without_cutting_back, belief_phrase: 'fairly easily, without cutting back elsewhere',
    belief_sentence: 'They could find the money for it fairly easily, without cutting back elsewhere.'}
  commercial.buyer_payer_alignment: {answer: same_person, belief_phrase: 'the same person uses it, decides and pays', belief_sentence: 'On
      buying: the same person uses it, decides and pays.'}
  commercial.purchase_friction:
    labels: ["Time to set it up", "Training the staff", "A long contract"]
    answer: [setup_time, staff_training]
    belief_phrase: the time to set it up and training the staff
    belief_sentence: Between wanting it and paying, the time to set it up and training the staff could hold them back.
  commercial.commitment:
    labels: ["Set it up before the next time", "Install the app", "Allow the access it needs", "Try it the next time it happens", "Have you contact them about the pilot"]
    answer: [setup, install]
    belief_phrase: installing the app
    belief_sentence: For a trial, right now, they would go as far as installing the app.
  commercial.retention_potential: {unsure: true, belief_sentence: 'Left out: you weren''t sure.'}
