# Golden corpus entry 02 -- ComplianceLog, training-compliance reports.
#
# REVISION 3, 2026-10-07 -- keel-e2e-eval spec 029 (marks v9, the vector redesign). Re-expressed in
# marks-v9 §4's schema from the revision-2 file of the same name: the market, the statements, the roles
# and the people are kept; each person's first occasion becomes their gate story, and their picks are
# re-chosen by hand against the registry's dimensions. Standings tallied from the picks under the
# compare rules the founder signed on 2026-10-07 (marks-v9 §2.5, spec 029 FR-018).
# The gate reads this entry's own window -- a report compiled in the last quarter. Georgia Papadopoulos
# (hasn't happened) and Priya Natarajan (over a year ago) answer No. Noor Haddad chips (cant_recall):
# GUESSED by code, never read. Effectiveness threshold's bands are read in the founder's own unit (hours).
#
# RECORDED UNDER keel-e2e-eval tests/fixtures/corpus-r3/ AND TO BE MOVED VERBATIM into keel-cloud
# canon/designs/measured-beliefs/corpus/ at integration; `check_corpus.py` and `GoldenCorpusTest`
# confirm the counts there.

id: 02-compliancelog
title: ComplianceLog — training-compliance reports
revision: 3
market: {country: GB, region: null, language: en-GB}
statements: {problem: 'HR managers at firms of 200 to 500 people spend about two working days every quarter compiling the
    training-compliance report — pulling completions out of the learning system into a spreadsheet by hand whenever the quarter
    closes, and again whenever an auditor asks — with the risk that a missed completion surfaces in an audit; based on the
    founder''s six years in HR operations.', solution: 'A connector that reads completions from the learning system and produces
    the quarterly report as a draft the HR manager reviews and signs, instead of building it from a spreadsheet.', commercial: 'The
    HR director pays £300 a month, out of the HR tools budget they already hold, with finance signing off anything over £250.'}
roles:
- {id: hr, label: HR managers, roleType: MANAGER, about: the HR manager who compiles the quarterly training-compliance report}
context: {actor: HR manager, actor_plural: HR managers at firms of 200 to 500 people, job: get the training-compliance report
    out complete and on time, circumstance: the quarter closes and the training-compliance report is due, segment: HR managers
    at UK firms of 200 to 500 people, understood: 'HR managers at firms of 200 to 500 people, when the quarter closes and
    the training-compliance report is due, trying to get it out complete and on time.'}
interpretations: {problem: 'HR managers at firms of 200 to 500 people lose about two working days each quarter pulling completions
    out of the learning system into a spreadsheet by hand, and still risk a missed completion surfacing in an audit.'}
solution_mechanism:
  actor: the HR manager
  trigger: when the quarter closes or an auditor asks
  mechanism: connects the connector once and it reads every completion from the learning system
  output: a draft report to review and sign
  not_assumed: [the audit always passes, every edge case is caught]
  mechanism_terms: [connector, draft, sign off, reads completions]
persona: {decision_maker: same_person}
founder_calibration:
  problem.prevalence: {answer: p_60_80, belief_phrase: Most, belief_sentence: Most of these HR managers at firms of 200 to
      500 people had this at least once in the last 7 nights.}
  problem.frequency:
    answer: {lower: 2, upper: 3, unit: days out of 7}
    belief_phrase: 2 to 3 days out of 7
    belief_sentence: HR managers at firms of 200 to 500 people face this on 2 to 3 days out of 7.
  problem.severity: {answer: very, belief_phrase: takes over the week, belief_sentence: 'For HR managers at firms of 200 to
      500 people, one episode takes over the week.'}
  problem.duration:
    answer: {lower: 12, upper: 20, unit: hours}
    belief_phrase: 12 to 20 hours
    belief_sentence: A typical episode takes 12 to 20 hours from start to finish.
  problem.importance: {answer: biggest, belief_phrase: the biggest headache of the quarter, belief_sentence: 'Among the difficulties
      that come with the quarter closes and the training-compliance report is due, this is the biggest headache of the quarter.'}
  problem.consequence:
    answer: [late_nights, audit_risk, chasing_managers]
    belief_phrase: late nights and audit risk and chasing managers
    belief_sentence: After an episode, HR managers at firms of 200 to 500 people are left with late nights and audit risk
      and chasing managers.
  problem.workaround_burden:
    answer: [export, reconcile, chase]
    belief_phrase: an export, a reconciliation by hand, chasing the managers
    belief_sentence: In the moment, HR managers at firms of 200 to 500 people try an export, a reconciliation by hand, chasing
      the managers, in that order.
  problem.current_solution_satisfaction: {answer: works_poorly, belief_phrase: 'works poorly: it never quite reconciles',
    belief_sentence: 'The way HR managers at firms of 200 to 500 people handle it today works poorly: it never quite reconciles.'}
  problem.urgency: {unsure: true, belief_sentence: 'Left out: you weren''t sure.'}
  solution.compatibility: {answer: before_any_attempt, belief_phrase: before the spreadsheet is even opened, belief_sentence: It
      fits into the episode before the spreadsheet is even opened.}
  solution.relative_advantage: {answer: shorter_time, belief_phrase: 'a report out in hours, not days', belief_sentence: 'To
      be worth switching to, it must mainly deliver a report out in hours, not days.'}
  solution.effectiveness_threshold:
    answer: {value: 8, unit: hours}
    belief_phrase: at least 8 hours
    belief_sentence: It is worth using only if it saves at least at least 8 hours per episode.
  solution.trust_risk:
    answer: [shows_sources, hr_signs_off]
    belief_phrase: it shows where every figure came from and HR signs it off
    belief_sentence: HR managers at firms of 200 to 500 people would act on it only if it shows where every figure came from
      and HR signs it off.
  solution.reliability_tolerance: {answer: one_in_five, belief_phrase: about one time in five, belief_sentence: They keep
      using it as long as it is wrong no more than about one time in five.}
  solution.adoption_friction: {answer: setup_once, belief_phrase: 'a one-time connection, then a click', belief_sentence: 'The
      most extra effort they would accept at the moment of use is a one-time connection, then a click.'}
  solution.trialability:
    answer: [sandbox, read_only]
    belief_phrase: it runs on a sandbox first and only ever reads
    belief_sentence: They would try it for the first time if it runs on a sandbox first and only ever reads.
  solution.observability:
    answer: [time_saved, audit_clean]
    belief_phrase: the report took hours not days and the audit found nothing
    belief_sentence: They would know it helped when the report took hours not days and the audit found nothing.
  solution.target_circumstance: {answer: quarter_end, belief_phrase: at quarter end, belief_sentence: It matters most at quarter
      end.}
  commercial.existing_sacrifice:
    answer: [analyst_time, overtime]
    belief_phrase: analyst time and overtime
    belief_sentence: Because of this, HR managers at firms of 200 to 500 people already give up analyst time and overtime.
  commercial.wtp_hypothesis:
    answer: {lower: 250, upper: 350, currency: GBP, per: month}
    belief_phrase: £250 to £350 per month
    belief_sentence: A fair price would feel like £250 to £350 per month (a hypothesis; interviews do not test it).
  commercial.ability_to_pay: {answer: with_a_trade_off, belief_phrase: only by moving money from another tool, belief_sentence: They
      could find the money for it only by moving money from another tool.}
  commercial.buyer_payer_alignment: {answer: someone_else_decides, belief_phrase: the HR director decides and finance pays,
    belief_sentence: 'On buying: the HR director decides and finance pays.'}
  commercial.purchase_friction:
    answer: [finance_approval, it_security]
    belief_phrase: finance's approval and an IT security review
    belief_sentence: Between wanting it and paying, finance's approval and an IT security review could hold them back.
  commercial.commitment:
    answer: [setup, install]
    belief_phrase: connecting it to the learning system
    belief_sentence: For a trial, right now, they would go as far as connecting it to the learning system.
  commercial.retention_potential: {unsure: true, belief_sentence: 'Left out: you weren''t sure.'}
