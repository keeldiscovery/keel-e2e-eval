# REVISION 3, 2026-10-07 -- keel-e2e-eval spec 029 (marks v9, the vector redesign). Re-expressed in
# marks-v9 §4's schema from the revision-2 file of the same name: the market, the statements, the roles
# and the people are kept; each person's first occasion becomes their gate story, and their picks are
# re-chosen by hand against the registry's dimensions. Standings tallied from the picks under the
# compare rules the founder signed on 2026-10-07 (marks-v9 §2.5, spec 029 FR-018).
# B2B: the decision-maker is the `owner` role. The seven crew owners answer Part 3 on their own link
# (`link: COMMERCIAL_B2B`) and the commercial vector is counted over them (six anchored); the crew leads
# answer Parts 1 and 2. The commitment ladder is the B2B one. Money is in USD.
# The gate reads this entry's own window -- a yard run in the last two weeks. Hector Ramirez (three weeks
# ago), Rosa Delgado (six weeks ago) and Cody Brandt (wrote nothing) answer No: 9 of 12, below the
# founder's *nearly all*. Tanner Ellis chips (cant_recall); Brittany Hale's and Hank Odom's are vague.
# problem.urgency carries a belief: NOT_ASKED_YET.
