market: {country: US, region: TX, language: en-US}
statements: {problem: 'Landscaping crew leads in the Dallas suburbs lose about 45 minutes per job waiting at the supply yard
    for mulch, drive 25 to 40 miles a day between the yard and their jobs, and carry three to five cubic yards of mulch 100
    to 200 feet from the truck to the beds by wheelbarrow — every working day through the spring; based on the founder''s
    six years running a crew.', solution: 'The crew lead orders mulch by the cubic yard on a phone the night before; a supplier
    drops it at the curb of the job site at a scheduled hour, so the crew drives straight to the job and skips the yard.',
  commercial: 'The crew owner pays $3.50 per cubic yard delivered, about what they already pay per yard in delivery fees or
    in fuel and time, and sets it up without anyone else''s say-so.'}
